monorepo_root = true

[monorepo]
config_roots = [
  "bootstrap/capabilities/software/sources/shp",
  "bootstrap/capabilities/software/sources/sessions",
]

[tools]
python = "3.14"
node = "24"
stylua = "2.5.2"
opentofu = "1.12.6"
hk = "1.56.1"
markdownlint-cli2 = "0.23.2"
fnox = "latest"
"npm:mcp-remote" = "latest"
"npm:wrangler" = "latest"

[settings]
env_cache = true

[env]
_.source = { path = "scripts/project-secrets.sh", tools = true, redact = true }
_.python.venv = { path = ".venv", create = true }
# Pin uv to mise's interpreter. Left unpinned, uv downloads a Python of its own
# and silently rebuilds .venv underneath mise; pointed at a path, it errors
# instead of falling back to Homebrew's python, whose relinking on
# `brew upgrade` breaks the venv's interpreter mid-run.
# Ask mise for the path it resolved rather than rebuilding it from xdg_data_home
# and the version spec: that spelling ignores MISE_DATA_DIR and names the `3.14`
# alias directory instead of the concrete install pyvenv.cfg records.
UV_PYTHON = { value = "{{ tools.python.path }}/bin/python", tools = true }
SUDO_ASKPASS = "{{config_root}}/scripts/sudo-askpass.sh"

[hooks]
enter = "mise run --quiet bootstrap"

[tasks.bootstrap]
description = "Prepare the repo for a new shell"
depends = ["bootstrap:*"]

[tasks."bootstrap:deps"]
description = "Sync Python dependencies into .venv"
run = "uv sync --dev"
# pyvenv.cfg is a source so that deleting .venv resyncs it: mise recreates the
# venv during env resolution, and the fresh mtime invalidates the cache.
sources = ["pyproject.toml", "uv.lock", ".venv/pyvenv.cfg"]
outputs = { auto = true }
quiet = true

[tasks."bootstrap:agent-deps"]
description = "Install agent tooling development dependencies"
run = '''
# The work machine skips the install (npm rewrites package-lock to the internal
# mirror), but still writes the stamp: a task that succeeds without producing its
# declared output is stale forever and re-runs on every shell entry.
if [ "$(hostname -s)" != "ML-DFC6YK6VJQ" ]; then
  # --no-audit: the audit endpoint is a separate service from the registry and
  # can hang for minutes while package fetches are fine. It blocks every shell
  # entry when it does, and it tells us nothing we act on here.
  scripts/ts-package-json-paths.sh \
    bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions \
    bootstrap/capabilities/agent-harness/configuration/assets/pi/permissions \
    bootstrap/capabilities/agent-harness/configuration/assets/amp/plugins \
    bootstrap/capabilities/agent-harness/configuration/assets/shared/session-recovery |
    while IFS= read -r package_json; do
      package_dir="$(dirname "$package_json")"
      if [ -f "$package_dir/package-lock.json" ]; then
        npm --prefix "$package_dir" ci --silent --no-audit
      fi
    done
fi
mkdir -p bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/node_modules
touch bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/node_modules/agent-deps-stamp
'''
sources = [
  "bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/package.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/package-lock.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/*/package.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/*/package-lock.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/pi/permissions/package.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/pi/permissions/package-lock.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/amp/plugins/package.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/amp/plugins/package-lock.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/shared/session-recovery/package.json",
  "bootstrap/capabilities/agent-harness/configuration/assets/shared/session-recovery/package-lock.json",
  "scripts/ts-package-json-paths.sh",
]
outputs = [
  "bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/node_modules/agent-deps-stamp",
]
quiet = true

# No sources/outputs: the task cache lives in mise's state dir, outside the repo,
# so a delete-and-reclone at the same path would skip this entirely and never set
# the skip-worktree bits. And a merge or rebase can clear those bits with no
# mtime to show for it. Reapplying every entry costs about 8ms.
[tasks."bootstrap:git"]
description = "Install the hk commit hook and hide work-machine lockfile rewrites"
run = '''
# git 2.54+ config hooks: hk registers hook.hk-pre-commit.command in .git/config
# instead of dropping a shim in .git/hooks. Nothing here pins core.hooksPath any
# more, because a config hook cannot be shadowed by a global hooksPath — which is
# the only thing the pin, and .envrc's unset-install-restore dance around it,
# ever defended against.
# --mise wraps the hook in `mise x`, so a commit from an editor or a GUI that
# never activated mise still finds hk and the tools its steps shell out to.
if [ -d .git ] && [ -z "$(git config --local --get hook.hk-pre-commit.command || true)" ]; then
  hk install --mise
fi

if [ "$(hostname -s)" = "ML-DFC6YK6VJQ" ]; then
  # Same three the `pull` task unmasks across a rebase; the two-entry list this
  # inherited from .envrc left the permissions lockfile rewriting itself visibly.
  for f in uv.lock \
           bootstrap/capabilities/agent-harness/configuration/assets/pi/extensions/package-lock.json \
           bootstrap/capabilities/agent-harness/configuration/assets/pi/permissions/package-lock.json; do
    # `git ls-files -v` prefixes a skip-worktree entry with S. Ask before writing:
    # the flag is git index state, not something a timestamp can stand in for.
    case "$(git ls-files -v -- "$f")" in
      S*) ;;
      *) git update-index --skip-worktree "$f" 2>/dev/null ;;
    esac
  done
fi
'''
quiet = true

# ---------------------------------------------------------------------------
# Reconcile: converge a machine against this repo
# ---------------------------------------------------------------------------

[tasks."mise:maintain"]
description = "Update the user-owned mise binary when its daily maintenance is due"
run = 'bootstrap/capabilities/mise/mise-maintain "$HOME/.local/bin/mise" "$HOME/.cache/ansiblonomicon/mise-upgrade.stamp"'

[tasks."mise:install"]
description = "Ensure the user-owned standalone mise exists"
usage = '''
flag "-c --check" help="Report a missing installation without downloading"
'''
run = 'bootstrap/capabilities/mise/install "$HOME/.local/bin/mise" ${usage_check:+--check}'

[tasks."mac-apps"]
description = "Reconcile this Mac's Homebrew and App Store software"
alias = ["homebrew", "mas"]
usage = '''
flag "-c --check" help="Report Brewfile drift without installing or resolving credentials"
'''
run = '''
case "$(hostname -s)" in
  Thurstons-MacBook-Pro)
    brewfile="$MISE_PROJECT_ROOT/bootstrap/capabilities/mac-apps/Brewfile"
    sudo_secret=HOMEBREW_SUDO_ASKPASS_PASS
    ;;
  ML-DFC6YK6VJQ)
    brewfile="$MISE_PROJECT_ROOT/bootstrap/capabilities/mac-apps/Brewfile.work"
    sudo_secret=HOMEBREW_SUDO_ASKPASS_PASS_WORK
    ;;
  *) echo "mac-apps is registered only on Mac laptops" >&2; exit 1 ;;
esac
set -- python3 "$MISE_PROJECT_ROOT/bootstrap/capabilities/mac-apps/reconcile.py" --brewfile "$brewfile"
if [ -n "${usage_check:-}" ]; then
  exec "$@" --check
fi
mise run //:mise:install || exit "$?"
export PATH="$HOME/.local/bin:$PATH"
export SUDO_ASKPASS="$MISE_PROJECT_ROOT/scripts/sudo-askpass.sh"
exec "$MISE_PROJECT_ROOT/scripts/fnox-host" exec --secret "$sudo_secret" -- "$@"
'''

[tasks."language-tools"]
description = "Reconcile this Mac's runtimes and global language tools"
usage = '''
flag "-c --check" help="Validate inventory and report configuration and package work without writes"
'''
run = '''
set -e
set --
case "$(hostname -s)" in
  Thurstons-MacBook-Pro) profile=personal ;;
  ML-DFC6YK6VJQ)
    profile=work
    set -- --extension "$MISE_PROJECT_ROOT/bootstrap/targets/ML-DFC6YK6VJQ/language-tools.local.toml"
    python3 bootstrap/capabilities/language-tools/reconcile.py --profile work "$@" --check
    mise run //:python-index ${usage_check:+--check}
    ;;
  *) echo "language-tools is registered only on Mac laptops" >&2; exit 1 ;;
esac
exec python3 bootstrap/capabilities/language-tools/reconcile.py \
  --profile "$profile" "$@" ${usage_check:+--check}
'''

[tasks.sysconfig]
description = "Reconcile native macOS preferences, sudo Touch ID, and personal hostname"
alias = "macos-system"
usage = '''
flag "-c --check" help="Report drift without writes, sudo, credentials, or app restarts"
flag "--sections <sections>" help="Comma-separated sysconfig sections"
'''
run = '''
host=$(hostname -s)
case "$host" in
  Thurstons-MacBook-Pro) profile=personal; sections=${usage_sections:-dock,finder,nsglobaldomain,menubar,desktop-services,permissions,hostname} ;;
  ML-DFC6YK6VJQ) profile=work; sections=${usage_sections:-dock,finder,nsglobaldomain,menubar,desktop-services,permissions} ;;
  *) echo "sysconfig is registered only on Mac laptops" >&2; exit 1 ;;
esac
case ",$sections," in
  *,hostname,*) [ "$profile" = personal ] || { echo "hostname is intentionally unmanaged on work" >&2; exit 1; } ;;
esac
if [ -z "${usage_check:-}" ] && printf '%s' "$sections" | grep -Eq '(^|,)(permissions|hostname)(,|$)'; then
  export SUDO_ASKPASS="${SUDO_ASKPASS:-$MISE_PROJECT_ROOT/scripts/sudo-askpass.sh}"
fi
exec "$MISE_PROJECT_ROOT/.venv/bin/python" "$MISE_PROJECT_ROOT/bootstrap/capabilities/macos-system/reconcile.py" \
  --target "$MISE_PROJECT_ROOT/bootstrap/targets/$host" --profile "$profile" \
  --sections "$sections" ${usage_check:+--check}
'''

[tasks."software:dispatch"]
description = "Reconcile one native Mac software capability"
usage = '''
arg "capability"
flag "-c --check"
'''
run = '''
host=$(hostname -s)
case "$host:$usage_capability" in
  Thurstons-MacBook-Pro:claude-code|Thurstons-MacBook-Pro:opencode|Thurstons-MacBook-Pro:sessions|Thurstons-MacBook-Pro:shp|Thurstons-MacBook-Pro:uvc-util|Thurstons-MacBook-Pro:berkeley-mono|Thurstons-MacBook-Pro:docker-context) ;;
  ML-DFC6YK6VJQ:pi|ML-DFC6YK6VJQ:sessions|ML-DFC6YK6VJQ:uvc-util|ML-DFC6YK6VJQ:berkeley-mono) ;;
  *) echo "$usage_capability is not registered on $host" >&2; exit 1 ;;
esac
mode=apply
[ -z "${usage_check:-}" ] || mode=check
set -- "$usage_capability" "$MISE_PROJECT_ROOT/bootstrap/targets/$host" "$mode"
[ "$usage_capability" != uvc-util ] || set -- "$@" https://github.com/thurstonsand/uvc-util.git
exec bootstrap/capabilities/software/reconcile "$@"
'''

