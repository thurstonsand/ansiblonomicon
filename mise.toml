[tasks."terminal-theme"]
description = "Reconcile the terminal theme capability on this registered host"
alias = "terminal-theme"
usage = '''
flag "-c --check" help="Show changes without applying them"
'''
run = '''
host=$(hostname -s)
case "$host" in
  pod042|Thurstons-MacBook-Pro|ML-DFC6YK6VJQ) ;;
  *) echo "Unregistered terminal-theme host" >&2; exit 1 ;;
esac
target="$MISE_PROJECT_ROOT/bootstrap/targets/$host"
export MISE_CEILING_PATHS="$MISE_PROJECT_ROOT/bootstrap/targets"
export MISE_TRUSTED_CONFIG_PATHS="$target"
if [ "$host" = pod042 ]; then
  export MISE_ENV=terminal-theme
  parts=dotfiles
else
  export MISE_ENV=terminal-theme,terminal-theme-macos,terminal-theme-files
  parts=files,dotfiles,macos-launchd-agents
fi
if [ -n "${usage_check:-}" ]; then
  exec mise -C "$target" bootstrap --only "$parts" --dry-run
fi
if [ "$host" != pod042 ]; then
  case "$host" in
    ML-DFC6YK6VJQ) sudo_secret=HOMEBREW_SUDO_ASKPASS_PASS_WORK ;;
    *) sudo_secret=HOMEBREW_SUDO_ASKPASS_PASS ;;
  esac
  export SUDO_ASKPASS="$MISE_PROJECT_ROOT/scripts/sudo-askpass.sh"
  exec "$MISE_PROJECT_ROOT/scripts/fnox-host" exec --secret "$sudo_secret" -- \
    sh -ec 'sudo -A -v; exec mise -C "$1" bootstrap --only "$2" --yes' \
    terminal-theme "$target" "$parts"
fi
exec mise -C "$target" bootstrap --only "$parts" --yes
'''

[tasks."git-client"]
description = "Reconcile Git client configuration on this registered host"
usage = '''
flag "-c --check" help="Show changes without applying them"
'''
run = '''
host=$(hostname -s)
case "$host" in
  pod042|Thurstons-MacBook-Pro) environments=vcs-identity,git-client ;;
  ML-DFC6YK6VJQ) environments=vcs-identity,git-client,git-client-work ;;
  *) echo "Unregistered git-client host" >&2; exit 1 ;;
esac
target="$MISE_PROJECT_ROOT/bootstrap/targets/$host"
export MISE_CEILING_PATHS="$MISE_PROJECT_ROOT/bootstrap/targets"
export MISE_TRUSTED_CONFIG_PATHS="$target"
export MISE_ENV="$environments"
if command -v delta >/dev/null 2>&1; then
  export GIT_CLIENT_DELTA=true
else
  export GIT_CLIENT_DELTA=false
fi
if [ -n "${usage_check:-}" ]; then
  exec mise -C "$target" bootstrap --only dotfiles --dry-run
fi
exec mise -C "$target" bootstrap --only dotfiles --yes
'''

