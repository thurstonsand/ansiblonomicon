export MISE_TRUSTED_CONFIG_PATHS="$MISE_PROJECT_ROOT"
export EDITOR_CONFIG_PYTHON="$MISE_PROJECT_ROOT/.venv/bin/python"
export EDITOR_CONFIG_RENDERER="$MISE_PROJECT_ROOT/bootstrap/capabilities/editor-config/render.py"
export EDITOR_CONFIG_MODELS="$MISE_PROJECT_ROOT/bootstrap/capabilities/agent-harness/models.yml"
run_editor_config='exec mise -E editor-config -C "$1" bootstrap --only files,dotfiles "$2"'
if [ -n "${usage_check:-}" ]; then
  export CLI_PROXY_API_KEY=preview CF_ACCESS_CLIENT_ID=preview CF_ACCESS_CLIENT_SECRET=preview
  exec sh -c "$run_editor_config" editor-config "$target" --dry-run
fi
if [ "$profile" = personal ]; then
  exec "$MISE_PROJECT_ROOT/scripts/fnox-host" exec \
    --secret CLI_PROXY_API_KEY --secret CF_ACCESS_CLIENT_ID --secret CF_ACCESS_CLIENT_SECRET -- \
    sh -c "$run_editor_config" editor-config "$target" --yes
fi
exec sh -c "$run_editor_config" editor-config "$target" --yes
'''

[tasks.reconcile]
description = "Reconcile this machine, dispatching on hostname"
usage = '''
flag "-c --check" help="Dry-run mode (no changes made)"
flag "-t --tags <tags>" help="Only run tasks with these tags (comma-separated)"
'''
run = '''
case "$(hostname -s)" in
  ML-DFC6YK6VJQ|Thurstons-MacBook-Pro) exec mise run //:reconcile:laptop ${usage_tags:+--tags "$usage_tags"} ${usage_check:+--check} ;;
  pod042) exec python3 "$MISE_PROJECT_ROOT/scripts/pod042_reconcile.py" ${usage_tags:+"${usage_tags}"} ${usage_check:+--check} ;;
  *) echo "Unregistered reconciliation host" >&2; exit 1 ;;
esac
'''

[tasks."agent-harness"]
description = "Reconcile native agent catalogue, then host configuration"
usage = '''
flag "-c --check" help="Compare cached sources without fetching or writing destinations"
flag "--cached" help="Apply cached sources without fetching"
'''
run = '''
set -e
case "$(hostname -s)" in
  Thurstons-MacBook-Pro|ML-DFC6YK6VJQ)
    "$MISE_PROJECT_ROOT/.venv/bin/python" \
      "$MISE_PROJECT_ROOT/bootstrap/capabilities/agent-harness/agent_harness_deploy.py" \
      --repo "$MISE_PROJECT_ROOT" --home "$HOME" \
      --cache "$HOME/.cache/ansiblonomicon-harness" \
      --host-config "$MISE_PROJECT_ROOT/bootstrap/targets/$(hostname -s)/mise.agent-harness.toml" \
      ${usage_check:+--check} ${usage_cached:+--cached}
    ;;
  pod042)
    uv run --script "$MISE_PROJECT_ROOT/bootstrap/targets/pod042/agent-harness/reconcile.py" \
      ${usage_check:+--check} ${usage_cached:+--cached}
    ;;
  *) echo "Native agent-harness is available only on registered systems" >&2; exit 1 ;;
esac
exec mise run //:agent-config ${usage_check:+--check}
'''

[tasks."agent-config"]
description = "Reconcile native rendered agent configuration only"
usage = '''
flag "-c --check" help="Render and compare without changing files or installing packages"
flag "--real-secrets" help="Resolve secrets during read-only validation"
'''
run = '''
set -e
host=$(hostname -s)
case "$host" in
  ML-DFC6YK6VJQ) set -- --secret ANTHROPIC_AUTH_TOKEN ;;
  Thurstons-MacBook-Pro|pod042) set -- --secret CLI_PROXY_API_KEY --secret PARALLEL_API_KEY ;;
  *) echo "Native agent configuration is available only on registered systems" >&2; exit 1 ;;
esac
if [ -n "${usage_check:-}" ] && [ -z "${usage_real_secrets:-}" ]; then
  exec "$MISE_PROJECT_ROOT/.venv/bin/python" \
    "$MISE_PROJECT_ROOT/bootstrap/capabilities/agent-harness/configuration/deploy.py" \
    --repo "$MISE_PROJECT_ROOT" --home "$HOME" --hostname "$host" --check
fi
set -- "$@" -- \
  "$MISE_PROJECT_ROOT/.venv/bin/python" \
  "$MISE_PROJECT_ROOT/bootstrap/capabilities/agent-harness/configuration/deploy.py" \
  --repo "$MISE_PROJECT_ROOT" --home "$HOME" --hostname "$host"
[ -z "${usage_check:-}" ] || set -- "$@" --check
[ -z "${usage_real_secrets:-}" ] || set -- "$@" --real-secrets
exec "$MISE_PROJECT_ROOT/scripts/fnox-host" exec "$@"
'''

[tasks."reconcile:laptop"]
description = "Reconcile this laptop (auto-detects work vs personal)"
alias = "laptop"
usage = '''
flag "-c --check" help="Dry-run mode (no changes made)"
flag "-t --tags <tags>" help="Only run tasks with these tags (comma-separated)"
'''
run = '''
set -e
case "$(hostname -s)" in
  ML-DFC6YK6VJQ) profile=work ;;
  Thurstons-MacBook-Pro) profile=personal ;;
  *) echo "Unregistered laptop hostname" >&2; exit 1 ;;
esac
software_capabilities="mac-apps language-tools berkeley-mono"
config_capabilities="sysconfig terminal-theme git-client jj-client shell terminal-tools user-tools desktop-tools editor-config neovim"
sysconfig_sections="dock finder nsglobaldomain menubar desktop-services permissions"
case "$profile" in
  personal)
    software_capabilities="$software_capabilities claude-code opencode sessions shp uvc-util docker-context"
    config_capabilities="$config_capabilities ssh-client"
    sysconfig_sections="$sysconfig_sections hostname"
    ;;
  work)
    software_capabilities="$software_capabilities pi sessions uvc-util"
    config_capabilities="$config_capabilities python-index work-local"
    ;;
esac
normalized_tags=$(printf '%s' "${usage_tags:-}" | tr ',' '\n' | sed 's/^homebrew$/mac-apps/; s/^mas$/mac-apps/; s/^tmux$/terminal-tools/; s/^nvim-deps$/neovim/' | awk '!seen[$0]++' | paste -sd, -)
if [ "$profile" = work ]; then
  case ",$normalized_tags," in
    *,ssh-client,*) echo "ssh-client is intentionally unavailable on the work host" >&2; exit 1 ;;
    *,docker-context,*) echo "docker-context is intentionally unavailable on the work host" >&2; exit 1 ;;
    *,hostname,*) echo "hostname is intentionally unmanaged on the work host" >&2; exit 1 ;;
  esac
fi
supported=" all mise agent-harness agent-config $software_capabilities $config_capabilities $sysconfig_sections "
unsupported=
for tag in $(printf '%s' "$normalized_tags" | tr ',' ' '); do
  case "$supported" in
    *" $tag "*) ;;
    *) unsupported="${unsupported:+$unsupported,}$tag" ;;
  esac
done
if [ -n "$unsupported" ]; then
  echo "Unsupported $profile-host tags: $unsupported" >&2
  exit 1
fi
case ",${normalized_tags}," in
  ,,|*,all,*|*,mise,*|*,mac-apps,*) mise run //:mise:install ${usage_check:+--check} || exit "$?" ;;
esac
if [ -z "${usage_check:-}" ]; then
  mise run //:mise:maintain
fi
export PATH="$HOME/.local/bin:$PATH"
full=
case ",${normalized_tags}," in ,,|*,all,*) full=true ;; esac
for native_capability in $software_capabilities; do
  case ",$normalized_tags," in
    ,,|*,all,*|*,"$native_capability",*) mise run "//:$native_capability" ${usage_check:+--check} || exit "$?" ;;
  esac
done
selected_sections=$(printf '%s' "$normalized_tags" | tr ',' '\n' | grep -E '^(dock|finder|nsglobaldomain|menubar|desktop-services|permissions|hostname)$' | paste -sd, -)
case ",$normalized_tags," in
  ,,|*,all,*|*,sysconfig,*) mise run //:sysconfig ${usage_check:+--check} || exit "$?" ;;
  *) [ -z "$selected_sections" ] || mise run //:sysconfig --sections "$selected_sections" ${usage_check:+--check} || exit "$?" ;;
esac
case ",$normalized_tags," in
  ,,|*,all,*|*,agent-harness,*) mise run //:agent-harness ${usage_check:+--check} || exit "$?" ;;
  *,agent-config,*) mise run //:agent-config ${usage_check:+--check} || exit "$?" ;;
esac
for native_capability in $config_capabilities; do
  [ "$native_capability" != sysconfig ] || continue
  # language-tools already reconciles work's Python index prerequisite.
  if [ -n "$full" ] && [ "$native_capability" = python-index ]; then continue; fi
  case ",$normalized_tags," in
    ,,|*,all,*|*,"$native_capability",*) ;;
    *) continue ;;
  esac
  mise run "//:$native_capability" ${usage_check:+--check} || exit "$?"
done
'''

[tasks."reconcile:udmp"]
