'''

[tasks.shell]
description = "Reconcile shared shell configuration on this registered host"
usage = '''
flag "-c --check" help="Show changes without applying them"
'''
run = '''
host=$(hostname -s)
case "$host" in
  pod042|Thurstons-MacBook-Pro) environments=shell,shell-personal; parts=files,dotfiles; work=false ;;
  ML-DFC6YK6VJQ) environments=shell,shell-work; parts=files,dotfiles; work=true ;;
  *) echo "Unregistered shell host" >&2; exit 1 ;;
esac
target="$MISE_PROJECT_ROOT/bootstrap/targets/$host"
run_shell='set -e
if [ "$6" = true ] && [ -z "${SOURCEGRAPH_TOKEN:-}" ]; then
  echo "SOURCEGRAPH_TOKEN is required for work shell apply" >&2
  exit 1
fi
export MISE_CEILING_PATHS="$1/bootstrap/targets" MISE_TRUSTED_CONFIG_PATHS="$2" MISE_ENV="$3"
exec mise -C "$2" bootstrap --only "$4" "$5"'
if [ -n "${usage_check:-}" ]; then
  if [ "$work" = true ]; then export SOURCEGRAPH_TOKEN=preview; fi
  exec sh -c "$run_shell" shell "$MISE_PROJECT_ROOT" "$target" "$environments" "$parts" --dry-run false
fi
if [ "$work" = true ]; then
  export SUDO_ASKPASS="$MISE_PROJECT_ROOT/scripts/sudo-askpass.sh"
  exec "$MISE_PROJECT_ROOT/scripts/fnox-host" exec \
    --secret SOURCEGRAPH_TOKEN --secret HOMEBREW_SUDO_ASKPASS_PASS_WORK -- \
    sh -ec ': "${SOURCEGRAPH_TOKEN:?SOURCEGRAPH_TOKEN is required for work shell apply}"; sudo -A -v; exec sh -c "$1" shell "$2" "$3" "$4" "$5" --yes true' \
    shell "$run_shell" "$MISE_PROJECT_ROOT" "$target" "$environments" "$parts"
fi
exec sh -c "$run_shell" shell "$MISE_PROJECT_ROOT" "$target" "$environments" "$parts" --yes
'''

