---
# Shared configuration variables

# User configuration
configure_user: thurstonsand

# Feature flags (all platforms)
configure_dotfiles: true
configure_chezmoi: true
configure_agent_harness: true

# Chezmoi configuration
chezmoi_source_dir: "{{ playbook_dir }}/../../chezmoi"

# Global uv tools (base set for all hosts)
uv_global_tools_base:
  - claude-code-tools
  - showboat

# Global mise tools (base set for all hosts)
# Keep Node on active LTS. Homebrew's unversioned node formula tracks current release,
# which can outrun native npm packages used by global CLI tools.
mise_global_tools_base:
  - node@lts
  - golangci-lint@latest

# Global npm packages (base set for all hosts)
npm_global_packages_base:
  - "@earendil-works/pi-coding-agent"
  - "@steipete/oracle"
  - agent-browser
  - hunkdiff

# Global bun packages (base set for all hosts)
bun_global_packages_base: []

# Cargo packages
cargo_packages_base: []

# Global Ruby gems (base set for all hosts)
gem_packages_base: []

# Global Go tools (base set for all hosts)
go_tools_base:
  - github.com/steipete/eightctl/cmd/eightctl

# Combined lists (base + host-specific extras)
go_tools: "{{ (go_tools_base | default([])) + (go_tools_extra | default([])) }}"
uv_global_tools: "{{ (uv_global_tools_base | default([])) + (uv_global_tools_extra | default([])) }}"
mise_global_tools: "{{ (mise_global_tools_base | default([])) + (mise_global_tools_extra | default([])) }}"
npm_global_packages: "{{ (npm_global_packages_base | default([])) + (npm_global_packages_extra | default([])) }}"
bun_global_packages: "{{ (bun_global_packages_base | default([])) + (bun_global_packages_extra | default([])) }}"
cargo_packages: "{{ (cargo_packages_base | default([])) + (cargo_packages_extra | default([])) }}"
gem_packages: "{{ (gem_packages_base | default([])) + (gem_packages_extra | default([])) }}"

# Agent Harness configuration
agent_harness_target_agents_base:
  - claude
  - amp
  - codex
  - opencode
  - pi
agent_harness_target_agents: "{{ (agent_harness_target_agents_base | default([])) + (agent_harness_target_agents_extra | default([])) }}"

agent_harness_sources_base:
  - repo: anthropics/claude-plugins-official
    pull: true
    plugins:
      - name: code-simplifier
        target_agents: [amp, codex, opencode, pi]

  - repo: addyosmani/agent-skills
    pull: true
    plugins:
      - name: code-simplification
        path: skills/code-simplification
  #   # for use in testing if needed
  #   - name: commit-commands
  #   target_agents: [claude] # commands only for Claude (testing)
  #   exclude_commands:
  #     - clean_gone

  - repo: FrancyJGLisboa/agent-skill-creator
    pull: true
    plugins:
      - name: agent-skill-creator
        path: .
        skills: []
        exclude_data:
          - .gitignore
          - Dynamous
          - exports
          - README.md
          - install.sh
          - references/examples
          - references/phase5-implementation.md
          - references/templates
          - registry
          - scripts/bootstrap.sh
          - scripts/install-skill.sh

  - repo: pchalasani/claude-code-tools
    pull: true
    plugins:
      - tmux-cli

  - repo: vercel-labs/agent-browser
    pull: true
    plugins:
      - name: agent-browser
        target_agents: [claude, amp, codex, opencode, pi]
        skills: skills
        exclude_skills:
          - dogfood
          - slack
          - vercel-sandbox

  - repo: pbakaus/impeccable
    pull: true
    plugins:
      - name: impeccable
        path: .claude
        skills: skills
        exclude_skills:
          - adapt # adapt layouts/interaction patterns for other devices and contexts
          - animate # add purposeful motion and transitions
          - audit # perform structured UI quality/a11y/performance review
          - bolder # push a timid design toward a stronger visual direction
          - clarify # improve unclear UX copy and messaging
          - colorize # introduce more strategic, intentional color
          - critique # provide design/UX critique with strengths and weaknesses
          - delight # add small moments of joy and personality
          - distill # strip the interface down to its essential elements
          - extract # pull repeated patterns into reusable components
          - harden # improve resilience, edge cases, i18n, and error handling
          - normalize # align the UI with design-system consistency
          - onboard # design or improve onboarding flows
          - optimize # improve performance and implementation efficiency
          - polish # do a final refinement pass before shipping
          - quieter # tone down an overly loud visual treatment
          - arrange # improve layout, spacing, and visual hierarchy
          - frontend-design # deprecated; replaced by /impeccable
          - overdrive # push interfaces into technically ambitious territory
          - teach-impeccable # deprecated; replaced by /impeccable teach
          - typeset # refine typography, hierarchy, and readability

  - repo: steipete/oracle
    pull: true
    plugins:
      - name: oracle
        path: skills
        target_agents: [claude, codex, opencode, pi, openclaw]

  - repo: modem-dev/hunk
    pull: true
    plugins:
      - name: hunk
        path: skills

  - local: "{{ playbook_dir }}/../../agents"
    plugins:
      - name: amp
        target_agents: [amp]
        exclude_skills:
          - tmux-interactive-sessions
      - name: pi
        target_agents: [pi]
      - name: project-management
        target_agents: [openclaw]
        exclude_skills:
          - designing-systems
          - humanizer
          - pr
      - name: project-management
        target_agents: [pi]
        exclude_skills:
          - grill-me
      - name: project-management
        target_agents: [claude, amp, codex, opencode]
      - name: claude
        target_agents: [claude]
      - homelab

agent_harness_sources: "{{ (agent_harness_sources_base | default([])) + (agent_harness_sources_extra | default([])) }}"
