---
# Shared configuration variables

# User configuration
configure_user: thurstonsand

# Feature flags (all platforms)
configure_dotfiles: true
configure_chezmoi: true
configure_agent_harness: true

# Chezmoi configuration
chezmoi_source_dir: "{{ playbook_dir }}/../chezmoi"

# Global uv tools (base set for all hosts)
uv_global_tools_base:
  - claude-code-tools
  - showboat

# Global npm packages (base set for all hosts)
npm_global_packages_base:
  - "@mariozechner/pi-coding-agent"
  - agent-browser
  - openclaw

# Global bun packages (base set for all hosts)
bun_global_packages_base: []

# Cargo packages installed via cargo-binstall (base set for all hosts)
cargo_packages_base:
  - cargo-binstall

# Global Go tools (base set for all hosts)
go_tools_base:
  - github.com/steipete/eightctl/cmd/eightctl

# Combined lists (base + host-specific extras)
go_tools: "{{ (go_tools_base | default([])) + (go_tools_extra | default([])) }}"
uv_global_tools: "{{ (uv_global_tools_base | default([])) + (uv_global_tools_extra | default([])) }}"
npm_global_packages: "{{ (npm_global_packages_base | default([])) + (npm_global_packages_extra | default([])) }}"
bun_global_packages: "{{ (bun_global_packages_base | default([])) + (bun_global_packages_extra | default([])) }}"
cargo_packages: "{{ (cargo_packages_base | default([])) + (cargo_packages_extra | default([])) }}"

# Agent Harness configuration
agent_harness_target_agents:
  - claude
  - amp
  - codex
  - opencode

agent_harness_sources:
  - repo: anthropics/claude-plugins-official
    pull: true
    plugins:
      - frontend-design
      - code-simplifier
  #   # for use in testing if needed
  #   - name: commit-commands
  #   target_agents: [claude] # commands only for Claude (testing)
  #   exclude_commands:
  #     - clean_gone

  - repo: FrancyJGLisboa/agent-skill-creator
    pull: true
    plugins:
      - name: agent-skill-creator-plugin
        exclude_skills:
          - article-to-prototype-cskill
        exclude_data:
          - references/examples
          - references/templates
          - references/tools
          - exports
          - integrations
          - article-to-prototype-cskill
          - README.md

  - repo: pchalasani/claude-code-tools
    pull: true
    plugins:
      - tmux-cli

  - repo: vercel-labs/agent-browser
    pull: true
    plugins:
      - name: agent-browser
        path: skills/agent-browser

  - local: "{{ playbook_dir }}/../../agents"
    plugins:
      - name: amp
        target_agents: [amp]
        exclude_skills:
          - tmux-interactive-sessions
      - project-management
      - homelab
