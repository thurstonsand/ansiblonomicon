---
# Shared configuration variables

# User configuration
configure_user: thurstonsand

# Feature flags (all platforms)
configure_dotfiles: true
configure_chezmoi: true
configure_agent_harness: true

# Chezmoi configuration
chezmoi_source_dir: "{{ playbook_dir }}/../../chezmoi"

# Global uv tools (base set for all hosts)
uv_global_tools_base:
  - claude-code-tools

# Global mise tools (base set for all hosts)
# Keep Node on active LTS. Homebrew's unversioned node formula tracks current release,
# which can outrun native npm packages used by global CLI tools.
mise_global_tools_base:
  - node@lts
  - npm@latest
  - golangci-lint@latest

# Tools whose mise config goes beyond a version string, written straight to
# mise's global config file (see the language_tools role).
# override this wholesale.
mise_tool_config: {}

# Global npm packages (base set for all hosts)
npm_global_packages_base:
  - "@earendil-works/pi-coding-agent"
  - agent-browser
  - hunkdiff
  - sideshow

# npm blocks lifecycle scripts by default. Packages listed here are trusted to
# run theirs; without it they install but ship no working binary.
npm_allow_scripts_base:
  - agent-browser

# Global bun packages (base set for all hosts)
bun_global_packages_base: []

# Cargo packages
cargo_packages_base:
  - terminal-control

# Global Ruby gems (base set for all hosts)
gem_packages_base: []

# Global Go tools (base set for all hosts)
go_tools_base:
  - github.com/steipete/eightctl/cmd/eightctl
  - mvdan.cc/gofumpt@latest

# Combined lists (base + host-specific extras)
go_tools: "{{ (go_tools_base | default([])) + (go_tools_extra | default([])) }}"
uv_global_tools: "{{ (uv_global_tools_base | default([])) + (uv_global_tools_extra | default([])) }}"
mise_global_tools: "{{ (mise_global_tools_base | default([])) + (mise_global_tools_extra | default([])) }}"
npm_global_packages: "{{ (npm_global_packages_base | default([])) + (npm_global_packages_extra | default([])) }}"
npm_allow_scripts: "{{ ((npm_allow_scripts_base | default([])) + (npm_allow_scripts_extra | default([]))) | sort }}"
bun_global_packages: "{{ (bun_global_packages_base | default([])) + (bun_global_packages_extra | default([])) }}"
cargo_packages: "{{ (cargo_packages_base | default([])) + (cargo_packages_extra | default([])) }}"
gem_packages: "{{ (gem_packages_base | default([])) + (gem_packages_extra | default([])) }}"

# Agent Harness configuration
agent_harness_target_agents_base:
  - claude
  - amp
  - codex
  - opencode
  - pi
agent_harness_target_agents: "{{ (agent_harness_target_agents_base | default([])) + (agent_harness_target_agents_extra | default([])) }}"

agent_harness_sources_base:
  - repo: mattpocock/skills
    pull: true
    plugins:
      - name: mattpocock-skills
        prefix: ""
        exclude_skills:
          - ask-matt
          - code-review
          - codebase-design
          - diagnosing-bugs
          - domain-modeling
          - grill-me
          - grilling
          - handoff
          - grill-with-docs
          - improve-codebase-architecture
          - triage
          - implement
          - setup-matt-pocock-skills
          - tdd
          - prototype
          - research
          - to-spec
          - to-tickets
          - wait-what
          - wayfinder

  - repo: vercel-labs/agent-browser
    pull: true
    plugins:
      - name: agent-browser
        target_agents: [claude, amp, opencode, pi]
        skills: skills
        exclude_skills:
          - dogfood
          - slack
          - vercel-sandbox

  - repo: modem-dev/hunk
    pull: true
    plugins:
      - name: hunk
        path: skills
        prefix: ""
        exclude_skills:
          - launch-video # Hunk maintainer-only: needs a hunk source checkout we do not have.

  - repo: anomalyco/terminal-control
    pull: true
    plugins:
      - name: terminal-control
        path: skills/terminal-control

  - local: "{{ playbook_dir }}/../../agents"
    plugins:
      - name: pi
        target_agents: [pi]
      - name: project-management
        target_agents: [pi]
        exclude_skills:
          - grill-me
      - name: project-management
        target_agents: [claude, amp, codex, opencode]
      - name: claude
        target_agents: [claude]
      - name: codex
        target_agents: [codex]
      - homelab

agent_harness_sources: "{{ (agent_harness_sources_base | default([])) + (agent_harness_sources_extra | default([])) }}"
