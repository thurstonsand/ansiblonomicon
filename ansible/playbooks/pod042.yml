---
# pod042 configures itself from its persistent ansiblonomicon checkout.
# Run on the VM with: uv run poe pod042
- name: Configure pod042
  hosts: pod042
  vars_files:
    - ../config.yml
    - ../models.yml

  pre_tasks:
    - name: Load pod042-specific config
      ansible.builtin.include_vars: ../pod042.config.yml
      tags: [always]

    - name: Require local execution on pod042
      ansible.builtin.assert:
        that:
          - ansible_connection == "local"
          - ansible_facts.hostname == hostname
        fail_msg: >-
          This playbook runs only inside pod042. SSH to pod042 and run
          `uv run poe pod042` from the ansiblonomicon checkout.
      tags: [always]

    - name: Display system info
      ansible.builtin.debug:
        msg: >-
          Configuring {{ ansible_facts.os_family }}
          ({{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }})
      tags: [always]

  tasks:
    - name: Update apt cache and upgrade all packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      tags: [apt]

    - name: Install apt repository prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gpg
        state: present
      tags: [apt, apt-repos]

    - name: Configure external apt repositories
      become: true
      tags: [apt, apt-repos]
      block:
        - name: Ensure apt keyring directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - /usr/share/keyrings
            - /etc/apt/keyrings

        - name: Download external repository keys
          ansible.builtin.get_url:
            url: "{{ item.key_url }}"
            dest: "{{ item.key_path }}"
            mode: "0644"
          loop: "{{ apt_external_repos }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Add external repositories
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch=amd64 signed-by={{ item.key_path }}]
              {{ item.url }} {{ item.suites }} {{ item.components }}
            filename: "{{ item.name }}"
            state: present
          loop: "{{ apt_external_repos }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Install external repository packages
          ansible.builtin.apt:
            name: "{{ apt_external_repos | map(attribute='packages') | flatten }}"
            state: present
            update_cache: true

    - name: Install base apt packages
      become: true
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
      tags: [apt]

    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"
      tags: [apt, uv, secrets, onepassword, op]

    - name: Install uv for local self-management
      tags: [uv]
      block:
        - name: Check whether uv is installed
          ansible.builtin.stat:
            path: "{{ ansible_facts.env.HOME }}/.local/bin/uv"
          register: pod042_uv_binary

        - name: Download uv installer
          when: not pod042_uv_binary.stat.exists
          ansible.builtin.get_url:
            url: https://astral.sh/uv/install.sh
            dest: /tmp/uv-install.sh
            mode: "0755"

        - name: Run uv installer
          when: not pod042_uv_binary.stat.exists
          ansible.builtin.command:
            cmd: /tmp/uv-install.sh
            creates: "{{ ansible_facts.env.HOME }}/.local/bin/uv"

    - name: Configure user npm global prefix
      tags: [npm]
      block:
        - name: Ensure npm global directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.npm-global/bin"
            state: directory
            mode: "0755"

        - name: Set npm global prefix to user directory
          ansible.builtin.command:
            cmd: npm config set prefix "{{ ansible_facts.env.HOME }}/.npm-global"
            creates: "{{ ansible_facts.env.HOME }}/.npmrc"

    - name: Configure 1Password service account access
      ansible.builtin.include_role:
        name: op_service_account
        apply:
          tags: [secrets, onepassword, op]
      tags: [secrets, onepassword, op]

    - name: Install bootstrap language tools
      ansible.builtin.include_role:
        name: language_tools
        apply:
          tags: [language-tools]
      tags: [language-tools]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: [chezmoi, dotfiles]
      when: configure_chezmoi
      tags: [chezmoi, dotfiles]

    - name: Deploy Pi agent resources
      ansible.builtin.include_role:
        name: agent_harness
        apply:
          tags: [agent-harness]
      when: configure_agent_harness
      tags: [agent-harness]
