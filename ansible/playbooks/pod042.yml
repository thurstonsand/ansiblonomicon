---
# pod042 — the Bunker. Plain Debian 13 on the old NAS hardware: ZFS storage
# services, the docker stacks, and the host's own dev environment.
# It configures itself from its persistent ansiblonomicon checkout.
# Run on the host with: mise pod042
- name: Configure pod042
  hosts: pod042
  vars_files:
    - ../config.yml
    - ../agent-harness.config.yml
    - ../models.yml

  pre_tasks:
    - name: Load pod042-specific config
      ansible.builtin.include_vars: ../pod042.config.yml
      tags: [always]

    - name: Require local execution on pod042
      ansible.builtin.assert:
        that:
          - ansible_connection == "local"
          - ansible_facts.hostname == hostname
          # The retired pod042 VM shares the hostname until cutover; this
          # playbook must only ever converge the physical machine. The VM
          # converge test opts out with -e pod042_allow_virtual=true.
          - ansible_facts.virtualization_role != "guest" or (pod042_allow_virtual | default(false) | bool)
        fail_msg: >-
          This playbook runs only on the physical pod042 host. SSH to pod042
          and run `mise pod042` from the ansiblonomicon checkout.
      tags: [always]

    - name: Remove retired managed paths
      ansible.builtin.import_tasks: ../tasks/remove_retired_paths.yml
      tags: [always]

    - name: Display system info
      ansible.builtin.debug:
        msg: >-
          Configuring {{ ansible_facts.os_family }}
          ({{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }})
      tags: [always]

  tasks:
    # ===================
    # Base system
    # ===================
    - name: Install and update mise
      ansible.builtin.include_role:
        name: mise
        apply:
          tags: [mise]
      tags: [mise]

    - name: Update apt cache and upgrade all packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      tags: [apt]

    - name: Install apt repository prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gpg
        state: present
      tags: [apt, apt-repos]

    - name: Configure external apt repositories
      become: true
      tags: [apt, apt-repos]
      block:
        - name: Ensure apt keyring directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - /usr/share/keyrings
            - /etc/apt/keyrings

        - name: Download external repository keys
          ansible.builtin.get_url:
            url: "{{ item.key_url }}"
            dest: "{{ item.key_path }}"
            mode: "0644"
          loop: "{{ apt_external_repos }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Remove retired pod042 repositories
          ansible.builtin.apt_repository:
            repo: "{{ item }}"
            state: absent
          loop: "{{ apt_retired_repos }}"

        - name: Add external repositories
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch=amd64 signed-by={{ item.key_path }}]
              {{ item.url }} {{ item.suites }} {{ item.components }}
            filename: "{{ item.name }}"
            state: present
          loop: "{{ apt_external_repos }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Install external repository packages
          ansible.builtin.apt:
            name: "{{ apt_external_repos | map(attribute='packages') | flatten }}"
            state: present
            update_cache: true

    - name: Install base apt packages
      become: true
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
      tags: [apt]

    - name: Use zsh as the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh
      tags: [apt, zsh]

    - name: Configure sshd
      ansible.builtin.include_role:
        name: sshd
        apply:
          tags: [sshd, ssh]
      tags: [sshd, ssh]

    # ===================
    # Storage
    # ===================
    # The stack templates still name the TrueNAS-era pool mountpoints. These
    # links let them deploy unchanged on move day; they retire when the
    # templates are repathed onto ark/black-box after the move.
    - name: Link the TrueNAS-era pool mountpoints
      become: true
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.path }}"
        state: link
        force: false
      loop: "{{ pod042_legacy_pool_links }}"
      loop_control:
        label: "{{ item.path }}"
      tags: [storage, legacy-paths]

    # ZFS on Linux defaults to acltype=off. Without POSIX ACLs the named ACL
    # below cannot be set at all, and Samba has nowhere to keep its extended
    # attributes; xattr=sa keeps those out of hidden directories.
    - name: Enable POSIX ACLs on the pools
      become: true
      community.general.zfs:
        name: "{{ item }}"
        state: present
        extra_zfs_properties:
          acltype: posixacl
          xattr: sa
      loop: "{{ pod042_pools }}"
      tags: [storage, zfs, acls]

    - name: Configure alerting
      ansible.builtin.include_role:
        name: alerting
        apply:
          tags: [alerting]
      tags: [alerting]

    - name: Configure ZFS maintenance
      ansible.builtin.include_role:
        name: zfs_maintenance
      tags: [storage, zfs, sanoid, snapshots, scrub, smart, smartd, zed]

    - name: Configure SMB shares
      ansible.builtin.include_role:
        name: samba
        apply:
          tags: [samba, shares]
      tags: [samba, shares]

    # ===================
    # Host network (TrueNAS-era topology: br0 + VLAN subinterfaces,
    # macvlan parents for docker — retires with post-move debridging)
    # ===================
    - name: Configure bridge and VLAN interfaces
      ansible.builtin.include_role:
        name: host_network
        apply:
          become: true
          tags: [network, host-network]
      tags: [network, host-network]

    # ===================
    # Docker
    # ===================
    - name: Install the docker engine
      become: true
      ansible.builtin.apt:
        name: "{{ docker_engine_packages + ['acl'] }}"
        state: present
      tags: [docker, docker-engine]

    - name: Enable the docker daemon
      become: true
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
      tags: [docker, docker-engine]

    - name: Let the reconciling user drive docker
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true
      tags: [docker, docker-engine]

    # The tree belongs to the containers' uid/gid ({{ docker.user.id }}, the
    # TrueNAS-era numbering); docker_stack syncs into it with become, so nobody
    # needs a login user's write access here.
    - name: Ensure the docker config tree exists
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ docker.user.puid }}"
        group: "{{ docker.user.pgid }}"
        mode: "0770"
      loop:
        - "{{ docker.config_base }}"
        - "{{ docker.config_base }}/stacks"
      tags: [docker, docker-stack-role]

    - name: Create trusted macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: trusted
        driver: macvlan
        driver_options:
          parent: br0.1
        ipam_config:
          - subnet: 192.168.1.0/24
            iprange: 192.168.1.224/27
        state: present

    - name: Create iot macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: iot
        driver: macvlan
        driver_options:
          parent: br0.2
        ipam_config:
          - subnet: 192.168.3.0/24
            iprange: 192.168.3.224/27
        state: present

    - name: Create external macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: external
        driver: macvlan
        driver_options:
          parent: br0.3
        ipam_config:
          - subnet: 192.168.5.0/24
            iprange: 192.168.5.224/27
        state: present

    - name: Create personal macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: personal
        driver: macvlan
        driver_options:
          parent: br0.4
        ipam_config:
          - subnet: 192.168.6.0/24
            iprange: 192.168.6.224/27
        state: present

    # ===================
    # Docker stacks
    # ===================
    - name: Deploy anypod stack
      tags: [docker-stack-role, anypod]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, anypod]
      vars:
        docker_stack_name: anypod

    # Torrent seeding/removal policy is documented in docs/operations/media-torrent-seeding.md.
    # Do not use global qBittorrent seed limits to force Arr cleanup; private trackers need long-lived seeds.
    - name: Deploy arr-apps stack
      tags: [docker-stack-role, arr-apps]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, arr-apps]
      vars:
        docker_stack_name: arr-apps

    - name: Ensure Caddy srv directory exists
      tags: [docker-stack-role, caddy]
      become: true
      ansible.builtin.file:
        path: "{{ docker.config_base }}/caddy/srv"
        state: directory
        mode: "0755"
        owner: "{{ docker.user.puid }}"
        group: "{{ docker.user.pgid }}"

    - name: Deploy caddy stack
      tags: [docker-stack-role, caddy]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, caddy]
      vars:
        docker_stack_name: caddy

    - name: Deploy cli-proxy-api stack
      tags: [docker-stack-role, cli-proxy-api]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, cli-proxy-api]
      vars:
        docker_stack_name: cli-proxy-api
        docker_stack_pull_policy: always

    - name: Deploy cloudflared stack
      tags: [docker-stack-role, cloudflared]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, cloudflared]
      vars:
        docker_stack_name: cloudflared

    - name: Deploy ddclient stack
      tags: [docker-stack-role, ddclient]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, ddclient]
      vars:
        docker_stack_name: ddclient

    - name: Deploy ghost stack
      tags: [docker-stack-role, ghost]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, ghost]
      vars:
        docker_stack_name: ghost

    - name: Restart ghost to pick up theme/routes changes
      tags: [docker-stack-role, ghost]
      ansible.builtin.command:
        cmd: docker restart ghost
      when: _docker_stack_changed | default(false)
      changed_when: _docker_stack_changed | default(false)

    - name: Deploy homepage stack
      tags: [docker-stack-role, homepage]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, homepage]
      vars:
        docker_stack_name: homepage

    - name: Deploy isponsorblocktv stack
      tags: [docker-stack-role, isponsorblocktv]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, isponsorblocktv]
      vars:
        docker_stack_name: isponsorblocktv

    - name: Deploy plex stack
      tags: [docker-stack-role, plex]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, plex]
      vars:
        docker_stack_name: plex

    - name: Register the PON monitor check
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.include_role:
        name: alerting
        tasks_from: check.yml
        apply:
          tags: [docker-stack-role, pon-monitor]
      vars:
        alerting_check_name: "{{ ansible_facts.hostname }}-pon-monitor"
        alerting_check_schedule: "*/5 * * * *"
        alerting_check_grace: 1800
        alerting_check_install_url: false

    - name: Publish the PON monitor ping URL to its stack
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.set_fact:
        pon_monitor_ping_url: "{{ alerting_check_ping_url }}"
      no_log: true

    - name: Ensure the PON monitor data directory exists
      become: true
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.file:
        path: "{{ docker.config_base }}/pon-monitor/pon-monitor/data"
        state: directory
        mode: "0755"
        owner: "{{ docker.user.puid }}"
        group: "{{ docker.user.pgid }}"

    - name: Deploy pon-monitor stack
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, pon-monitor]
      vars:
        docker_stack_name: pon-monitor

    # Torrent seeding/removal policy is documented in docs/operations/media-torrent-seeding.md.
    # Do not use global qBittorrent seed limits to force Arr cleanup; private trackers need long-lived seeds.
    - name: Register the MAM session update check
      tags: [docker-stack-role, torrent]
      ansible.builtin.include_role:
        name: alerting
        tasks_from: check.yml
        apply:
          tags: [docker-stack-role, torrent]
      vars:
        alerting_check_name: "{{ ansible_facts.hostname }}-mam-update"
        alerting_check_schedule: "*/30 * * * *"
        alerting_check_grace: 5400
        alerting_check_install_url: false

    - name: Publish the MAM ping URL to the torrent stack
      tags: [docker-stack-role, torrent]
      ansible.builtin.set_fact:
        torrent_mam_ping_url: "{{ alerting_check_ping_url }}"
      no_log: true

    - name: Deploy torrent stack
      tags: [docker-stack-role, torrent]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, torrent]
      vars:
        docker_stack_name: torrent
        docker_stack_pause_containers: [torrent-netns-repair]

    - name: Deploy watchtower stack
      tags: [docker-stack-role, watchtower]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          become: true
          tags: [docker-stack-role, watchtower]
      vars:
        docker_stack_name: watchtower
        docker_stack_pull_policy: always

    # ===================
    # Host tooling
    # ===================
    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"
      tags: [apt, uv, secrets, onepassword, op]

    - name: Link fd to Debian's fdfind binary
      ansible.builtin.file:
        src: /usr/bin/fdfind
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/fd"
        state: link
      tags: [apt]

    - name: Install uv for local self-management
      tags: [uv]
      block:
        - name: Check whether uv is installed
          ansible.builtin.stat:
            path: "{{ ansible_facts.env.HOME }}/.local/bin/uv"
          register: pod042_uv_binary

        - name: Download uv installer
          when: not pod042_uv_binary.stat.exists
          ansible.builtin.get_url:
            url: https://astral.sh/uv/install.sh
            dest: /tmp/uv-install.sh
            mode: "0755"

        - name: Run uv installer
          when: not pod042_uv_binary.stat.exists
          ansible.builtin.command:
            cmd: /tmp/uv-install.sh
            creates: "{{ ansible_facts.env.HOME }}/.local/bin/uv"

    - name: Configure user npm global prefix
      tags: [npm]
      block:
        - name: Ensure npm global directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.npm-global/bin"
            state: directory
            mode: "0755"

        - name: Set npm global prefix to user directory
          ansible.builtin.command:
            cmd: npm config set prefix "{{ ansible_facts.env.HOME }}/.npm-global"
            creates: "{{ ansible_facts.env.HOME }}/.npmrc"

    - name: Configure 1Password service account access
      ansible.builtin.include_role:
        name: op_service_account
        apply:
          tags: [secrets, onepassword, op]
      tags: [secrets, onepassword, op]

    # Backups follow the service account role: systemd hands the backup units
    # that 1Password token as a credential, so it has to be on disk first.
    - name: Configure offsite backups
      ansible.builtin.include_role:
        name: restic_backup
        apply:
          tags: [restic, backup]
      tags: [restic, backup]

    - name: Install global language tools
      ansible.builtin.include_role:
        name: language_tools
        apply:
          tags: [language-tools]
      tags: [language-tools]

    - name: Build sessions CLI for agent session recovery
      ansible.builtin.include_role:
        name: sessions
        apply:
          tags: [sessions]
      tags: [sessions]

    - name: Configure shpool shell persistence
      ansible.builtin.include_role:
        name: shpool
        apply:
          tags: [shpool]
      tags: [shpool]

    - name: Configure terminal theme mirror
      ansible.builtin.include_role:
        name: terminal_theme
        apply:
          tags: [terminal-theme]
      when: configure_terminal_theme
      tags: [terminal-theme]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: [chezmoi, dotfiles]
      when: configure_chezmoi
      tags: [chezmoi, dotfiles]

    - name: Upgrade Neovim dependencies
      ansible.builtin.include_tasks:
        file: ../tasks/neovim_deps.yml
        apply:
          tags: [neovim, nvim-deps]
      vars:
        neovim_plugins_mode: restore
      tags: [neovim, nvim-deps]

    - name: Deploy Pi agent resources
      ansible.builtin.include_role:
        name: agent_harness
        apply:
          tags: [agent-harness]
      when: configure_agent_harness
      tags: [agent-harness]

    - name: Install tmux plugin manager and plugins
      ansible.builtin.include_tasks:
        file: ../tasks/tmux_plugins.yml
      tags: [tmux]
