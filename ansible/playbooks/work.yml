---
# Work macOS configuration playbook (corporate laptop)
# Run with: uv run poe laptop

- name: Configure work host
  hosts: 127.0.0.1

  pre_tasks:
    - name: Load work-specific config
      ansible.builtin.include_vars: ../work.config.yml
      tags: ["always"]

    - name: Load work-local config overrides
      ansible.builtin.include_vars: ../work.config.local.yml
      when: lookup('file', playbook_dir ~ '/../work.config.local.yml', errors='ignore') | length > 0
      tags: ["always"]

    - name: Remove retired managed paths
      ansible.builtin.import_tasks: ../tasks/remove_retired_paths.yml
      tags: ["always"]

    - name: Verify this is the work machine
      ansible.builtin.assert:
        that: ansible_hostname is match(hostname_prefix)
        fail_msg: >-
          This playbook is for the work laptop (hostname prefix '{{ hostname_prefix }}').
          Current host: '{{ ansible_hostname }}'. Use 'poe laptop' instead.
      tags: ["always"]

    - name: Display system info
      ansible.builtin.debug:
        msg: "Configuring work macOS ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
      tags: ["always"]

  tasks:
    - name: Install packages with brew bundle
      ansible.builtin.include_role:
        name: homebrew
        apply:
          tags: ["homebrew"]
      vars:
        homebrew_brewfile_path: "{{ playbook_dir }}/../Brewfile.work"
        homebrew_link_conflicts:
          pn: [pnpm]
      when: configure_homebrew | default(true)
      tags: ["homebrew"]

    - name: Apply macOS system defaults
      ansible.builtin.include_role:
        name: macos_defaults
      when: configure_macos_defaults | default(true)
      tags:
        [
          "sysconfig",
          "dock",
          "finder",
          "nsglobaldomain",
          "menubar",
          "desktop-services",
          "permissions",
        ]

    - name: Build uvc-util for camera control
      ansible.builtin.include_role:
        name: uvc_util
        apply:
          tags: ["uvc-util"]
      when: configure_uvc_util | default(true)
      tags: ["uvc-util"]

    - name: Configure terminal theme manager
      ansible.builtin.include_role:
        name: terminal_theme
        apply:
          tags: ["terminal-theme"]
      when: ansible_facts['os_family'] == "Darwin" and configure_terminal_theme | default(true)
      tags: ["terminal-theme"]

    - name: Build sessions CLI for agent session recovery
      ansible.builtin.include_role:
        name: sessions
        apply:
          tags: ["sessions"]
      tags: ["sessions"]

    - name: Install global language tools
      ansible.builtin.include_role:
        name: language_tools
        apply:
          tags: ["language-tools"]
      tags: ["language-tools"]

    - name: Install pi from GitHub releases
      ansible.builtin.include_role:
        name: pi_release
        apply:
          tags: ["pi"]
      tags: ["pi"]

    - name: Deploy AI agent resources
      ansible.builtin.include_role:
        name: agent_harness
        apply:
          tags: ["agent-harness"]
      when: configure_agent_harness | default(true)
      tags: ["agent-harness"]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: ["chezmoi", "dotfiles"]
      vars:
        chezmoi_source_dir: "{{ playbook_dir }}/../../chezmoi"
      when: configure_chezmoi | default(true)
      tags: ["chezmoi", "dotfiles"]

    - name: Exclude user-level pre-push hook for personal projects
      community.general.git_config:
        name: "includeIf.gitdir:~/code/personal/.path"
        value: "~/.config/git/personal.inc"
        scope: global
      tags: ["git-hooks"]

    - name: Upgrade Neovim dependencies
      ansible.builtin.include_tasks:
        file: ../tasks/neovim_deps.yml
        apply:
          tags: ["neovim", "nvim-deps"]
      tags: ["neovim", "nvim-deps"]

    - name: Include machine-local tasks
      ansible.builtin.include_tasks:
        file: ../tasks/work.local.yml
        apply:
          tags: ["local"]
      when: lookup('file', playbook_dir ~ '/../tasks/work.local.yml', errors='ignore') | length > 0
      tags: ["local"]
