---
# OpenClaw (Debian VM) configuration playbook
# Run locally on the VM or remotely over SSH with: uv run poe openclaw

- name: Configure openclaw
  hosts: >-
    {{ openclaw_target | default(((lookup('ansible.builtin.pipe', 'hostname -s') | trim) == 'openclaw') | ternary('openclaw_local', 'openclaw_remote')) }}

  vars_files:
    - ../config.yml
    - ../models.yml

  pre_tasks:
    - name: Load OpenClaw-specific config
      ansible.builtin.include_vars: ../openclaw.config.yml
      tags: ["always"]

    - name: Display system info
      ansible.builtin.debug:
        msg: "Configuring {{ ansible_facts['os_family'] }} ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
      tags: ["always"]

  tasks:
    - name: Update apt cache and upgrade all packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      tags: ["apt"]

    - name: Install apt repository prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gpg
        state: present
      tags: ["apt", "apt-repos"]

    - name: Pin select packages from Debian sid
      become: true
      tags: ["apt"]
      block:
        - name: Add Debian sid source (disabled by default via pinning)
          ansible.builtin.apt_repository:
            repo: "deb http://deb.debian.org/debian/ sid main"
            filename: debian-sid
            state: present

        - name: Pin sid to low default priority
          ansible.builtin.copy:
            dest: /etc/apt/preferences.d/sid-low-priority
            content: |
              Package: *
              Pin: release a=unstable
              Pin-Priority: 100
            mode: "0644"

        - name: Pin specific packages to sid
          ansible.builtin.copy:
            dest: /etc/apt/preferences.d/sid-pinned-packages
            content: |
              Package: tmux
              Pin: release a=unstable
              Pin-Priority: 900
            mode: "0644"

        - name: Update apt cache after adding sid
          ansible.builtin.apt:
            update_cache: true

    - name: Install apt packages
      become: true
      ansible.builtin.apt:
        name: "{{ apt_packages | default([]) }}"
        state: present
      tags: ["apt"]

    - name: Use zsh as the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh
      tags: ["apt", "zsh"]

    - name: Configure sshd
      ansible.builtin.include_role:
        name: sshd
        apply:
          tags: ["sshd", "ssh"]
      tags: ["sshd", "ssh"]

    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: "0755"
      tags: ["apt", "uv", "chezmoi", "claude-code", "opencode"]

    - name: Create fd symlink (Debian uses fdfind)
      ansible.builtin.file:
        src: /usr/bin/fdfind
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/fd"
        state: link
      tags: ["apt"]

    - name: Install uv for local self-management
      tags: ["uv"]
      block:
        - name: Check if uv is installed
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"
          register: uv_binary

        - name: Download uv installer
          when: not uv_binary.stat.exists
          ansible.builtin.get_url:
            url: https://astral.sh/uv/install.sh
            dest: /tmp/uv-install.sh
            mode: "0755"

        - name: Run uv installer
          when: not uv_binary.stat.exists
          ansible.builtin.command:
            cmd: /tmp/uv-install.sh
            creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"

    - name: Configure external apt repositories
      tags: ["apt", "apt-repos"]
      become: true
      block:
        - name: Ensure keyrings directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - /usr/share/keyrings
            - /etc/apt/keyrings

        - name: Download GPG keys (single key)
          ansible.builtin.get_url:
            url: "{{ item.key_url }}"
            dest: "{{ item.key_path }}"
            mode: "0644"
          loop: "{{ apt_external_repos | selectattr('key_url', 'defined') | rejectattr('key_is_deb', 'defined') | list }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Download GPG keys (multiple keys)
          ansible.builtin.get_url:
            url: "{{ item.1 }}"
            dest: "{{ item.0.key_paths[idx] }}"
            mode: "0644"
          loop: "{{ apt_external_repos | selectattr('key_urls', 'defined') | subelements('key_urls') }}"
          loop_control:
            label: "{{ item.0.name }} - {{ item.1 | basename }}"
            index_var: idx

        - name: Install deb-multimedia keyring package
          ansible.builtin.apt:
            deb: "{{ item.key_url }}"
            state: present
            allow_unauthenticated: true
          loop: "{{ apt_external_repos | selectattr('key_is_deb', 'defined') | list }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Add external repositories
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by={{ item.key_path | default(item.key_paths | join(',')) }}] {{ item.url }} {{ item.suites }} {{ item.components }}"
            filename: "{{ item.name }}"
            state: present
          loop: "{{ apt_external_repos }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Update apt cache after adding repos
          ansible.builtin.apt:
            update_cache: true

        - name: Install packages from external repos
          ansible.builtin.apt:
            name: "{{ apt_external_repos | map(attribute='packages') | flatten }}"
            state: present

    - name: Configure user npm global prefix
      tags: ["npm"]
      block:
        - name: Ensure npm global directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ ansible_facts['env']['HOME'] }}/.npm-global"
            - "{{ ansible_facts['env']['HOME'] }}/.npm-global/bin"

        - name: Set npm global prefix to user directory
          ansible.builtin.command:
            cmd: npm config set prefix "{{ ansible_facts['env']['HOME'] }}/.npm-global"
            creates: "{{ ansible_facts['env']['HOME'] }}/.npmrc"

    - name: Configure OpenClaw 1Password service account bootstrap
      tags: ["secrets", "onepassword", "op"]
      block:
        - name: Ensure OpenClaw secret directory exists
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.config/openclaw/secrets"
            state: directory
            mode: "0700"

        - name: Check existing OpenClaw service account token file
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.config/openclaw/secrets/op-service-account-token"
          register: openclaw_op_token_file
          no_log: true

        - name: Require OpenClaw service account bootstrap token
          ansible.builtin.assert:
            that:
              - lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN') | length > 0 or openclaw_op_token_file.stat.exists
            fail_msg: >-
              OP_SERVICE_ACCOUNT_TOKEN must be exported for first OpenClaw provisioning.
              Later local runs can reuse the existing token file on the VM.
          no_log: true

        - name: Configure OpenClaw service account token file
          when: lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN') | length > 0
          ansible.builtin.copy:
            dest: "{{ ansible_facts['env']['HOME'] }}/.config/openclaw/secrets/op-service-account-token"
            mode: "0600"
            content: "{{ lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN') }}\n"
          no_log: true

        - name: Install 1Password service account wrapper
          ansible.builtin.copy:
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/op"
            mode: "0755"
            content: |
              #!/usr/bin/env bash
              set -euo pipefail
              token_file="${OP_SERVICE_ACCOUNT_TOKEN_FILE:-$HOME/.config/openclaw/secrets/op-service-account-token}"
              if [[ ! -r "$token_file" ]]; then
                echo "op: missing service account token file: $token_file" >&2
                exit 1
              fi
              export OP_SERVICE_ACCOUNT_TOKEN
              OP_SERVICE_ACCOUNT_TOKEN="$(tr -d '\r\n' < "$token_file")"
              exec /usr/bin/op "$@"

        - name: Install OpenClaw 1Password SecretRef resolver
          ansible.builtin.copy:
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/libexec/openclaw-op-secret"
            mode: "0755"
            content: |
              #!/usr/bin/env python3
              import json
              import os
              import pwd
              import subprocess
              import sys

              def user_home() -> str:
                  return os.environ.get("HOME") or pwd.getpwuid(os.getuid()).pw_dir

              request = json.load(sys.stdin)
              ids = request.get("ids")
              if request.get("protocolVersion") != 1 or not isinstance(ids, list):
                  print(json.dumps({"protocolVersion": 1, "values": {}, "errors": {"request": {"message": "invalid request"}}}))
                  sys.exit(0)

              home = user_home()
              token_file = os.environ.get(
                  "OP_SERVICE_ACCOUNT_TOKEN_FILE",
                  os.path.join(home, ".config", "openclaw", "secrets", "op-service-account-token"),
              )
              try:
                  with open(token_file, encoding="utf-8") as handle:
                      token = handle.read().strip()
              except OSError as exc:
                  print(json.dumps({"protocolVersion": 1, "values": {}, "errors": {str(secret_id): {"message": str(exc)} for secret_id in ids}}))
                  sys.exit(0)

              values = {}
              errors = {}
              env = {"OP_SERVICE_ACCOUNT_TOKEN": token, "HOME": home}
              for secret_id in ids:
                  if not isinstance(secret_id, str) or not secret_id.startswith("op://"):
                      errors[str(secret_id)] = {"message": "id must be an op:// reference"}
                      continue
                  try:
                      result = subprocess.run(
                          ["/usr/bin/op", "read", secret_id],
                          check=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                          timeout=20,
                          env=env,
                      )
                  except Exception as exc:
                      errors[secret_id] = {"message": str(exc)}
                      continue
                  values[secret_id] = result.stdout.rstrip("\r\n")

              print(json.dumps({"protocolVersion": 1, "values": values, "errors": errors}))

    - name: Install Claude Code
      ansible.builtin.include_role:
        name: claude_code
        apply:
          tags: ["claude-code"]
      tags: ["claude-code"]

    - name: Install opencode
      ansible.builtin.include_role:
        name: opencode
        apply:
          tags: ["opencode"]
      tags: ["opencode"]

    - name: Configure system maintenance timers
      ansible.builtin.include_role:
        name: system_maintenance
        apply:
          tags: ["system-maintenance", "timers"]
      tags: ["system-maintenance", "timers"]

    - name: Install global language tools
      ansible.builtin.include_role:
        name: language_tools
        apply:
          tags: ["language-tools"]
      tags: ["language-tools"]

    # TODO: Delete this cleanup job after it has run across all managed machines.
    - name: Remove legacy GhosttyKit predecessor artifacts
      ansible.builtin.import_tasks: ../tasks/remove_legacy_ghostty_nav.yml
      tags: ["ghosttykit"]

    - name: Build sessions CLI for agent session recovery
      ansible.builtin.include_role:
        name: sessions
        apply:
          tags: ["sessions"]
      tags: ["sessions"]

    - name: Configure shpool shell persistence
      ansible.builtin.include_role:
        name: shpool
        apply:
          tags: ["shpool"]
      tags: ["shpool"]

    - name: Configure terminal theme mirror
      ansible.builtin.include_role:
        name: terminal_theme
        apply:
          tags: ["terminal-theme"]
      when: configure_terminal_theme | default(true)
      tags: ["terminal-theme"]

    - name: Deploy AI agent resources
      ansible.builtin.include_role:
        name: agent_harness
        apply:
          tags: ["agent-harness"]
      when: configure_agent_harness | default(true)
      tags: ["agent-harness"]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: ["chezmoi", "dotfiles"]
      when: configure_chezmoi | default(false)
      tags: ["chezmoi", "dotfiles"]

    - name: Install local Pi extension dependencies
      tags: ["chezmoi", "dotfiles", "npm", "pi-extensions"]
      when: pi_local_extension_package_dirs | default([]) | length > 0
      ansible.builtin.command:
        cmd: npm install --omit=dev --no-fund --no-audit
        chdir: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/{{ item }}"
      loop: "{{ pi_local_extension_package_dirs | default([]) }}"
      register: pi_extension_deps_result
      changed_when: >-
        'added' in pi_extension_deps_result.stdout or
        'changed' in pi_extension_deps_result.stdout or
        'removed' in pi_extension_deps_result.stdout

    - name: Install tmux plugin manager and plugins
      tags: ["tmux"]
      ansible.builtin.include_tasks:
        file: ../tasks/tmux_plugins.yml

    - name: Configure MOTD
      ansible.builtin.include_role:
        name: motd
        apply:
          tags: ["motd"]
      tags: ["motd"]
