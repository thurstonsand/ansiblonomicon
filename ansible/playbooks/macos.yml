---
# macOS configuration playbook
# Run with: uv run poe macos

- name: Configure host
  hosts: 127.0.0.1

  vars_files:
    - ../config.yml
    - ../models.yml

  pre_tasks:
    - name: Load Darwin-specific config
      ansible.builtin.include_vars: ../darwin.config.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Load Arch Linux-specific config
      ansible.builtin.include_vars: ../archlinux.config.yml
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]

    - name: Display system info
      ansible.builtin.debug:
        msg: "Configuring {{ ansible_facts['os_family'] }} ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
      tags: ["always"]

  tasks:
    - name: Install packages with brew bundle
      when: ansible_facts['os_family'] == "Darwin" and configure_homebrew
      tags: ["homebrew", "mas"]
      block:
        # --- Check mode: determine what would change ---
        - name: Check brew bundle (dry run)
          when: ansible_check_mode
          check_mode: false
          ansible.builtin.command:
            argv:
              - brew
              - bundle
              - check
              - "--file={{ playbook_dir }}/../Brewfile"
              - --verbose
          register: brew_bundle_check
          changed_when: brew_bundle_check.rc != 0
          failed_when: false

        - name: Check outdated packages (dry run)
          when: ansible_check_mode
          check_mode: false
          ansible.builtin.command:
            argv:
              - brew
              - outdated
          register: brew_outdated_check
          changed_when: brew_outdated_check.stdout | length > 0

        - name: Set check mode results
          when: ansible_check_mode
          vars:
            stdout: "{{ brew_bundle_check.stdout_lines | default([]) }}"
            stderr: "{{ brew_bundle_check.stderr_lines | default([]) }}"
          ansible.builtin.set_fact:
            brew_bundle_changes: "{{ (stdout + stderr) | select('search', 'needs to be') | list }}"
            brew_dep_changes: "{{ brew_outdated_check.stdout_lines | default([]) }}"

        # --- Real mode: apply changes ---
        - name: Run brew bundle
          when: not ansible_check_mode
          ansible.builtin.command:
            argv:
              - brew
              - bundle
              - "--file={{ playbook_dir }}/../Brewfile"
              - --cleanup
              - --upgrade
          register: brew_result
          changed_when: "'Installing' in brew_result.stdout or 'Upgrading' in brew_result.stdout or 'Uninstalling' in brew_result.stdout"

        - name: Upgrade transitive dependencies
          when: not ansible_check_mode
          community.general.homebrew:
            upgrade_all: true
          register: brew_deps_result

        - name: Set real mode results
          when: not ansible_check_mode
          vars:
            stdout: "{{ brew_result.stdout_lines | default([]) }}"
            stderr: "{{ brew_result.stderr_lines | default([]) }}"
            noise: '^==>|^Adjust how often|^Hide these hints|^Updated |^You have \d+ outdated'
          ansible.builtin.set_fact:
            brew_bundle_changes: >-
              {{ (stdout | select('search', 'Installing|Upgrading|Uninstalling|Skipping') | list)
                 + (stderr | reject('search', noise) | list) }}
            brew_dep_changes: "{{ brew_deps_result.changed_pkgs | default([]) }}"

        # --- Unified output ---
        - name: Show brew changes
          ansible.builtin.debug:
            msg:
              brewfile: "{{ brew_bundle_changes if brew_bundle_changes | length > 0 else 'Up to date' }}"
              transitive_deps: "{{ brew_dep_changes if brew_dep_changes | length > 0 else 'Up to date' }}"
          when: (brew_bundle_changes | length > 0) or (brew_dep_changes | length > 0)

    - name: Install opencode via curl
      tags: ["opencode"]
      block:
        - name: Check if opencode is installed
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.opencode/bin/opencode"
          register: opencode_binary

        - name: Download opencode install script
          when: not opencode_binary.stat.exists
          ansible.builtin.get_url:
            url: https://opencode.ai/install
            dest: /tmp/opencode-install.sh
            mode: "0755"

        - name: Run opencode install script
          when: not opencode_binary.stat.exists
          ansible.builtin.command:
            cmd: /tmp/opencode-install.sh
            creates: "{{ ansible_facts['env']['HOME'] }}/.opencode/bin/opencode"

    - name: Install Claude Code via curl
      tags: ["claude-code"]
      block:
        - name: Check if Claude Code is installed
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
          register: claude_binary

        - name: Download Claude Code install script
          when: not claude_binary.stat.exists
          ansible.builtin.get_url:
            url: https://claude.ai/install.sh
            dest: /tmp/claude-install.sh
            mode: "0755"

        - name: Run Claude Code install script
          when: not claude_binary.stat.exists
          ansible.builtin.command:
            cmd: /tmp/claude-install.sh
            creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"

    - name: Install global npm packages
      tags: ["npm"]
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: latest
      loop: "{{ npm_global_packages }}"

    - name: Install global bun packages
      tags: ["bun"]
      ansible.builtin.command:
        cmd: bun install --global {{ item }}
      loop: "{{ bun_global_packages | default([]) }}"
      changed_when: true

    - name: Install global uv tools
      tags: ["uv"]
      ansible.builtin.command:
        cmd: uv tool install --upgrade {{ item }}
      loop: "{{ uv_global_tools }}"
      register: uv_tool_result
      changed_when: "'Installed' in uv_tool_result.stderr or 'Updated' in uv_tool_result.stderr"

    - name: Install global Go tools
      tags: ["go"]
      ansible.builtin.command:
        cmd: go install {{ item }}@latest
      loop: "{{ go_tools }}"
      register: go_tool_result
      changed_when: go_tool_result.stderr | length > 0

    - name: Install global Ruby gems
      tags: ["ruby"]
      ansible.builtin.command:
        cmd: "{{ ansible_facts['env']['HOMEBREW_PREFIX'] | default('/opt/homebrew') }}/opt/ruby/bin/gem install {{ item }}"
      loop: "{{ gem_packages }}"
      register: gem_result
      changed_when: "'Successfully installed' in gem_result.stdout"

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"
        use: darwin
      when: ansible_facts['os_family'] == "Darwin" and hostname is defined
      become: true
      tags: ["sysconfig", "hostname"]

    - name: Apply macOS system defaults
      ansible.builtin.include_role:
        name: macos_defaults
      when: ansible_facts['os_family'] == "Darwin" and configure_macos_defaults | default(true)
      tags:
        [
          "sysconfig",
          "dock",
          "finder",
          "nsglobaldomain",
          "menubar",
          "desktop-services",
          "permissions",
        ]

    - name: MacOS configuration complete
      ansible.builtin.debug:
        msg: "macOS configuration applied successfully"
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Build uvc-util for camera control
      ansible.builtin.include_role:
        name: uvc_util
        apply:
          tags: ["uvc-util"]
      when: ansible_facts['os_family'] == "Darwin" and configure_uvc_util | default(true)
      tags: ["uvc-util"]

    - name: Build ghostty-nav for split navigation
      ansible.builtin.include_role:
        name: ghostty_nav
        apply:
          tags: ["ghostty-nav"]
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["ghostty-nav"]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: ["chezmoi", "dotfiles"]
      when: configure_chezmoi | default(true)
      tags: ["chezmoi", "dotfiles"]

    - name: Install tmux plugin manager and plugins
      tags: ["tmux"]
      ansible.builtin.include_tasks:
        file: ../tasks/tmux_plugins.yml

    - name: Deploy AI agent resources
      ansible.builtin.include_role:
        name: agent_harness
        apply:
          tags: ["agent-harness"]
      when: configure_agent_harness | default(true)
      tags: ["agent-harness"]

    - name: Placeholder - Arch Linux tasks
      ansible.builtin.debug:
        msg: "Ready for Arch Linux configuration (pacman: {{ configure_pacman | default(false) }})"
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]
