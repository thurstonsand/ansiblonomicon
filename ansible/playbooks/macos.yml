---
# macOS configuration playbook
# Run with: mise laptop

- name: Configure host
  hosts: 127.0.0.1

  vars_files:
    - ../config.yml
    - ../agent-harness.config.yml
    - ../models.yml

  pre_tasks:
    - name: Load Darwin-specific config
      ansible.builtin.include_vars: ../darwin.config.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Load Arch Linux-specific config
      ansible.builtin.include_vars: ../archlinux.config.yml
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]

    - name: Remove retired managed paths
      ansible.builtin.import_tasks: ../tasks/remove_retired_paths.yml
      tags: ["always"]

    - name: Verify this is the personal machine
      ansible.builtin.assert:
        that: ansible_hostname == hostname
        fail_msg: >-
          This playbook is for the personal machine ('{{ hostname }}').
          Current host: '{{ ansible_hostname }}'. Use 'mise laptop' instead.
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Display system info
      ansible.builtin.debug:
        msg: "Configuring {{ ansible_facts['os_family'] }} ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
      tags: ["always"]

  tasks:
    - name: MacOS configuration complete
      ansible.builtin.debug:
        msg: "macOS configuration applied successfully"
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    # TODO: Delete this cleanup job after it has run across all managed machines.
    - name: Remove legacy GhosttyKit predecessor artifacts
      ansible.builtin.import_tasks: ../tasks/remove_legacy_ghostty_nav.yml
      tags: ["ghosttykit"]

    - name: Deploy AI agent resources
      ansible.builtin.include_role:
        name: agent_harness
        apply:
          tags: ["agent-harness"]
      when: configure_agent_harness | default(true)
      tags: ["agent-harness"]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: ["chezmoi", "dotfiles"]
      when: configure_chezmoi | default(true)
      tags: ["chezmoi", "dotfiles"]

    - name: Placeholder - Arch Linux tasks
      ansible.builtin.debug:
        msg: "Ready for Arch Linux configuration (pacman: {{ configure_pacman | default(false) }})"
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]
