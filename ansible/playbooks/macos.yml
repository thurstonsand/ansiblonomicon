---
# macOS configuration playbook
# Run with: uv run poe laptop

- name: Configure host
  hosts: 127.0.0.1

  vars_files:
    - ../config.yml
    - ../models.yml

  pre_tasks:
    - name: Load Darwin-specific config
      ansible.builtin.include_vars: ../darwin.config.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Load Arch Linux-specific config
      ansible.builtin.include_vars: ../archlinux.config.yml
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]

    - name: Remove retired managed paths
      ansible.builtin.import_tasks: ../tasks/remove_retired_paths.yml
      tags: ["always"]

    - name: Verify this is the personal machine
      ansible.builtin.assert:
        that: ansible_hostname == hostname
        fail_msg: >-
          This playbook is for the personal machine ('{{ hostname }}').
          Current host: '{{ ansible_hostname }}'. Use 'poe laptop' instead.
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Display system info
      ansible.builtin.debug:
        msg: "Configuring {{ ansible_facts['os_family'] }} ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
      tags: ["always"]

  tasks:
    - name: Install packages with brew bundle
      ansible.builtin.include_role:
        name: homebrew
        apply:
          tags: ["homebrew", "mas"]
      vars:
        homebrew_brewfile_path: "{{ playbook_dir }}/../Brewfile"
      when: ansible_facts['os_family'] == "Darwin" and configure_homebrew
      tags: ["homebrew", "mas"]

    - name: Install opencode
      ansible.builtin.include_role:
        name: opencode
        apply:
          tags: ["opencode"]
      tags: ["opencode"]

    - name: Install Claude Code
      ansible.builtin.include_role:
        name: claude_code
        apply:
          tags: ["claude-code"]
      tags: ["claude-code"]

    - name: Install global language tools
      ansible.builtin.include_role:
        name: language_tools
        apply:
          tags: ["language-tools"]
      tags: ["language-tools"]


    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"
        use: darwin
      when: ansible_facts['os_family'] == "Darwin" and hostname is defined
      become: true
      tags: ["sysconfig", "hostname"]

    - name: Apply macOS system defaults
      ansible.builtin.include_role:
        name: macos_defaults
      when: ansible_facts['os_family'] == "Darwin" and configure_macos_defaults | default(true)
      tags:
        [
          "sysconfig",
          "dock",
          "finder",
          "nsglobaldomain",
          "menubar",
          "desktop-services",
          "permissions",
        ]

    - name: MacOS configuration complete
      ansible.builtin.debug:
        msg: "macOS configuration applied successfully"
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Build uvc-util for camera control
      ansible.builtin.include_role:
        name: uvc_util
        apply:
          tags: ["uvc-util"]
      when: ansible_facts['os_family'] == "Darwin" and configure_uvc_util | default(true)
      tags: ["uvc-util"]

    # TODO: Delete this cleanup job after it has run across all managed machines.
    - name: Remove legacy GhosttyKit predecessor artifacts
      ansible.builtin.import_tasks: ../tasks/remove_legacy_ghostty_nav.yml
      tags: ["ghosttykit"]

    - name: Build shp for shpool SSH sessions
      ansible.builtin.include_role:
        name: shp
        apply:
          tags: ["shp"]
      when: hostname == "Thurstons-MacBook-Pro"
      tags: ["shp"]

    - name: Build sessions CLI for agent session recovery
      ansible.builtin.include_role:
        name: sessions
        apply:
          tags: ["sessions"]
      tags: ["sessions"]

    - name: Configure terminal theme manager
      ansible.builtin.include_role:
        name: terminal_theme
        apply:
          tags: ["terminal-theme"]
      when: ansible_facts['os_family'] == "Darwin" and configure_terminal_theme | default(true)
      tags: ["terminal-theme"]

    - name: Deploy AI agent resources
      ansible.builtin.include_role:
        name: agent_harness
        apply:
          tags: ["agent-harness"]
      when: configure_agent_harness | default(true)
      tags: ["agent-harness"]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: ["chezmoi", "dotfiles"]
      when: configure_chezmoi | default(true)
      tags: ["chezmoi", "dotfiles"]

    - name: Upgrade Neovim dependencies
      ansible.builtin.include_tasks:
        file: ../tasks/neovim_deps.yml
        apply:
          tags: ["neovim", "nvim-deps"]
      tags: ["neovim", "nvim-deps"]

    - name: Install tmux plugin manager and plugins
      tags: ["tmux"]
      ansible.builtin.include_tasks:
        file: ../tasks/tmux_plugins.yml

    - name: Placeholder - Arch Linux tasks
      ansible.builtin.debug:
        msg: "Ready for Arch Linux configuration (pacman: {{ configure_pacman | default(false) }})"
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]
