---
# TrueNAS configuration playbook
# Run with: mise truenas
- name: Configure TrueNAS
  hosts: truenas
  become: true
  environment:
    middleware_method: midclt
  vars_files:
    - ../config.yml
    - ../models.yml
  tasks:
    # ===================
    # Services
    # ===================
    - name: Enable SMB service
      local.truenas.service:
        name: cifs
        enabled: true
        state: started

    - name: Enable NFS service
      tags: [pod042, pod042-storage]
      local.truenas.service:
        name: nfs
        enabled: true
        state: started

    - name: Enable SSH service
      local.truenas.service:
        name: ssh
        enabled: true
        state: started

    - name: Enable UPS service
      local.truenas.service:
        name: ups
        enabled: true
        state: started

    - name: Enable SMART service
      local.truenas.service:
        name: smartd
        enabled: true
        state: started

    # ===================
    # SMART Tests
    # ===================
    - name: Daily short SMART test
      local.truenas.smart_test:
        type: SHORT
        all_disks: true
        schedule:
          hour: "0"
          dom: "*"
          month: "*"
          dow: "*"

    - name: Monthly long SMART test
      local.truenas.smart_test:
        type: LONG
        all_disks: true
        schedule:
          hour: "1"
          dom: "1"
          month: "*"
          dow: "*"

    # ===================
    # Init/Shutdown Scripts
    # ===================
    - name: Enable Wake-on-LAN at boot
      local.truenas.initshutdownscript:
        comment: "enable WOL"
        type: COMMAND
        command: "ethtool -s enp3s0 wol g"
        when: POSTINIT
        enabled: true
        timeout: 20
        state: present

    # ===================
    # Snapshot Tasks
    # ===================
    - name: Create 6-hourly snapshots of performance pool
      local.truenas.pool_snapshottask:
        dataset: performance
        naming_schema: "auto-%Y-%m-%d_%H-%M"
        recursive: true
        lifetime_value: 3
        lifetime_unit: DAY
        allow_empty: true
        vmware_sync: false
        schedule:
          minute: "0"
          hour: "*/6"
          dom: "*"
          month: "*"
          dow: "*"
          begin: "00:00"
          end: "23:59"
        enabled: true
        state: present

    - name: Create monthly snapshots of performance pool
      local.truenas.pool_snapshottask:
        dataset: performance
        naming_schema: "auto-%Y-%m-%d_%H-%M"
        recursive: true
        lifetime_value: 1
        lifetime_unit: MONTH
        allow_empty: true
        vmware_sync: false
        schedule:
          minute: "0"
          hour: "0"
          dom: "*"
          month: "*"
          dow: "*"
          begin: "00:00"
          end: "23:59"
        enabled: true
        state: present

    # ===================
    # Scrub Tasks
    # ===================
    - name: Weekly scrub of performance pool
      local.truenas.pool_scrub:
        pool_name: performance
        threshold: 35
        schedule:
          minute: "0"
          hour: "4"
          dom: "*"
          month: "*"
          dow: "tue"
        enabled: true
        state: present

    - name: Weekly scrub of capacity pool
      local.truenas.pool_scrub:
        pool_name: capacity
        threshold: 35
        schedule:
          minute: "00"
          hour: "04"
          dom: "*"
          month: "*"
          dow: "tue"
        enabled: true
        state: present

    # ===================
    # SMB Shares
    # ===================
    - name: Windows backup SMB share
      local.truenas.sharing_smb:
        name: windows
        path: /mnt/capacity/backup/windows
        purpose: DEFAULT_SHARE
        browsable: true
        acl: true
        durablehandle: true
        streams: true
        shadowcopy: true
        enabled: true
        state: present

    - name: Watch folder SMB share
      local.truenas.sharing_smb:
        name: watch
        path: /mnt/capacity/watch
        purpose: DEFAULT_SHARE
        browsable: true
        acl: true
        durablehandle: true
        streams: true
        shadowcopy: true
        enabled: true
        state: present

    # ===================
    # NFS Shares
    # ===================
    - name: Create pod042 dataset
      tags: [pod042, pod042-storage]
      ansible.builtin.command:
        argv:
          - midclt
          - call
          - pool.dataset.create
          - '{"name":"performance/pod042","type":"FILESYSTEM"}'
        creates: /mnt/performance/pod042

    - name: Configure pod042 dataset ownership
      tags: [pod042, pod042-storage]
      ansible.builtin.file:
        path: /mnt/performance/pod042
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0770"

    - name: Pod042 NFS share
      tags: [pod042, pod042-storage]
      local.truenas.sharing_nfs:
        path: /mnt/performance/pod042
        hosts:
          - 192.168.1.94
        maproot_user: root
        maproot_group: root
        enabled: true
        state: present

    - name: Require pod042 SSH public key
      tags: [pod042, pod042-ssh]
      ansible.builtin.assert:
        that: lookup('env', 'POD042_TRUENAS_SSH_PUBLIC_KEY') | length > 0
        fail_msg: POD042_TRUENAS_SSH_PUBLIC_KEY must be resolved before managing pod042 SSH access.

    - name: Authorize pod042 SSH key for TrueNAS admin
      tags: [pod042, pod042-ssh]
      ansible.posix.authorized_key:
        user: admin
        key: "{{ lookup('env', 'POD042_TRUENAS_SSH_PUBLIC_KEY') }}"
        state: present

    - name: Docker NFS share
      local.truenas.sharing_nfs:
        path: /mnt/performance/docker
        networks:
          - 192.168.1.0/24
        maproot_user: appsvm
        maproot_group: appsvm
        enabled: true
        state: present

    - name: Watch folder NFS share
      local.truenas.sharing_nfs:
        path: /mnt/capacity/watch
        networks:
          - 192.168.1.0/24
        maproot_user: appsvm
        maproot_group: appsvm
        enabled: true
        state: present

    # ===================
    # Docker Networks
    # ===================
    - name: Create trusted macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: trusted
        driver: macvlan
        driver_options:
          parent: br0.1
        ipam_config:
          - subnet: 192.168.1.0/24
            iprange: 192.168.1.224/27
        state: present

    - name: Create iot macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: iot
        driver: macvlan
        driver_options:
          parent: br0.2
        ipam_config:
          - subnet: 192.168.3.0/24
            iprange: 192.168.3.224/27
        state: present

    - name: Create external macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: external
        driver: macvlan
        driver_options:
          parent: br0.3
        ipam_config:
          - subnet: 192.168.5.0/24
            iprange: 192.168.5.224/27
        state: present

    - name: Create personal macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: personal
        driver: macvlan
        driver_options:
          parent: br0.4
        ipam_config:
          - subnet: 192.168.6.0/24
            iprange: 192.168.6.224/27
        state: present

    # ===================
    # Docker Stack
    # ===================
    - name: Deploy anypod stack
      tags: [docker-stack-role, anypod]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, anypod]
      vars:
        docker_stack_name: anypod

    # Torrent seeding/removal policy is documented in docs/operations/media-torrent-seeding.md.
    # Do not use global qBittorrent seed limits to force Arr cleanup; private trackers need long-lived seeds.
    - name: Deploy arr-apps stack
      tags: [docker-stack-role, arr-apps]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, arr-apps]
      vars:
        docker_stack_name: arr-apps

    - name: Ensure Caddy srv directory exists
      tags: [docker-stack-role, caddy]
      ansible.builtin.file:
        path: "{{ docker.config_base }}/caddy/srv"
        state: directory
        mode: "0755"
        owner: "{{ docker.user.puid }}"
        group: "{{ docker.user.pgid }}"

    - name: Deploy caddy stack
      tags: [docker-stack-role, caddy]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, caddy]
      vars:
        docker_stack_name: caddy

    - name: Deploy cli-proxy-api stack
      tags: [docker-stack-role, cli-proxy-api]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, cli-proxy-api]
      vars:
        docker_stack_name: cli-proxy-api
        docker_stack_pull_policy: always

    - name: Deploy cloudflared stack
      tags: [docker-stack-role, cloudflared]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, cloudflared]
      vars:
        docker_stack_name: cloudflared

    - name: Deploy ddclient stack
      tags: [docker-stack-role, ddclient]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, ddclient]
      vars:
        docker_stack_name: ddclient

    - name: Deploy ghost stack
      tags: [docker-stack-role, ghost]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, ghost]
      vars:
        docker_stack_name: ghost

    - name: Restart ghost to pick up theme/routes changes
      tags: [docker-stack-role, ghost]
      ansible.builtin.command:
        cmd: docker restart ghost
      when: _docker_stack_changed | default(false)
      changed_when: _docker_stack_changed | default(false)

    - name: Deploy homepage stack
      tags: [docker-stack-role, homepage]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, homepage]
      vars:
        docker_stack_name: homepage

    - name: Deploy isponsorblocktv stack
      tags: [docker-stack-role, isponsorblocktv]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, isponsorblocktv]
      vars:
        docker_stack_name: isponsorblocktv

    - name: Pod042 VM
      tags: [vm, truenas-vm, pod042-vm, pod042]
      local.truenas.vm: "{{ truenas_vms.pod042 }}"

    - name: OpenClaw VM
      tags: [vm, truenas-vm, openclaw-vm, openclaw]
      local.truenas.vm: "{{ truenas_vms.openclaw }}"

    - name: Home Assistant VM
      tags: [vm, truenas-vm, homeassistant-vm]
      local.truenas.vm: "{{ truenas_vms.homeassistant }}"

    - name: TrueNAS apps
      tags: [truenas-apps]
      become: false
      local.truenas.app:
        name: "{{ truenas_app.value.name }}"
        catalog_app: "{{ truenas_app.value.catalog_app }}"
        train: "{{ truenas_app.value.train }}"
        version: "{{ truenas_app.value.version }}"
        values: "{{ truenas_app.value['values'] }}"
      loop: "{{ truenas_apps | dict2items }}"
      loop_control:
        loop_var: truenas_app
        label: "{{ truenas_app.value.name }}"

    - name: Deploy scrypted stack
      tags: [docker-stack-role, scrypted]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, scrypted]
      vars:
        docker_stack_name: scrypted

    - name: Register the PON monitor check
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.include_role:
        name: alerting
        tasks_from: check.yml
        apply:
          tags: [docker-stack-role, pon-monitor]
      vars:
        alerting_check_name: "{{ ansible_facts.hostname }}-pon-monitor"
        alerting_check_schedule: "*/5 * * * *"
        alerting_check_grace: 1800
        alerting_check_install_url: false

    - name: Publish the PON monitor ping URL to its stack
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.set_fact:
        pon_monitor_ping_url: "{{ alerting_check_ping_url }}"
      no_log: true

    - name: Ensure the PON monitor data directory exists
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.file:
        path: "{{ docker.config_base }}/pon-monitor/pon-monitor/data"
        state: directory
        mode: "0755"
        owner: "{{ docker.user.puid }}"
        group: "{{ docker.user.pgid }}"

    - name: Deploy pon-monitor stack
      tags: [docker-stack-role, pon-monitor]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, pon-monitor]
      vars:
        docker_stack_name: pon-monitor

    # Torrent seeding/removal policy is documented in docs/operations/media-torrent-seeding.md.
    # Do not use global qBittorrent seed limits to force Arr cleanup; private trackers need long-lived seeds.
    - name: Register the MAM session update check
      tags: [docker-stack-role, torrent]
      ansible.builtin.include_role:
        name: alerting
        tasks_from: check.yml
        apply:
          tags: [docker-stack-role, torrent]
      vars:
        alerting_check_name: "{{ ansible_facts.hostname }}-mam-update"
        alerting_check_schedule: "*/30 * * * *"
        alerting_check_grace: 5400
        alerting_check_install_url: false

    - name: Publish the MAM ping URL to the torrent stack
      tags: [docker-stack-role, torrent]
      ansible.builtin.set_fact:
        torrent_mam_ping_url: "{{ alerting_check_ping_url }}"
      no_log: true

    - name: Deploy torrent stack
      tags: [docker-stack-role, torrent]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, torrent]
      vars:
        docker_stack_name: torrent
        docker_stack_pause_containers: [torrent-netns-repair]

    - name: Deploy watchtower stack
      tags: [docker-stack-role, watchtower]
      ansible.builtin.include_role:
        name: docker_stack
        apply:
          tags: [docker-stack-role, watchtower]
      vars:
        docker_stack_name: watchtower
        docker_stack_pull_policy: always
