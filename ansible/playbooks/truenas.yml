---
# TrueNAS configuration playbook
# Run with: uv run poe truenas
- name: Configure TrueNAS
  hosts: truenas
  become: true
  environment:
    middleware_method: midclt
  vars_files:
    - ../config/docker.yml
  tasks:
    # ===================
    # Services
    # ===================
    - name: Enable SMB service
      local.truenas.service:
        name: cifs
        enabled: true
        state: started

    - name: Enable NFS service
      local.truenas.service:
        name: nfs
        enabled: true
        state: started

    - name: Enable SSH service
      local.truenas.service:
        name: ssh
        enabled: true
        state: started

    - name: Enable UPS service
      local.truenas.service:
        name: ups
        enabled: true
        state: started

    - name: Enable SMART service
      local.truenas.service:
        name: smartd
        enabled: true
        state: started

    # ===================
    # SMART Tests
    # ===================
    - name: Daily short SMART test
      local.truenas.smart_test:
        type: SHORT
        all_disks: true
        schedule:
          hour: "0"
          dom: "*"
          month: "*"
          dow: "*"

    - name: Monthly long SMART test
      local.truenas.smart_test:
        type: LONG
        all_disks: true
        schedule:
          hour: "1"
          dom: "1"
          month: "*"
          dow: "*"

    # ===================
    # Init/Shutdown Scripts
    # ===================
    - name: Enable Wake-on-LAN at boot
      local.truenas.initshutdownscript:
        comment: "enable WOL"
        type: COMMAND
        command: "ethtool -s enp3s0 wol g"
        when: POSTINIT
        enabled: true
        timeout: 20
        state: present

    # ===================
    # Snapshot Tasks
    # ===================
    - name: Create 6-hourly snapshots of performance pool
      local.truenas.pool_snapshottask:
        dataset: performance
        naming_schema: "auto-%Y-%m-%d_%H-%M"
        recursive: true
        lifetime_value: 3
        lifetime_unit: DAY
        allow_empty: true
        vmware_sync: false
        schedule:
          minute: "0"
          hour: "*/6"
          dom: "*"
          month: "*"
          dow: "*"
          begin: "00:00"
          end: "23:59"
        enabled: true
        state: present

    - name: Create monthly snapshots of performance pool
      local.truenas.pool_snapshottask:
        dataset: performance
        naming_schema: "auto-%Y-%m-%d_%H-%M"
        recursive: true
        lifetime_value: 1
        lifetime_unit: MONTH
        allow_empty: true
        vmware_sync: false
        schedule:
          minute: "0"
          hour: "0"
          dom: "*"
          month: "*"
          dow: "*"
          begin: "00:00"
          end: "23:59"
        enabled: true
        state: present

    # ===================
    # Scrub Tasks
    # ===================
    - name: Weekly scrub of performance pool
      local.truenas.pool_scrub:
        pool_name: performance
        threshold: 35
        schedule:
          minute: "0"
          hour: "4"
          dom: "*"
          month: "*"
          dow: "tue"
        enabled: true
        state: present

    - name: Weekly scrub of capacity pool
      local.truenas.pool_scrub:
        pool_name: capacity
        threshold: 35
        schedule:
          minute: "00"
          hour: "04"
          dom: "*"
          month: "*"
          dow: "tue"
        enabled: true
        state: present

    # ===================
    # SMB Shares
    # ===================
    - name: Windows backup SMB share
      local.truenas.sharing_smb:
        name: windows
        path: /mnt/capacity/backup/windows
        purpose: DEFAULT_SHARE
        browsable: true
        acl: true
        durablehandle: true
        streams: true
        shadowcopy: true
        enabled: true
        state: present

    - name: Time Machine SMB share
      local.truenas.sharing_smb:
        name: thurston-personal-mbp
        path: /mnt/capacity/backup/timemachine/thurston-personal-mbp
        path_suffix: "%U"
        purpose: ENHANCED_TIMEMACHINE
        browsable: true
        acl: true
        durablehandle: true
        streams: true
        timemachine: true
        shadowcopy: true
        enabled: true
        state: present

    - name: Watch folder SMB share
      local.truenas.sharing_smb:
        name: watch
        path: /mnt/capacity/watch
        purpose: DEFAULT_SHARE
        browsable: true
        acl: true
        durablehandle: true
        streams: true
        shadowcopy: true
        enabled: true
        state: present

    # ===================
    # NFS Shares
    # ===================
    - name: Docker NFS share
      local.truenas.sharing_nfs:
        path: /mnt/performance/docker
        networks:
          - 192.168.1.0/24
        maproot_user: appsvm
        maproot_group: appsvm
        enabled: true
        state: present

    - name: Watch folder NFS share
      local.truenas.sharing_nfs:
        path: /mnt/capacity/watch
        networks:
          - 192.168.1.0/24
        maproot_user: appsvm
        maproot_group: appsvm
        enabled: true
        state: present

    # ===================
    # Docker Networks
    # ===================
    - name: Create trusted macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: trusted
        driver: macvlan
        driver_options:
          parent: br0.1
        ipam_config:
          - subnet: 192.168.1.0/24
            iprange: 192.168.1.224/27
        state: present

    - name: Create iot macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: iot
        driver: macvlan
        driver_options:
          parent: br0.2
        ipam_config:
          - subnet: 192.168.3.0/24
            iprange: 192.168.3.224/27
        state: present

    - name: Create external macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: external
        driver: macvlan
        driver_options:
          parent: br0.3
        ipam_config:
          - subnet: 192.168.5.0/24
            iprange: 192.168.5.224/27
        state: present

    - name: Create personal macvlan network
      tags: [docker, docker-networks]
      community.docker.docker_network:
        name: personal
        driver: macvlan
        driver_options:
          parent: br0.4
        ipam_config:
          - subnet: 192.168.6.0/24
            iprange: 192.168.6.224/27
        state: present

    # ===================
    # Docker Stacks
    # ===================
    - name: Sync docker stacks to TrueNAS
      tags: [docker, docker-stacks]
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../stacks/"
        dest: /mnt/performance/docker/stacks/
        recursive: true
        delete: false
        rsync_opts:
          - "--exclude=.DS_Store"
          - "--exclude=*.j2"

    - name: Find compose templates
      tags: [docker, docker-stacks]
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../stacks"
        patterns: "compose.yaml.j2"
        recurse: true
      register: compose_templates
      delegate_to: localhost
      become: false

    - name: Template compose files
      tags: [docker, docker-stacks]
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: "/mnt/performance/docker/stacks/{{ item.path | dirname | basename }}/compose.yaml"
        mode: "0644"
      loop: "{{ compose_templates.files }}"

    - name: Template ddclient.conf with secrets
      tags: [docker, docker-stacks]
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../stacks/ddclient/ddclient.conf.j2"
        dest: /mnt/performance/docker/stacks/ddclient/ddclient.conf
        mode: "0600"

    - name: Deploy arcane stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/arcane
        state: present
        pull: always
      environment:
        ARCANE_ENCRYPTION_KEY: "{{ lookup('env', 'ARCANE_ENCRYPTION_KEY') }}"
        ARCANE_JWT_SECRET: "{{ lookup('env', 'ARCANE_JWT_SECRET') }}"

    - name: Deploy anypod stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/anypod
        state: present
        pull: always

    - name: Deploy arr-apps stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/arr-apps
        state: present
        pull: always

    - name: Deploy cli-proxy-api stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/cli-proxy-api
        state: present
        pull: always

    - name: Deploy cloudflared stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/cloudflared
        state: present
        pull: always
      environment:
        CLOUDFLARE_TOKEN: "{{ lookup('env', 'CLOUDFLARE_TOKEN') }}"

    - name: Deploy ddclient stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/ddclient
        state: present
        pull: always
      environment:
        DDCLIENT_GITHUB_PAT: "{{ lookup('env', 'DDCLIENT_GITHUB_PAT') }}"

    - name: Deploy frigate stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/frigate
        state: present
        pull: always
      environment:
        FRIGATE_RTSP_PASSWORD: "{{ lookup('env', 'FRIGATE_RTSP_PASSWORD') }}"

    - name: Deploy ghost stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/ghost
        state: present
        pull: always
      environment:
        GHOST_DB_PASSWORD: "{{ lookup('env', 'GHOST_DB_PASSWORD') }}"
        GHOST_MYSQL_ROOT_PASSWORD: "{{ lookup('env', 'GHOST_MYSQL_ROOT_PASSWORD') }}"
        GHOST_MAIL_AUTH_PASS: "{{ lookup('env', 'GHOST_MAIL_AUTH_PASS') }}"

    - name: Find homepage config templates
      tags: [docker, docker-stacks]
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../stacks/homepage/config"
        patterns: "*.yaml.j2"
      register: homepage_config_templates
      delegate_to: localhost
      become: false

    - name: Template homepage config files
      tags: [docker, docker-stacks]
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: "/mnt/performance/docker/homepage/app/config/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ homepage_config_templates.files }}"

    - name: Deploy homepage stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/homepage
        state: present
        pull: always

    - name: Deploy isponsorblocktv stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/isponsorblocktv
        state: present
        pull: always

    - name: Deploy scrypted stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/scrypted
        state: present
        pull: always

    - name: Deploy torrent stack
      tags: [docker, docker-stacks]
      community.docker.docker_compose_v2:
        project_src: /mnt/performance/docker/stacks/torrent
        state: present
        build: always
        pull: always
      environment:
        TORRENT_OPENVPN_USER: "{{ lookup('env', 'TORRENT_OPENVPN_USER') }}"
        TORRENT_MAM_ID: "{{ lookup('env', 'TORRENT_MAM_ID') }}"
