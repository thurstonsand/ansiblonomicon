---
- name: Validate homebrew_brewfile_path is set
  ansible.builtin.assert:
    that: homebrew_brewfile_path is defined and homebrew_brewfile_path | length > 0
    fail_msg: "homebrew_brewfile_path must be provided when including the homebrew role"

# --- Check mode: determine what would change ---
- name: Check brew bundle (dry run)
  when: ansible_check_mode
  check_mode: false
  ansible.builtin.command:
    argv:
      - brew
      - bundle
      - check
      - "--file={{ homebrew_brewfile_path }}"
      - --verbose
  register: homebrew_bundle_check
  changed_when: homebrew_bundle_check.rc != 0
  failed_when: false

- name: Check outdated packages (dry run)
  when: ansible_check_mode
  check_mode: false
  ansible.builtin.command:
    argv:
      - brew
      - outdated
  register: homebrew_outdated_check
  changed_when: homebrew_outdated_check.stdout | length > 0

- name: Set check mode results
  when: ansible_check_mode
  vars:
    stdout: "{{ homebrew_bundle_check.stdout_lines | default([]) }}"
    stderr: "{{ homebrew_bundle_check.stderr_lines | default([]) }}"
  ansible.builtin.set_fact:
    homebrew_bundle_changes: "{{ (stdout + stderr) | select('search', 'needs to be') | list }}"
    homebrew_dep_changes: "{{ homebrew_outdated_check.stdout_lines | default([]) }}"

# --- Real mode: apply changes ---
- name: Check upgrade stamp
  when: not ansible_check_mode
  ansible.builtin.stat:
    path: "{{ homebrew_cache_dir }}/upgrade.stamp"
  register: homebrew_upgrade_stamp

- name: Determine if upgrade is due
  when: not ansible_check_mode
  ansible.builtin.set_fact:
    homebrew_upgrade_due: >-
      {{
        (not homebrew_upgrade_stamp.stat.exists)
        or (
          (ansible_date_time.epoch | int) - (homebrew_upgrade_stamp.stat.mtime | int)
          >= (homebrew_upgrade_interval_seconds | int)
        )
      }}

- name: Read Brewfile
  when: not ansible_check_mode
  ansible.builtin.slurp:
    src: "{{ homebrew_brewfile_path }}"
  register: homebrew_brewfile_content

- name: Collect Mac App Store app IDs from Brewfile
  when: not ansible_check_mode
  ansible.builtin.set_fact:
    homebrew_mas_ids: "{{ homebrew_brewfile_content.content | b64decode | regex_findall('^mas .*, id: (\\d+)', multiline=True) }}"

# mas 7 requires root and shells out to bare `sudo` itself, which never sees SUDO_ASKPASS.
# Driving it here with `sudo -A` leaves brew bundle's own mas path with nothing to do.
- name: Reconcile Mac App Store apps
  when: not ansible_check_mode and homebrew_mas_ids | length > 0
  environment:
    MAS_NO_AUTO_INDEX: "1"
    SUDO_ASKPASS: "{{ ansible_facts['env']['SUDO_ASKPASS'] | default(omit) }}"
    HOMEBREW_SUDO_ASKPASS_PASS: "{{ ansible_facts['env']['HOMEBREW_SUDO_ASKPASS_PASS'] | default(omit) }}"
    HOMEBREW_SUDO_ASKPASS_PASS_WORK: "{{ ansible_facts['env']['HOMEBREW_SUDO_ASKPASS_PASS_WORK'] | default(omit) }}"
  block:
    - name: Ensure mas is installed
      ansible.builtin.command:
        argv: ["brew", "install", "mas"]
      register: homebrew_mas_tool
      changed_when: "'Pouring' in homebrew_mas_tool.stdout"

    - name: List installed Mac App Store apps
      ansible.builtin.command:
        argv: ["mas", "list"]
      register: homebrew_mas_list
      changed_when: false

    - name: List outdated Mac App Store apps
      when: homebrew_upgrade_due
      ansible.builtin.command:
        argv: ["mas", "outdated"]
      register: homebrew_mas_outdated
      changed_when: false

    - name: Determine Mac App Store work
      vars:
        installed_ids: "{{ homebrew_mas_list.stdout | regex_findall('^\\s*(\\d+)\\s', multiline=True) }}"
      ansible.builtin.set_fact:
        homebrew_mas_missing: "{{ homebrew_mas_ids | difference(installed_ids) }}"
        homebrew_mas_upgrades: >-
          {{ homebrew_mas_outdated.stdout_lines | default([])
             | select('search', '^\\s*(' ~ homebrew_mas_ids | join('|') ~ ')\\s') | list }}

    - name: Install missing Mac App Store apps
      ansible.builtin.command:
        argv: ["sudo", "-A", "mas", "install", "{{ item }}"]
      loop: "{{ homebrew_mas_missing }}"
      changed_when: true

    - name: Upgrade outdated Mac App Store apps
      ansible.builtin.command:
        argv: ["sudo", "-A", "mas", "upgrade", "{{ item.split() | first }}"]
      loop: "{{ homebrew_mas_upgrades }}"
      changed_when: true

- name: Pin keg-only conflicting formulas
  when: not ansible_check_mode and homebrew_link_conflicts | length > 0
  ansible.builtin.command:
    argv: ["brew", "pin", "{{ item }}"]
  loop: "{{ homebrew_link_conflicts.values() | flatten }}"
  changed_when: false
  failed_when: false

- name: Set brew bundle install arguments
  when: not ansible_check_mode
  ansible.builtin.set_fact:
    homebrew_bundle_install_args: >-
      {{ ['brew', 'bundle', 'install', '--file=' ~ homebrew_brewfile_path]
         + ([] if homebrew_upgrade_due else ['--no-upgrade']) }}

- name: Run brew bundle
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: "{{ homebrew_bundle_install_args }}"
  environment:
    HOMEBREW_NO_UPGRADE_AUTO_UPDATES_CASKS: "1"
    SUDO_ASKPASS: "{{ ansible_facts['env']['SUDO_ASKPASS'] | default(omit) }}"
    HOMEBREW_SUDO_ASKPASS_PASS: "{{ ansible_facts['env']['HOMEBREW_SUDO_ASKPASS_PASS'] | default(omit) }}"
    HOMEBREW_SUDO_ASKPASS_PASS_WORK: "{{ ansible_facts['env']['HOMEBREW_SUDO_ASKPASS_PASS_WORK'] | default(omit) }}"
  register: homebrew_result
  changed_when: "'Installing' in homebrew_result.stdout or 'Upgrading' in homebrew_result.stdout or 'Restarting' in homebrew_result.stdout"

- name: Clean up dependencies not in Brewfile
  when: not ansible_check_mode and homebrew_upgrade_due
  ansible.builtin.command:
    argv: ["brew", "bundle", "cleanup", "--force", "--file={{ homebrew_brewfile_path }}"]
  environment:
    HOMEBREW_NO_UPGRADE_AUTO_UPDATES_CASKS: "1"
    SUDO_ASKPASS: "{{ ansible_facts['env']['SUDO_ASKPASS'] | default(omit) }}"
    HOMEBREW_SUDO_ASKPASS_PASS: "{{ ansible_facts['env']['HOMEBREW_SUDO_ASKPASS_PASS'] | default(omit) }}"
    HOMEBREW_SUDO_ASKPASS_PASS_WORK: "{{ ansible_facts['env']['HOMEBREW_SUDO_ASKPASS_PASS_WORK'] | default(omit) }}"
  register: homebrew_cleanup_result
  changed_when: "'Uninstalling' in homebrew_cleanup_result.stdout"

- name: Unpin keg-only conflicting formulas
  when: not ansible_check_mode and homebrew_link_conflicts | length > 0
  ansible.builtin.command:
    argv: ["brew", "unpin", "{{ item }}"]
  loop: "{{ homebrew_link_conflicts.values() | flatten }}"
  changed_when: false
  failed_when: false

- name: Upgrade conflicting formulas
  when: not ansible_check_mode and homebrew_upgrade_due and homebrew_link_conflicts | length > 0
  ansible.builtin.include_tasks: upgrade_conflicting.yml
  loop: "{{ homebrew_link_conflicts | dict2items }}"
  loop_control:
    loop_var: conflict

- name: Ensure cache directory exists
  when: not ansible_check_mode and homebrew_upgrade_due
  ansible.builtin.file:
    path: "{{ homebrew_cache_dir }}"
    state: directory
    mode: "0755"

- name: Record upgrade timestamp
  when: not ansible_check_mode and homebrew_upgrade_due
  ansible.builtin.file:
    path: "{{ homebrew_cache_dir }}/upgrade.stamp"
    state: touch
    mode: "0644"

- name: Set real mode results
  when: not ansible_check_mode
  vars:
    stdout: "{{ homebrew_result.stdout_lines | default([]) }}"
    stderr: "{{ homebrew_result.stderr_lines | default([]) }}"
    cleanup: "{{ homebrew_cleanup_result.stdout_lines | default([]) }}"
    noise: '^==>|^Adjust how often|^Hide these hints|^Updated |^You have \d+ outdated|JSON API'
  ansible.builtin.set_fact:
    homebrew_bundle_changes: >-
      {{ (homebrew_mas_missing | default([]) | map('regex_replace', '^', 'Installing App Store app ') | list)
         + (homebrew_mas_upgrades | default([]) | map('regex_replace', '^\\s*', 'Upgrading ') | list)
         + (stdout | select('search', 'Installing|Upgrading|Skipping') | list)
         + (cleanup | select('search', 'Uninstalling') | list)
         + (stderr | reject('search', noise) | list) }}
    homebrew_dep_changes: []

# --- Unified output ---
- name: Show brew changes
  ansible.builtin.debug:
    msg:
      brewfile: "{{ homebrew_bundle_changes if homebrew_bundle_changes | length > 0 else 'Up to date' }}"
      transitive_deps: "{{ homebrew_dep_changes if homebrew_dep_changes | length > 0 else 'Up to date' }}"
      upgrade_status: "{{ 'Ran cleanup + Brewfile upgrade' if (homebrew_upgrade_due | default(false)) else 'Skipped (last run < 24h ago)' }}"
  when: (homebrew_bundle_changes | length > 0) or (homebrew_dep_changes | length > 0) or not (homebrew_upgrade_due | default(true))
