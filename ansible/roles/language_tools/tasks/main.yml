---
- name: Compute managed language tools fingerprint
  ansible.builtin.set_fact:
    language_tools_managed_packages_fingerprint: >-
      {{
        {
          'mise': mise_global_tools,
          'mise_config': mise_tool_config,
          'npm': npm_global_packages,
          'uv': uv_global_tools,
          'bun': bun_global_packages,
          'go': go_tools,
          'cargo': cargo_packages,
          'gem': gem_packages,
        } | to_json | hash('sha256')
      }}
    language_tools_managed_packages_present: >-
      {{
        (mise_global_tools | length > 0)
        or (mise_tool_config | length > 0)
        or (npm_global_packages | length > 0)
        or (uv_global_tools | length > 0)
        or (bun_global_packages | length > 0)
        or (go_tools | length > 0)
        or (cargo_packages | length > 0)
        or (gem_packages | length > 0)
      }}

- name: Read current mise tool config
  when: mise_tool_config | length > 0
  ansible.builtin.command:
    argv:
      - mise
      - config
      - get
      - "--file"
      - "{{ language_tools_mise_global_config }}"
      - "{{ item.key }}"
  loop: "{{ mise_tool_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: language_tools_mise_config_current
  changed_when: false
  failed_when: false

- name: Write mise tool config
  when: item.item.value != (item.stdout | trim)
  ansible.builtin.command:
    argv:
      - mise
      - config
      - set
      - "--file"
      - "{{ language_tools_mise_global_config }}"
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  loop: "{{ language_tools_mise_config_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: true

- name: Check language tools update stamp
  when: not ansible_check_mode
  ansible.builtin.stat:
    path: "{{ language_tools_cache_dir }}/update.stamp"
  register: language_tools_update_stamp

- name: Read language tools update stamp
  when:
    - not ansible_check_mode
    - language_tools_update_stamp.stat.exists
  ansible.builtin.slurp:
    src: "{{ language_tools_cache_dir }}/update.stamp"
  register: language_tools_update_stamp_content

- name: Determine if language tools update is due
  ansible.builtin.set_fact:
    language_tools_update_due: >-
      {{
        ansible_check_mode
        or (not language_tools_update_stamp.stat.exists)
        or (
          (language_tools_update_stamp_content.content | default('') | b64decode | trim)
          != language_tools_managed_packages_fingerprint
        )
        or (
          (ansible_date_time.epoch | int) - (language_tools_update_stamp.stat.mtime | int)
          >= (language_tools_update_interval_seconds | int)
        )
      }}

- name: Install mise-managed tools
  when: language_tools_update_due and mise_global_tools | length > 0
  ansible.builtin.command:
    argv:
      - mise
      - use
      - --global
      - --yes
      - "{{ item }}"
  loop: "{{ mise_global_tools }}"
  register: language_tools_mise_result
  changed_when: >-
    'installed' in (language_tools_mise_result.stdout | lower) or
    'updated' in (language_tools_mise_result.stdout | lower) or
    'upgraded' in (language_tools_mise_result.stdout | lower) or
    'installed' in (language_tools_mise_result.stderr | lower) or
    'updated' in (language_tools_mise_result.stderr | lower) or
    'upgraded' in (language_tools_mise_result.stderr | lower)

- name: Install tools declared in mise config
  when: language_tools_update_due and mise_tool_config | length > 0
  ansible.builtin.command:
    argv: ["mise", "install"]
  register: language_tools_mise_config_install
  changed_when: "'✓ installed' in language_tools_mise_config_install.stdout + language_tools_mise_config_install.stderr"

- name: Install global npm packages
  when: language_tools_update_due and npm_global_packages | length > 0
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  loop: "{{ npm_global_packages }}"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"

- name: Install global uv tools
  when: language_tools_update_due and uv_global_tools | length > 0
  ansible.builtin.command:
    argv:
      - "{{ language_tools_uv_command }}"
      - tool
      - install
      - --upgrade
      - "{{ item }}"
  loop: "{{ uv_global_tools }}"
  register: language_tools_uv_result
  changed_when: "'Installed' in language_tools_uv_result.stderr or 'Updated' in language_tools_uv_result.stderr"

- name: Install global bun packages
  when: language_tools_update_due and bun_global_packages | length > 0
  ansible.builtin.command:
    cmd: bun install --global {{ item }}
  loop: "{{ bun_global_packages }}"
  register: language_tools_bun_result
  changed_when: "'installed' in language_tools_bun_result.stdout or 'Installed' in language_tools_bun_result.stderr"

- name: Install global Go tools
  when: language_tools_update_due and go_tools | length > 0
  ansible.builtin.command:
    cmd: "go install {{ item if '@' in item else item + '@latest' }}"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ go_tools }}"
  register: language_tools_go_result
  changed_when: language_tools_go_result.stderr | length > 0

- name: Select Rust stable toolchain
  when: language_tools_update_due and cargo_packages | length > 0
  ansible.builtin.command:
    cmd: rustup default stable
  environment:
    PATH: "{{ language_tools_cargo_path }}"
  changed_when: true

- name: Install cargo-binstall
  when: language_tools_update_due and cargo_packages | length > 0
  ansible.builtin.command:
    cmd: cargo install cargo-binstall
  environment:
    PATH: "{{ language_tools_cargo_path }}"
  register: language_tools_cargo_binstall_result
  changed_when: >-
    'Installing' in language_tools_cargo_binstall_result.stderr or
    'Installed' in language_tools_cargo_binstall_result.stderr or
    'Replacing' in language_tools_cargo_binstall_result.stderr

- name: Install cargo packages
  when: language_tools_update_due and cargo_packages | length > 0
  ansible.builtin.command:
    cmd: cargo binstall --no-confirm {{ item }}
  environment:
    PATH: "{{ language_tools_cargo_path }}"
  loop: "{{ cargo_packages }}"
  register: language_tools_cargo_result
  changed_when: >-
    'installing' in (language_tools_cargo_result.stdout | lower) or
    'installed' in (language_tools_cargo_result.stdout | lower)

- name: Install Neovim via bob
  when: language_tools_update_due and 'bob-nvim' in cargo_packages
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/bob use stable"
  changed_when: true

- name: Link bob-managed Neovim into user local bin
  when: "'bob-nvim' in cargo_packages"
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/share/bob/nvim-bin/nvim"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/nvim"
    state: link
    force: true

- name: Install global Ruby gems
  when: language_tools_update_due and gem_packages | length > 0
  vars:
    language_tools_gem_command: >-
      {{
        (ansible_facts['os_family'] == 'Darwin')
        | ternary((ansible_facts['env']['HOMEBREW_PREFIX'] | default('/opt/homebrew')) ~ '/opt/ruby/bin/gem', 'gem')
      }}
  ansible.builtin.command:
    cmd: "{{ language_tools_gem_command }} install {{ item }}"
  loop: "{{ gem_packages }}"
  register: language_tools_gem_result
  changed_when: "'Successfully installed' in language_tools_gem_result.stdout"

- name: Ensure language tools cache directory exists
  when: not ansible_check_mode and language_tools_update_due and language_tools_managed_packages_present
  ansible.builtin.file:
    path: "{{ language_tools_cache_dir }}"
    state: directory
    mode: "0755"

- name: Record language tools update fingerprint
  when: not ansible_check_mode and language_tools_update_due and language_tools_managed_packages_present
  ansible.builtin.copy:
    dest: "{{ language_tools_cache_dir }}/update.stamp"
    content: "{{ language_tools_managed_packages_fingerprint }}\n"
    mode: "0644"

- name: Show language tools update status
  when: not language_tools_update_due
  ansible.builtin.debug:
    msg: "Skipped language tool updates; last run < 24h ago"
