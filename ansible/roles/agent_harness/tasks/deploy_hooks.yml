---
# Deploy hook fragments from plugins to the harness hooks cache.
# These are aggregated by chezmoi's resolve-overlay.py into settings.json.

- name: Ensure hooks cache directory exists
  ansible.builtin.file:
    path: "{{ agent_harness_cache_dir }}/hooks"
    state: directory
    mode: "0755"

- name: Deploy hook fragments with PLUGIN_ROOT resolved
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ agent_harness_cache_dir }}/hooks/{{ item.name }}.json"
    mode: "0644"
  loop: "{{ agent_harness_plugin_resources.hooks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Find existing hook fragment files
  ansible.builtin.find:
    paths: "{{ agent_harness_cache_dir }}/hooks"
    patterns: "*.json"
  register: agent_harness_existing_hooks

- name: Remove orphaned hook fragments
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ agent_harness_existing_hooks.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | splitext | first) not in (agent_harness_plugin_resources.hooks | map(attribute='name') | list)
