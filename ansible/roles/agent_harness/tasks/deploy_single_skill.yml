---
# Deploy a single skill to the target agent

- name: Check if skill source exists
  ansible.builtin.stat:
    path: "{{ agent_harness_skill_info.source }}"
  delegate_to: "{{ agent_harness_source_delegate_host }}"
  register: agent_harness_skill_source_stat

- name: Fail if skill source not found
  ansible.builtin.fail:
    msg: "Skill source not found: {{ agent_harness_skill_info.source }} (from {{ agent_harness_skill_info.origin }})"
  when: not agent_harness_skill_source_stat.stat.exists

- name: Check for SKILL.md.j2 template
  ansible.builtin.stat:
    path: "{{ agent_harness_skill_info.source }}/SKILL.md.j2"
  delegate_to: "{{ agent_harness_source_delegate_host }}"
  register: agent_harness_skill_j2_stat

- name: Build rsync exclude options
  ansible.builtin.set_fact:
    agent_harness_skill_rsync_opts: >-
      {{ ['--omit-dir-times', '--filter=P_SKILL.md', '--filter=H_SKILL.md', '--exclude=.git', '--exclude=.claude-plugin', '--exclude=*.j2', '--delete-excluded']
         + (agent_harness_skill_info.exclude_data | default([]) | map('regex_replace', '^(.*)$', '--exclude=\1') | list) }}

- name: Sync skill directory locally
  ansible.posix.synchronize:
    src: "{{ agent_harness_skill_info.source }}/"
    dest: "{{ agent_harness_agent_config.skills_dir }}/{{ agent_harness_skill_info.name }}/"
    delete: true
    recursive: true
    checksum: true
    owner: false
    group: false
    rsync_opts: "{{ agent_harness_skill_rsync_opts }}"
  when: ansible_connection | default('ssh') == 'local'

- name: Sync skill directory remotely
  ansible.posix.synchronize:
    src: "{{ agent_harness_skill_info.source }}/"
    dest: "{{ agent_harness_agent_config.skills_dir }}/{{ agent_harness_skill_info.name }}/"
    delete: true
    recursive: true
    checksum: true
    owner: false
    group: false
    rsync_opts: "{{ agent_harness_skill_rsync_opts }}"
  delegate_to: localhost
  when: ansible_connection | default('ssh') != 'local'

- name: Load SKILL.md.j2 template content
  ansible.builtin.set_fact:
    agent_harness_skill_source_content: >-
      {{ lookup('ansible.builtin.template', agent_harness_skill_info.source + '/SKILL.md.j2', rstrip=false) }}
  when: agent_harness_skill_j2_stat.stat.exists

- name: Load SKILL.md content
  ansible.builtin.set_fact:
    agent_harness_skill_source_content: >-
      {{ lookup('ansible.builtin.file', agent_harness_skill_info.source + '/SKILL.md', rstrip=false) }}
  when: not agent_harness_skill_j2_stat.stat.exists

- name: Resolve skill frontmatter name
  ansible.builtin.set_fact:
    agent_harness_skill_frontmatter_name: >-
      {{ ((agent_harness_agent_config.name_transform | default('preserve')) == 'preserve')
         | ternary(agent_harness_skill_info.display_name | default(agent_harness_skill_info.name),
                   agent_harness_skill_info.name) }}

- name: Transform SKILL.md for target agent
  ansible.builtin.set_fact:
    agent_harness_transformed_skill: >-
      {{ agent_harness_skill_source_content
         | agent_harness_transform_skill_content(agent_harness_target_agent, agent_harness_models.models,
                                                 agent_harness_skill_info.plugin_root | default(''),
                                                 agent_harness_skill_frontmatter_name) }}

- name: Deploy SKILL.md
  ansible.builtin.copy:
    content: "{{ agent_harness_transformed_skill.content }}"
    dest: "{{ agent_harness_agent_config.skills_dir }}/{{ agent_harness_skill_info.name }}/SKILL.md"
    mode: "0644"
