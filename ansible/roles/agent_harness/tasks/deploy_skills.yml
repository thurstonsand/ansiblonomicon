---
# Deploy skills to a target agent

- name: Set agent config
  ansible.builtin.set_fact:
    agent_harness_agent_config: "{{ agent_harness_agents[agent_harness_target_agent] }}"

- name: Build agent-specific skills list
  ansible.builtin.set_fact:
    agent_harness_agent_specific_skills: >-
      {{ agent_harness_plugin_resources.skills
         | agent_harness_filter_resources(agent_harness_target_agent, agent_harness_agent_config.name_transform,
                                          agent_harness_target_agent in agent_harness_explicit_only_agents) }}

- name: Ensure skills directory exists
  ansible.builtin.file:
    path: "{{ agent_harness_agent_config.skills_dir }}"
    state: directory
    mode: "0755"

- name: Deploy skills
  ansible.builtin.include_tasks: deploy_single_skill.yml
  loop: "{{ agent_harness_agent_specific_skills }}"
  loop_control:
    loop_var: agent_harness_skill_info
    label: "{{ agent_harness_skill_info.name }}"
  when: agent_harness_agent_specific_skills | length > 0
