---
# Deploy a single agent to the target agent

- name: Check if agent source exists
  ansible.builtin.stat:
    path: "{{ agent_harness_agent_info.source }}"
  delegate_to: "{{ agent_harness_source_delegate_host }}"
  register: agent_harness_agent_source_stat

- name: Fail if agent source not found
  ansible.builtin.fail:
    msg: "Agent source not found: {{ agent_harness_agent_info.source }} (from {{ agent_harness_agent_info.origin }})"
  when: not agent_harness_agent_source_stat.stat.exists

- name: Resolve agent frontmatter name
  ansible.builtin.set_fact:
    agent_harness_agent_frontmatter_name: >-
      {{ ((agent_harness_agent_config.name_transform | default('preserve')) == 'preserve')
         | ternary(agent_harness_agent_info.display_name | default(agent_harness_agent_info.name),
                   agent_harness_agent_info.name) }}

- name: Transform agent file for target
  ansible.builtin.set_fact:
    agent_harness_transformed_agent: >-
      {{ agent_harness_agent_info.source
         | agent_harness_transform_skill(agent_harness_target_agent, agent_harness_models.models,
                                         agent_harness_agent_info.plugin_root | default(''),
                                         agent_harness_agent_frontmatter_name) }}

- name: Copy agent file
  ansible.builtin.copy:
    content: "{{ agent_harness_transformed_agent.content }}"
    dest: "{{ agent_harness_agent_config.agents_dir }}/{{ agent_harness_agent_info.name }}.md"
    mode: "0644"
