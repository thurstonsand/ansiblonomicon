---
# Agent Harness - Deploy AI agent skills/agents

- name: Locate the canonical agent harness capability
  ansible.builtin.set_fact:
    agent_harness_root: "{{ (playbook_dir ~ '/../../bootstrap/capabilities/agent-harness') | realpath }}"

- name: Load canonical agent harness profiles and layouts
  ansible.builtin.set_fact:
    agent_harness_declarations: >-
      {{ agent_harness_root
         | agent_harness_load_declarations(ansible_facts.env.HOME) }}

- name: Select canonical agent harness profiles and layouts
  ansible.builtin.set_fact:
    agent_harness_profiles: "{{ agent_harness_declarations.profiles }}"
    agent_harness_agents: "{{ agent_harness_declarations.agents }}"

- name: Load canonical agent harness catalogue
  ansible.builtin.set_fact:
    agent_harness_sources: "{{ (agent_harness_root ~ '/catalogue.toml') | agent_harness_load_catalogue }}"

- name: Select agent harness source execution context
  ansible.builtin.set_fact:
    agent_harness_source_delegate_host: >-
      {{ ((ansible_connection | default('ssh')) == 'local') | ternary(inventory_hostname, 'localhost') }}
    agent_harness_effective_cache_dir: >-
      {{
        ((ansible_connection | default('ssh')) == 'local')
        | ternary(agent_harness_cache_dir, lookup('env', 'HOME') ~ '/.cache/ansiblonomicon-harness')
      }}

- name: Resolve sources for this host profile
  ansible.builtin.set_fact:
    agent_harness_resolved_sources: >-
      {{ agent_harness_sources
         | agent_harness_resolve_sources(
             agent_harness_profile,
             agent_harness_profiles.keys() | list,
             agent_harness_agents.keys() | list,
             agent_harness_sources_extra) }}

- name: Clone git repositories
  ansible.builtin.include_tasks: clone_git_repos.yml
  when: agent_harness_resolved_sources | selectattr('repo', 'defined') | list | length > 0

- name: Build plugin resources from all sources
  ansible.builtin.set_fact:
    agent_harness_plugin_resources: "{{ agent_harness_resolved_sources | agent_harness_build_plugin_resources(agent_harness_effective_cache_dir) }}"

- name: Deploy skills to target agents
  ansible.builtin.include_tasks: deploy_skills.yml
  loop: "{{ agent_harness_target_agents }}"
  loop_control:
    loop_var: agent_harness_target_agent

- name: Deploy hook fragments
  ansible.builtin.include_tasks: deploy_hooks.yml

- name: Deploy agents to target agents
  ansible.builtin.include_tasks: deploy_agents.yml
  loop: "{{ agent_harness_target_agents }}"
  loop_control:
    loop_var: agent_harness_target_agent

- name: Cleanup orphaned skills and agents
  ansible.builtin.include_tasks: cleanup_orphans.yml
  loop: "{{ agent_harness_target_agents }}"
  loop_control:
    loop_var: agent_harness_target_agent

- name: Expose pi-installed Glimpse to the interview tool
  ansible.builtin.include_tasks: link_glimpse.yml
  when: agent_harness_link_glimpse | default(false)
