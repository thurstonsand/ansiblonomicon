---
# Cleanup orphaned skills, commands, and agents not managed by agent_harness
# This makes Ansible the source of truth for these directories

- name: Set agent config for cleanup
  ansible.builtin.set_fact:
    agent_harness_agent_config: "{{ agent_harness_agents[agent_harness_target_agent] }}"

# --- Skills cleanup ---

- name: Find existing skills in destination
  ansible.builtin.find:
    paths: "{{ agent_harness_agent_config.skills_dir }}"
    file_type: directory
    recurse: false
  register: agent_harness_existing_skills

- name: Build expected skills list
  ansible.builtin.set_fact:
    agent_harness_expected_skills: "{{ agent_harness_plugin_resources.skills | map(attribute='name') | list }}"

- name: Identify orphaned skills
  ansible.builtin.set_fact:
    agent_harness_orphaned_skills: >-
      {{ agent_harness_existing_skills.files
         | map(attribute='path')
         | map('basename')
         | difference(agent_harness_expected_skills) }}

- name: Remove orphaned skills
  ansible.builtin.file:
    path: "{{ agent_harness_agent_config.skills_dir }}/{{ item }}"
    state: absent
  loop: "{{ agent_harness_orphaned_skills }}"
  when: agent_harness_orphaned_skills | length > 0

# --- Commands cleanup ---

- name: Find existing commands in destination
  ansible.builtin.find:
    paths: "{{ agent_harness_agent_config.commands_dir }}"
    patterns: "*.md"
    file_type: file
    recurse: false
  register: agent_harness_existing_commands

- name: Build expected commands list (with .md extension)
  ansible.builtin.set_fact:
    agent_harness_expected_commands: "{{ agent_harness_plugin_resources.commands | map(attribute='name') | map('regex_replace', '$', '.md') | list }}"

- name: Identify orphaned commands
  ansible.builtin.set_fact:
    agent_harness_orphaned_commands: >-
      {{ agent_harness_existing_commands.files
         | map(attribute='path')
         | map('basename')
         | difference(agent_harness_expected_commands) }}

- name: Remove orphaned commands
  ansible.builtin.file:
    path: "{{ agent_harness_agent_config.commands_dir }}/{{ item }}"
    state: absent
  loop: "{{ agent_harness_orphaned_commands }}"
  when: agent_harness_orphaned_commands | length > 0

# --- Agents cleanup ---

- name: Find existing agents in destination
  ansible.builtin.find:
    paths: "{{ agent_harness_agent_config.agents_dir }}"
    patterns: "*.md"
    file_type: file
    recurse: false
  register: agent_harness_existing_agents

- name: Build expected agents list (with .md extension)
  ansible.builtin.set_fact:
    agent_harness_expected_agents: "{{ agent_harness_plugin_resources.agents | map(attribute='name') | map('regex_replace', '$', '.md') | list }}"

- name: Identify orphaned agents
  ansible.builtin.set_fact:
    agent_harness_orphaned_agents: >-
      {{ agent_harness_existing_agents.files
         | map(attribute='path')
         | map('basename')
         | difference(agent_harness_expected_agents) }}

- name: Remove orphaned agents
  ansible.builtin.file:
    path: "{{ agent_harness_agent_config.agents_dir }}/{{ item }}"
    state: absent
  loop: "{{ agent_harness_orphaned_agents }}"
  when: agent_harness_orphaned_agents | length > 0
