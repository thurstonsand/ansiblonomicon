---
# Deploy a single command to the target agent

- name: Check if command source exists
  ansible.builtin.stat:
    path: "{{ agent_harness_command_info.source }}"
  register: agent_harness_command_source_stat

- name: Fail if command source not found
  ansible.builtin.fail:
    msg: "Command source not found: {{ agent_harness_command_info.source }} (from {{ agent_harness_command_info.origin }})"
  when: not agent_harness_command_source_stat.stat.exists

- name: Copy command file
  ansible.builtin.copy:
    src: "{{ agent_harness_command_info.source }}"
    dest: "{{ agent_harness_agent_config.commands_dir }}/{{ agent_harness_command_info.name }}.md"
    mode: "0644"
