---
# Deploy commands to a target agent

- name: Set agent config
  ansible.builtin.set_fact:
    agent_harness_agent_config: "{{ agent_harness_agents[agent_harness_target_agent] }}"

- name: Build agent-specific commands list
  ansible.builtin.set_fact:
    agent_harness_agent_specific_commands: >-
      {{ agent_harness_plugin_resources.commands
         | agent_harness_filter_resources(agent_harness_target_agent) }}

- name: Ensure commands directory exists
  ansible.builtin.file:
    path: "{{ agent_harness_agent_config.commands_dir }}"
    state: directory
    mode: "0755"

- name: Deploy commands
  ansible.builtin.include_tasks: deploy_single_command.yml
  loop: "{{ agent_harness_agent_specific_commands }}"
  loop_control:
    loop_var: agent_harness_command_info
    label: "{{ agent_harness_command_info.name }}"
  when: agent_harness_agent_specific_commands | length > 0
