---
# Which agents to deploy to, from the host's capability profile
agent_harness_target_agents: "{{ agent_harness_profiles[agent_harness_profile].target_agents }}"

# Agents that receive only plugins naming them in target_agents; untargeted
# plugins, which normally deploy everywhere, skip these
agent_harness_explicit_only_agents: "{{ agent_harness_profiles[agent_harness_profile].explicit_only | default([]) }}"

# Uncommitted host-local sources appended after the committed ones
# Supports both git repos and local paths
agent_harness_sources_extra: []
#   # Git sources - clone from GitHub, updated on the interval below
#   - repo: anthropics/claude-code
#     plugins:
#       - name: memory                       # manifest-resolved via plugin.json
#         exclude_skills: [unwanted-skill]   # or a {profile: [...]} map
#
#   # Local sources - use existing directory
#   - local: "{{ playbook_dir }}/../ai-resources"
#     plugins:
#       - name: my-plugin                    # manifest-resolved: {local}/my-plugin
#       - name: another-plugin               # explicit map: no manifest needed
#         skills:
#           deployed-name: path/to/skill-dir # relative to the local path above

# Minimum time between remote update checks for git sources
# Defaults to once per day
agent_harness_update_interval_seconds: 86400

# Global cleanup toggles (can be overridden per-agent in vars/agents.yml)
agent_harness_cleanup_orphaned_skills: true
agent_harness_cleanup_orphaned_agents: true

# Where to cache git repos
agent_harness_cache_dir: "{{ ansible_facts.env.HOME }}/.cache/ansiblonomicon-harness"

# Symlink pi's git-installed Glimpse clone into the global npm root so the
# interview tool resolves the native UI instead of falling back to a browser.
# Off by default; enable on hosts where glimpse is installed as a pi git package.
agent_harness_link_glimpse: false
agent_harness_glimpse_clone: "{{ ansible_facts.env.HOME }}/.pi/agent/git/github.com/hazat/glimpse"
