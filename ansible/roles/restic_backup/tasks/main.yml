---
- name: Require resolved backup credentials before mutation
  ansible.builtin.assert:
    that:
      - lookup('env', 'RESTIC_B2_BUCKET') | length > 0
      - restic_backup_account_id | length > 0
      - restic_backup_account_key | length > 0
      - restic_backup_password | length > 0
    fail_msg: >-
      Select RESTIC_B2_BUCKET, RESTIC_B2_KEY_ID, RESTIC_B2_APPLICATION_KEY,
      and RESTIC_REPOSITORY_PASSWORD explicitly with fnox-host exec --secret.
  no_log: true

- name: Create private backup credential directory
  become: true
  ansible.builtin.file:
    path: "{{ restic_backup_credentials_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render retained backup credentials
  become: true
  ansible.builtin.template:
    src: credentials.sh.j2
    dest: "{{ restic_backup_credentials_dir }}/credentials"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install restic and its runtime dependencies
  become: true
  ansible.builtin.apt:
    name:
      - restic
      - curl
    state: present

- name: Register Healthchecks check for the backup job
  ansible.builtin.include_role:
    name: alerting
    tasks_from: check.yml
  vars:
    alerting_check_name: restic-backup
    alerting_check_schedule: "30 3 * * *"
    alerting_check_grace: 7200

- name: Register Healthchecks check for the maintenance job
  ansible.builtin.include_role:
    name: alerting
    tasks_from: check.yml
  vars:
    alerting_check_name: restic-maintenance
    alerting_check_schedule: "0 5 1-7 * 0"
    alerting_check_grace: 14400

- name: Deploy restic backup script
  become: true
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: "{{ restic_backup_bin_dir }}/restic-backup"
    mode: "0755"

- name: Deploy systemd units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - restic-backup.service
    - restic-backup.timer
    - restic-backup-maintenance.service
    - restic-backup-maintenance.timer
  notify: Reload systemd for restic backup

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timers
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - restic-backup.timer
    - restic-backup-maintenance.timer
