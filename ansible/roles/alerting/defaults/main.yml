---
# One channel, one contract (ticket 12): scheduled jobs report to Healthchecks,
# events POST to Hark. Both secrets arrive as SecretRefs resolved into the env.
alerting_bin_dir: /usr/local/bin
alerting_state_dir: /etc/alerting
alerting_hark_webhook_url: "{{ lookup('env', 'HARK_WEBHOOK_URL_POD042') }}"
alerting_healthchecks_api_key: "{{ lookup('env', 'HEALTHCHECKS_API_KEY') }}"
alerting_healthchecks_api_url: https://healthchecks.io/api/v3/checks/
alerting_healthchecks_timezone: America/New_York
# Systemd jobs load the ping URL as a credential from this file; jobs inside a
# container take alerting_check_ping_url as a value and want no file at all.
alerting_check_install_url: true
alerting_source: "{{ ansible_facts.hostname }}"

# Host-alive check. Every other check is registered by the role that owns the job.
alerting_heartbeat_check: "{{ alerting_source }}-heartbeat"
alerting_heartbeat_schedule: "*/15 * * * *"
alerting_heartbeat_grace: 900
alerting_heartbeat_calendar: "*:0/15"
