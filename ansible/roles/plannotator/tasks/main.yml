---
- name: Resolve latest Plannotator version
  when: plannotator_version == "latest"
  ansible.builtin.uri:
    url: https://api.github.com/repos/backnotprop/plannotator/releases/latest
    return_content: true
  register: plannotator_latest_release
  changed_when: false

- name: Compute Plannotator release tag
  ansible.builtin.set_fact:
    plannotator_release_tag: >-
      {{
        (plannotator_latest_release.json.tag_name if plannotator_version == "latest" else plannotator_version)
        | regex_replace('^(?!v)', 'v')
      }}

- name: Compute Plannotator platform name
  ansible.builtin.set_fact:
    plannotator_platform: >-
      {{
        ({'Darwin': 'darwin', 'Linux': 'linux'}[ansible_facts['system']])
        ~ '-'
        ~ ({'x86_64': 'x64', 'amd64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}[ansible_facts['machine']])
      }}

- name: Ensure Plannotator install directory exists
  ansible.builtin.file:
    path: "{{ plannotator_install_dir }}"
    state: directory
    mode: "0755"

- name: Download Plannotator checksum
  ansible.builtin.uri:
    url: "https://github.com/backnotprop/plannotator/releases/download/{{ plannotator_release_tag }}/plannotator-{{ plannotator_platform }}.sha256"
    return_content: true
  register: plannotator_checksum_response
  changed_when: false

- name: Download Plannotator binary
  ansible.builtin.get_url:
    url: "https://github.com/backnotprop/plannotator/releases/download/{{ plannotator_release_tag }}/plannotator-{{ plannotator_platform }}"
    dest: "{{ plannotator_install_dir }}/plannotator"
    checksum: "sha256:{{ plannotator_checksum_response.content.split()[0] }}"
    mode: "0755"
