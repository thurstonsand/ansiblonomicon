---
- name: Install 1Password CLI repository prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present

- name: Ensure apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Install 1Password repository key
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /usr/share/keyrings/1password-archive-keyring.asc
    mode: "0644"

- name: Configure 1Password apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.asc]
      https://downloads.1password.com/linux/debian/amd64 stable main
    filename: 1password
    state: present

- name: Install 1Password CLI
  become: true
  ansible.builtin.apt:
    name: 1password-cli
    state: present
    update_cache: true

- name: Ensure service account secret directory exists
  ansible.builtin.file:
    path: "{{ op_service_account_token_dir }}"
    state: directory
    mode: "0700"

- name: Check existing service account token
  ansible.builtin.stat:
    path: "{{ op_service_account_token_path }}"
  register: op_service_account_token_file
  no_log: true

- name: Require service account bootstrap token
  ansible.builtin.assert:
    that:
      - >-
        op_service_account_bootstrap_token | length > 0
        or (
          op_service_account_token_file.stat.exists
          and op_service_account_token_file.stat.size | int > 0
        )
    fail_msg: >-
      OP_SERVICE_ACCOUNT_TOKEN must be exported for first provisioning.
      Later local runs reuse {{ op_service_account_token_path }}.
  no_log: true

- name: Store service account bootstrap token
  when: op_service_account_bootstrap_token | length > 0
  ansible.builtin.copy:
    dest: "{{ op_service_account_token_path }}"
    content: "{{ op_service_account_bootstrap_token }}\n"
    mode: "0600"
  no_log: true

- name: Ensure service account launcher directory exists
  ansible.builtin.file:
    path: "{{ op_service_account_launcher_path | dirname }}"
    state: directory
    mode: "0755"

- name: Install service account op launcher
  ansible.builtin.template:
    src: op-service-account.j2
    dest: "{{ op_service_account_launcher_path }}"
    mode: "0755"
