---
# Everything this repo runs goes through mise, so this role has to come before
# the homebrew role: `brew bundle cleanup --force` prunes the Homebrew mise the
# moment it leaves the Brewfile, and a reconcile that deletes its own
# interpreter with no replacement on disk leaves the host unbootstrappable.
- name: Check for the standalone mise install
  ansible.builtin.stat:
    path: "{{ mise_binary }}"
  register: mise_installed

# get_url is the usual shape for this, but it probes with HEAD in check mode
# and mise.run answers 405. Piping the installer sidesteps that and still reads
# `creates` under --check, so a missing mise reports as a would-change without
# anything being fetched or run.
- name: Install mise from the official installer
  when: not mise_installed.stat.exists
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL {{ mise_installer_url }} | sh
    executable: /bin/bash
    creates: "{{ mise_binary }}"
  environment:
    MISE_INSTALL_PATH: "{{ mise_binary }}"
