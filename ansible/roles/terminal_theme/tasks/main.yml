---
# Manage terminal theme detection and mirroring helpers.

- name: Ensure terminal theme common directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
      mode: "0755"
    - path: "{{ ansible_facts['env']['HOME'] }}/.config/zsh"
      mode: "0755"
    - path: "{{ ansible_facts['env']['HOME'] }}/.config/hunk"
      mode: "0755"
    - path: "{{ ansible_facts['env']['HOME'] }}/.local/state/terminal-theme/leases"
      mode: "0755"

- name: Install terminal theme Python helpers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - src: terminal_theme_common.py
      dest: terminal_theme_common.py
      mode: "0644"
    - src: terminal-theme-switch.py
      dest: terminal-theme-switch.py
      mode: "0755"
    - src: hunk_gruvbox_theme.py
      dest: hunk_gruvbox_theme.py
      mode: "0755"
  register: terminal_theme_python_helpers

- name: Install terminal theme zsh helper
  ansible.builtin.copy:
    src: terminal-theme.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zsh/terminal-theme.zsh"
    mode: "0644"
  register: terminal_theme_zsh_helper

- name: Ensure detector SSH config directory exists
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
      mode: "0700"
    - path: "{{ ansible_facts['env']['HOME'] }}/.ssh/config.d"
      mode: "0700"
  when: terminal_theme_profile == 'detector'

- name: Install terminal theme SSH lease helper
  ansible.builtin.copy:
    src: terminal-theme-ssh-lease.py
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/terminal-theme-ssh-lease.py"
    mode: "0755"
  register: terminal_theme_ssh_lease_script
  when: terminal_theme_profile == 'detector'

- name: Install terminal theme SSH config snippet
  ansible.builtin.template:
    src: terminal-theme-ssh.conf.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config.d/terminal-theme.conf"
    mode: "0600"
  when: terminal_theme_profile == 'detector'

- name: Ensure macOS detector directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents"
      mode: "0755"
  when: terminal_theme_profile == 'detector'

- name: Install terminal theme watch script
  ansible.builtin.copy:
    src: terminal-theme-watch
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/terminal-theme-watch"
    mode: "0755"
  register: terminal_theme_watch_script
  when: terminal_theme_profile == 'detector'

- name: Install terminal theme LaunchAgent
  ansible.builtin.template:
    src: house.thurstons.terminal-theme-watch.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/house.thurstons.terminal-theme-watch.plist"
    mode: "0600"
  register: terminal_theme_launch_agent_plist
  when: terminal_theme_profile == 'detector'

- name: Check terminal background state file
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.terminal-bg"
  register: terminal_theme_state_file

- name: Read terminal background state file
  ansible.builtin.command:
    argv:
      - cat
      - "{{ ansible_facts['env']['HOME'] }}/.terminal-bg"
  register: terminal_theme_state_file_content
  changed_when: false
  check_mode: false
  when: terminal_theme_state_file.stat.exists

- name: Detect current macOS appearance
  ansible.builtin.command:
    argv:
      - defaults
      - read
      - -g
      - AppleInterfaceStyle
  register: terminal_theme_macos_appearance
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - terminal_theme_profile == 'detector'
    - not terminal_theme_state_file.stat.exists

- name: Set terminal theme mode fact
  ansible.builtin.set_fact:
    terminal_theme_mode: >-
      {{ terminal_theme_state_file.stat.exists | ternary(
        terminal_theme_state_file_content.stdout | trim,
        (terminal_theme_profile == 'detector') | ternary(
          (terminal_theme_macos_appearance.rc | default(1) == 0) | ternary('dark', 'light'),
          'dark'
        )
      ) }}

- name: Seed terminal theme state from current macOS appearance
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/terminal-theme-switch.py"
      - "{{ terminal_theme_mode }}"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: true
  when:
    - terminal_theme_profile == 'detector'
    - not ansible_check_mode
    - not terminal_theme_state_file.stat.exists

- name: Render current Hunk custom theme
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/hunk_gruvbox_theme.py"
      - "{{ terminal_theme_mode }}"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false
  check_mode: false
  register: terminal_theme_hunk_custom_theme_result

- name: Install Hunk config
  ansible.builtin.template:
    src: hunk/config.toml.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/hunk/config.toml"
    mode: "0644"
  vars:
    terminal_theme_hunk_custom_theme: "{{ terminal_theme_hunk_custom_theme_result.stdout }}"

- name: Detect whether terminal theme LaunchAgent needs reload
  ansible.builtin.set_fact:
    terminal_theme_reload_required: >-
      {{
        terminal_theme_watch_script.changed | default(false)
        or terminal_theme_python_helpers.changed | default(false)
        or terminal_theme_zsh_helper.changed | default(false)
        or terminal_theme_launch_agent_plist.changed | default(false)
      }}
  when: terminal_theme_profile == 'detector'

- name: Ensure terminal theme LaunchAgent is enabled and running
  community.general.launchd:
    name: house.thurstons.terminal-theme-watch
    enabled: true
    state: started
  when: terminal_theme_profile == 'detector'

- name: Reload terminal theme LaunchAgent
  community.general.launchd:
    name: house.thurstons.terminal-theme-watch
    state: reloaded
  when:
    - terminal_theme_profile == 'detector'
    - not ansible_check_mode
    - terminal_theme_reload_required | default(false)
