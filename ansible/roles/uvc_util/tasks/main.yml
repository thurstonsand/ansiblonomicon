---
# Clone uvc-util, build the binary, and deploy camera configuration scripts

- name: Ensure ~/.local/opt directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt"
    state: directory
    mode: "0755"

- name: Clone uvc-util repository
  ansible.builtin.git:
    repo: https://github.com/jtfrey/uvc-util.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/uvc-util"
    version: master
    update: true
  register: uvc_util_clone

- name: Check if uvc-util binary exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/uvc-util/src/uvc-util"
  register: uvc_util_binary

- name: Copy AGENTS.md to uvc-util repo
  ansible.builtin.copy:
    src: AGENTS.md
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/uvc-util/AGENTS.md"
    mode: "0644"

- name: Build uvc-util with gcc
  ansible.builtin.command:
    argv:
      - gcc
      - -o
      - uvc-util
      - -framework
      - IOKit
      - -framework
      - Foundation
      - uvc-util.m
      - UVCController.m
      - UVCType.m
      - UVCValue.m
    chdir: "{{ ansible_facts['env']['HOME'] }}/.local/opt/uvc-util/src"
  when: uvc_util_clone.changed or not uvc_util_binary.stat.exists
  changed_when: true

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Copy configure_camera.py to uvc-util directory
  ansible.builtin.copy:
    src: configure_camera.py
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/uvc-util/configure_camera.py"
    mode: "0755"

- name: Copy camera_settings.json to uvc-util directory
  ansible.builtin.copy:
    src: camera_settings.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/uvc-util/camera_settings.json"
    mode: "0644"

- name: Symlink configure_camera.py to ~/.local/bin
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/opt/uvc-util/configure_camera.py"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/configure_camera.py"
    state: link
    force: true
