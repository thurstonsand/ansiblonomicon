---
- name: Install sanoid
  become: true
  ansible.builtin.apt:
    name: sanoid
    state: present

# Debian ships sanoid without its config directory.
- name: Ensure the sanoid config directory exists
  become: true
  ansible.builtin.file:
    path: /etc/sanoid
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure sanoid policy
  become: true
  ansible.builtin.template:
    src: sanoid.conf.j2
    dest: /etc/sanoid/sanoid.conf
    owner: root
    group: root
    mode: "0644"

- name: Register the sanoid check
  ansible.builtin.include_role:
    name: alerting
    tasks_from: check.yml
  vars:
    alerting_check_name: "{{ zfs_maintenance_sanoid_check }}"
    alerting_check_schedule: "{{ zfs_maintenance_sanoid_schedule }}"
    alerting_check_grace: "{{ zfs_maintenance_sanoid_grace }}"

- name: Ensure the sanoid drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/sanoid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Report sanoid runs to Healthchecks
  become: true
  ansible.builtin.template:
    src: sanoid-healthchecks.conf.j2
    dest: /etc/systemd/system/sanoid.service.d/10-healthchecks.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for zfs maintenance

- name: Flush handlers so sanoid picks up its drop-in
  ansible.builtin.meta: flush_handlers

- name: Enable the sanoid timer
  become: true
  ansible.builtin.systemd_service:
    name: sanoid.timer
    enabled: true
    state: started
