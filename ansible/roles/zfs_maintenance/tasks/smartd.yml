---
- name: Install smartmontools
  become: true
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Install the smartd alert handler
  become: true
  ansible.builtin.template:
    src: smartd-alert.j2
    dest: "{{ zfs_maintenance_bin_dir }}/smartd-alert"
    owner: root
    group: root
    mode: "0755"

- name: Configure smartd
  become: true
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart smartd

- name: Enable smartd
  become: true
  ansible.builtin.systemd_service:
    name: smartd
    enabled: true
    state: started
