---
- name: Reload systemd for zfs maintenance
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart smartd
  become: true
  ansible.builtin.systemd_service:
    name: smartd
    state: restarted

- name: Restart zed
  become: true
  ansible.builtin.systemd_service:
    name: zfs-zed
    state: restarted
