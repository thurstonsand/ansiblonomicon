- name: Set stack config path  # noqa: var-naming[no-role-prefix] - updating existing fact
  ansible.builtin.set_fact:
    docker: "{{ docker | combine({'config_dir': docker.config_base ~ '/' ~ docker_stack_name}) }}"
    docker_stack_src: "{{ playbook_dir }}/../stacks/{{ docker_stack_name }}"
    docker_stack_dest: "{{ docker.config_base }}/stacks/{{ docker_stack_name }}"
    _docker_stack_changed: false

- name: Ensure stack directory exists
  ansible.builtin.file:
    path: "{{ docker_stack_dest }}"
    state: directory
    mode: "0750"

- name: Clone/update source repository
  when: docker_stack_source is defined and docker_stack_source.repo is defined
  ansible.builtin.git:
    repo: "{{ docker_stack_source.repo }}"
    dest: "{{ docker_stack_dest }}/{{ docker_stack_source.dest | default('source') }}"
    version: "{{ docker_stack_source.version | default('main') }}"
    force: true
  register: _docker_stack_git_result

- name: Track source repository changes  # noqa: var-naming[no-role-prefix] - internal tracking fact
  when: _docker_stack_git_result is defined and _docker_stack_git_result is changed
  ansible.builtin.set_fact:
    _docker_stack_changed: true

- name: Sync stack-level files
  ansible.builtin.include_tasks: sync_files.yml
  vars:
    sync_src: "{{ docker_stack_src }}"
    sync_dest: "{{ docker_stack_dest }}"
    sync_recurse: false

- name: Find container directories
  ansible.builtin.find:
    paths: "{{ docker_stack_src }}"
    file_type: directory
    recurse: false
  register: docker_stack_container_dirs
  delegate_to: localhost
  become: false

- name: Process each container directory
  ansible.builtin.include_tasks: sync_container.yml
  loop: "{{ docker_stack_container_dirs.files | default([]) }}"
  loop_control:
    loop_var: container_dir
    label: "{{ container_dir.path | basename }}"

- name: Rebuild images (no-cache)
  when: _docker_stack_changed and (docker_stack_build_on_change | default(true))
  ansible.builtin.command:
    cmd: docker compose build --no-cache
    chdir: "{{ docker_stack_dest }}"
  changed_when: true

# Sidecars that drive `docker compose` themselves race this deploy: both clients
# recreate the same containers, one renames a container out from under the other,
# and the loser fails with "No such container". Stop them for the duration; the
# deploy's own `compose up` starts them again as part of the project.
- name: Deploy stack
  block:
    - name: Stop containers that drive compose themselves
      ansible.builtin.command:
        cmd: "docker stop {{ item }}"
      loop: "{{ docker_stack_pause_containers | default([]) }}"
      changed_when: true

    - name: Deploy stack
      community.docker.docker_compose_v2:
        project_src: "{{ docker_stack_dest }}"
        state: present
        pull: "{{ docker_stack_pull_policy | default('missing') }}"
        build: policy
  always:
    - name: Check paused containers came back
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: "{{ docker_stack_pause_containers | default([]) }}"
      register: _docker_stack_paused_info

    - name: Restart paused containers the deploy left stopped
      ansible.builtin.command:
        cmd: "docker start {{ item.item }}"
      loop: "{{ _docker_stack_paused_info.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.exists and not item.container.State.Running
      changed_when: true
