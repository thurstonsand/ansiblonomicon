---
# Sync files from source to destination
# Uses rsync for bulk plain files and ansible.builtin.template for .j2 files.
#
# Params:
#   sync_src: source directory (local)
#   sync_dest: destination directory (remote)
#   sync_recurse: whether to recurse into subdirectories (default: true)
#   sync_owner: optional owner UID for files/dirs
#   sync_group: optional group GID for files/dirs

- name: Find .j2 templates in {{ sync_src | basename }}
  ansible.builtin.find:
    paths: "{{ sync_src }}"
    recurse: "{{ sync_recurse | default(true) }}"
    file_type: file
    patterns: "*.j2"
  register: docker_stack_j2_files
  delegate_to: localhost
  become: false

- name: Rsync plain files to {{ sync_dest | basename }}
  ansible.posix.synchronize:
    src: "{{ sync_src }}/"
    dest: "{{ sync_dest }}/"
    recursive: "{{ sync_recurse | default(true) }}"
    delete: false
    rsync_opts:
      - "--exclude=*.j2"
  register: docker_stack_sync_rsync_result

- name: Fix ownership on rsynced files
  ansible.builtin.file:
    path: "{{ sync_dest }}"
    state: directory
    recurse: "{{ sync_recurse | default(true) }}"
    owner: "{{ sync_owner }}"
    group: "{{ sync_group }}"
  when: sync_owner is defined and sync_group is defined and docker_stack_sync_rsync_result is changed

- name: Template .j2 files to {{ sync_dest | basename }}
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "{{ sync_dest }}/{{ item.path | relpath(sync_src) | regex_replace('\\.j2$', '') }}"
    mode: "{{ item.mode }}"
    owner: "{{ sync_owner | default(omit) }}"
    group: "{{ sync_group | default(omit) }}"
  loop: "{{ docker_stack_j2_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | relpath(sync_src) | regex_replace('\\.j2$', '') }}"
  register: docker_stack_sync_template_result

- name: Track synced file changes  # noqa: var-naming[no-role-prefix] - internal tracking fact
  when: docker_stack_sync_template_result is changed or docker_stack_sync_rsync_result is changed
  ansible.builtin.set_fact:
    _docker_stack_changed: true
