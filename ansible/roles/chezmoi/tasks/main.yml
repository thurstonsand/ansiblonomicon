---
- name: Require a local complete repository checkout
  ansible.builtin.assert:
    that:
      - (ansible_connection | default('ssh')) == 'local'
    fail_msg: Remote hosts must reconcile their persistent checkout through native mise.

- name: Select chezmoi binary path
  ansible.builtin.set_fact:
    chezmoi_bin: >-
      {{
        (ansible_facts['os_family'] == 'Darwin')
        | ternary('/opt/homebrew/bin/chezmoi', ansible_facts.env.HOME ~ '/.local/share/mise/shims/chezmoi')
      }}

- name: Check if chezmoi is initialized
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/chezmoi/chezmoi.toml"
  register: chezmoi_config

- name: Initialize or refresh chezmoi config from source
  ansible.builtin.command:
    argv:
      - "{{ chezmoi_bin }}"
      - init
      - "--source={{ chezmoi_source_dir }}"
  changed_when: not chezmoi_config.stat.exists
  check_mode: false

- name: Check what chezmoi would change
  ansible.builtin.command:
    argv:
      - "{{ chezmoi_bin }}"
      - "--source={{ chezmoi_source_dir }}"
      - status
  register: chezmoi_status
  changed_when: false
  check_mode: false
  no_log: true

- name: Show changed chezmoi paths
  ansible.builtin.debug:
    msg: "{{ chezmoi_status.stdout_lines }}"
  when: chezmoi_status.stdout | length > 0

- name: Apply chezmoi dotfiles
  ansible.builtin.command:
    argv:
      - "{{ chezmoi_bin }}"
      - "--source={{ chezmoi_source_dir }}"
      - apply
      - --force
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - chezmoi_status.stdout | length > 0
