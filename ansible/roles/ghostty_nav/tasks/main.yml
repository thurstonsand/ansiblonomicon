---
# Build ghostty-nav Swift binary and compile AppleScripts for BTT.
# Binary: raw Apple Events for Neovim edge-fallback (--ghostty-only).
# AppleScripts: pre-compiled .scpt for BTT's in-process runtime (context-aware nav).

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Ensure ~/.local/share/ghostty-nav directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/ghostty-nav"
    state: directory
    mode: "0755"

- name: Get Swift source checksum
  ansible.builtin.stat:
    path: "{{ role_path }}/files/ghostty-nav.swift"
    checksum_algorithm: sha256
  register: ghostty_nav_source

- name: Check installed binary
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/ghostty-nav"
  register: ghostty_nav_binary

- name: Read last build checksum
  ansible.builtin.slurp:
    src: "{{ role_path }}/.build-checksum"
  register: ghostty_nav_stored
  failed_when: false

- name: Build ghostty-nav
  ansible.builtin.command:
    argv:
      - swiftc
      - -O
      - -o
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/ghostty-nav"
      - "{{ role_path }}/files/ghostty-nav.swift"
  when: >-
    not ghostty_nav_binary.stat.exists
    or ghostty_nav_stored is failed
    or (ghostty_nav_stored.content | default('') | b64decode | trim) != ghostty_nav_source.stat.checksum
  changed_when: true
  notify: Store ghostty-nav build checksum

- name: Compile AppleScripts for BTT
  ansible.builtin.command:
    argv:
      - osacompile
      - -o
      - "{{ ansible_facts['env']['HOME'] }}/.local/share/ghostty-nav/{{ item | basename | regex_replace('\\.applescript$', '.scpt') }}"
      - "{{ item }}"
  loop: "{{ lookup('fileglob', role_path + '/files/nav-*.applescript', wantlist=True) }}"
  register: ghostty_nav_compile
  changed_when: true
