---
# Work macOS-specific configuration (corporate laptop)

# Machine identity (used by playbook guard)
hostname_prefix: "ML-"

# Feature flags
configure_homebrew: true
configure_macos_defaults: true
configure_uvc_util: true
configure_chezmoi: true
configure_pam_reattach: false
configure_agent_harness: true

# Go tools (work-specific)
go_tools_extra:
  - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

# Agent Harness - only deploy to Claude on work machine
agent_harness_target_agents:
  - claude

# Don't delete unmanaged skills (some exist outside git)
agent_harness_cleanup_orphaned_skills: false
agent_harness_cleanup_orphaned_agents: false

agent_harness_sources:
  - local: "{{ playbook_dir }}/../../agents"
    plugins:
      - name: project-management
        target_agents: [claude]
        exclude_skills:
          - showboat
      - name: claude
        target_agents: [claude]
