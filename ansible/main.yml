---
# Main entry point for system configuration
# Run with: ansible-playbook main.yml

- name: Configure host
  hosts: all

  vars_files:
    - config.yml

  pre_tasks:
    - name: Load Darwin-specific config
      ansible.builtin.include_vars: darwin.config.yml
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Load Arch Linux-specific config
      ansible.builtin.include_vars: archlinux.config.yml
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]

    - name: Display system info
      ansible.builtin.debug:
        msg: "Configuring {{ ansible_facts['os_family'] }} ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
      tags: ["always"]

  tasks:
    - name: Install packages with brew bundle
      when: ansible_facts['os_family'] == "Darwin" and configure_homebrew
      tags: ["homebrew", "mas"]
      block:
        - name: Check brew bundle (dry run)
          when: ansible_check_mode
          check_mode: false
          ansible.builtin.command:
            argv:
              - brew
              - bundle
              - check
              - "--file={{ playbook_dir }}/Brewfile"
              - --verbose
          register: brew_result
          changed_when: brew_result.rc != 0
          failed_when: false

        - name: Run brew bundle
          when: not ansible_check_mode
          ansible.builtin.command:
            argv:
              - brew
              - bundle
              - "--file={{ playbook_dir }}/Brewfile"
              - --cleanup
          register: brew_result
          changed_when: "'Installing' in brew_result.stdout or 'Upgrading' in brew_result.stdout or 'Uninstalling' in brew_result.stdout"

        - name: Show brew bundle output
          ansible.builtin.debug:
            msg: "{{ brew_result.stdout_lines + (brew_result.stderr_lines | default([])) }}"
          when: brew_result.stdout_lines is defined and (brew_result.stdout_lines | length > 0 or (brew_result.stderr_lines | default([])) | length > 0)

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"
        use: darwin
      when: ansible_facts['os_family'] == "Darwin" and hostname is defined
      become: true
      tags: ["sysconfig", "hostname"]

    - name: Apply macOS system defaults
      ansible.builtin.include_role:
        name: macos_defaults
      when: ansible_facts['os_family'] == "Darwin" and configure_macos_defaults | default(true)
      tags:
        [
          "sysconfig",
          "dock",
          "finder",
          "nsglobaldomain",
          "menubar",
          "desktop-services",
          "permissions",
        ]

    - name: MacOS configuration complete
      ansible.builtin.debug:
        msg: "macOS configuration applied successfully"
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Build uvc-util for camera control
      ansible.builtin.include_role:
        name: uvc_util
        apply:
          tags: ["uvc-util"]
      when: ansible_facts['os_family'] == "Darwin" and configure_uvc_util | default(true)
      tags: ["uvc-util"]

    - name: Apply chezmoi dotfiles
      ansible.builtin.include_role:
        name: chezmoi
        apply:
          tags: ["chezmoi", "dotfiles"]
      when: configure_chezmoi | default(true)
      tags: ["chezmoi", "dotfiles"]

    - name: Placeholder - Arch Linux tasks
      ansible.builtin.debug:
        msg: "Ready for Arch Linux configuration (pacman: {{ configure_pacman | default(false) }})"
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]
