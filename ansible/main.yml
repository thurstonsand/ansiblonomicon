---
# Main entry point for system configuration
# Run with: ansible-playbook main.yml

- name: Configure host
  hosts: all

  vars_files:
    - config.yml

  pre_tasks:
    - name: Load Darwin-specific config
      ansible.builtin.include_vars: darwin.config.yml
      when: ansible_facts['os_family'] == "Darwin"

    - name: Load Arch Linux-specific config
      ansible.builtin.include_vars: archlinux.config.yml
      when: ansible_facts['os_family'] == "Archlinux"

    - name: Display system info
      ansible.builtin.debug:
        msg: "Configuring {{ ansible_facts['os_family'] }} ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
      tags: ["always"]

  roles:
    []
    # Roles will be added here as we migrate:
    # - role: geerlingguy.mac.homebrew
    #   when: ansible_facts['os_family'] == "Darwin"
    #   tags: ['homebrew']

  tasks:
    - name: Placeholder - macOS tasks
      ansible.builtin.debug:
        msg: "Ready for macOS configuration (homebrew: {{ configure_homebrew }})"
      when: ansible_facts['os_family'] == "Darwin"
      tags: ["always"]

    - name: Placeholder - Arch Linux tasks
      ansible.builtin.debug:
        msg: "Ready for Arch Linux configuration (pacman: {{ configure_pacman }})"
      when: ansible_facts['os_family'] == "Archlinux"
      tags: ["always"]
