---
hostname: pod042

configure_chezmoi: true
configure_agent_harness: true
configure_terminal_theme: true
terminal_theme_profile: mirror

apt_packages:
  - btop
  - build-essential
  - ca-certificates
  - curl
  - direnv
  - eza
  - fd-find
  - fzf
  - git
  - git-delta
  - gh
  - gpg
  - jq
  - lazygit
  - nfs-common
  - openssh-client
  - openssh-server
  - python3-venv
  - ripgrep
  - rsync
  - rustup
  - sqlite3
  - starship
  - strace
  - sudo
  - tmux
  - tree
  - unzip
  - vim
  - zoxide
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting

# mise comes from the official installer via the mise role now, the same way it
# does on the laptops, so it is no longer declared as an apt repo below. Whatever
# a previous converge already installed stays on disk untouched; ~/.local/bin
# precedes /usr/bin, so the standalone build wins anyway. Retiring the leftovers
# waits on the general apt-removal mechanism.
apt_retired_repos:
  - >-
    deb [arch=amd64 signed-by=/usr/share/keyrings/nodesource.asc]
    https://deb.nodesource.com/node_22.x nodistro main

apt_external_repos:
  - name: 1password
    url: https://downloads.1password.com/linux/debian/amd64
    suites: stable
    components: main
    key_url: https://downloads.1password.com/linux/keys/1password.asc
    key_path: /usr/share/keyrings/1password-archive-keyring.asc
    packages:
      - 1password-cli

  - name: docker
    url: https://download.docker.com/linux/debian
    suites: trixie
    components: stable
    key_url: https://download.docker.com/linux/debian/gpg
    key_path: /etc/apt/keyrings/docker.asc
    packages:
      - docker-buildx-plugin
      - docker-ce-cli
      - docker-compose-plugin

  - name: nodesource
    url: https://deb.nodesource.com/node_24.x
    suites: nodistro
    components: main
    key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    key_path: /usr/share/keyrings/nodesource.asc
    packages:
      - nodejs

mise_global_tools_base:
  - node@lts
  - npm@latest
  - go@latest
  - golangci-lint@latest
  - zig@0.15.2
  - chezmoi@latest
npm_global_packages_base:
  - "@earendil-works/pi-coding-agent"
  - agent-browser
  - hunkdiff
  - sideshow
uv_global_tools_base:
  - claude-code-tools
bun_global_packages_base: []
cargo_packages_base:
  - bob-nvim
  - shpool
go_tools_base:
  - mvdan.cc/gofumpt@latest
gem_packages_base: []

agent_harness_profile: pod042
