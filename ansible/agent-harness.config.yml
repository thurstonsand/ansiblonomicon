---
# Agent skill/plugin sources and host capability profiles.
agent_harness_profile: personal
agent_harness_profiles:
  personal:
    target_agents: [claude, amp, codex, opencode, pi]
    # Amp's catalogue is hosted (rendered by amp_publish); locally it receives
    # only plugins that name it, so machine-bound skills can still deploy.
    explicit_only: [amp]
  work:
    target_agents: [claude, pi]
  pod042:
    target_agents: [pi]
  # CI rendering of Amp user skills for orbs, not a host.
  amp_publish:
    target_agents: [amp]

agent_harness_sources:
  # Manifest-resolved: plugin.json lists 25 skills; we admit 5.
  - repo: mattpocock/skills
    plugins:
      - name: mattpocock-skills
        include_skills:
          - resolving-merge-conflicts
          - teach
          - to-questionnaire
          - wizard
          - writing-for-agents

  # Manifest-resolved: their marketplace already curates to one skill.
  - repo: vercel-labs/agent-browser
    excluded_on: [work]
    plugins:
      - name: agent-browser
        target_agents:
          amp_publish: [amp]
          "*": [claude, opencode, pi]

  - repo: modem-dev/hunk
    excluded_on: [work]
    plugins:
      - name: hunk
        skills:
          hunk-review: skills/hunk-review
          hunk-extensions: skills/hunk-extensions

  # No manifest upstream: explicit map.
  - repo: remorses/tuistory
    excluded_on: [work]
    plugins:
      - name: tuistory
        skills:
          tuistory: skills/tuistory

  # Pairs with the nurb uv tool, which is installed on the laptop only.
  - repo: Shpigford/nurb
    excluded_on: [work, pod042]
    plugins:
      - name: nurb
        skills:
          nurb: skills/nurb

  # Local plugins: all manifest-resolved via their plugin.json.
  - local: "{{ playbook_dir }}/../../agents"
    plugins:
      - name: pi
        target_agents: [pi]
      - name: project-management
        target_agents: [pi]
        exclude_skills:
          work: [grill-me, tui-screenshot] # tui-screenshot drives tuistory, which the work mirror cannot install
          "*": [grill-me] # the pi plugin ships its own grill-me
      - name: project-management
        target_agents:
          amp_publish: [amp]
          "*": [claude, codex, opencode]
        exclude_skills:
          work: [tui-screenshot]
      - name: claude
        target_agents: [claude]
        exclude_skills:
          work: [retitle]
      - name: codex
        target_agents: [codex]
      - name: work
        included_on: [work]
      - name: homelab
        excluded_on: [work] # no NAS reachable from the work machine
        # amp is named so truenas-docker-ops stays a machine-local Amp skill
        # despite amp being explicit-only; in an orb it makes no sense, hence
        # the amp_publish exclusion.
        target_agents: [claude, amp, codex, opencode, pi]
        exclude_skills:
          amp_publish: [truenas-docker-ops]
