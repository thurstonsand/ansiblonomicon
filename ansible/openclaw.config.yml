---
# OpenClaw VM configuration.
# Clawdbot remains legacy reference material; do not copy its runtime state here.

hostname: openclaw

configure_chezmoi: true
configure_apt: true
configure_agent_harness: true
configure_terminal_theme: true
terminal_theme_profile: mirror
chezmoi_op_service_account_token_path: "{{ ansible_facts.env.HOME }}/.config/openclaw/secrets/op-service-account-token"

# Start small. Add runtime tools when the new OpenClaw actually needs them.
apt_packages:
  - ansible
  - btop
  - ca-certificates
  - curl
  - direnv
  - eza
  - fd-find
  - fzf
  - ffmpeg
  - gifsicle
  - git
  - git-delta
  - gh
  - golang-go
  - jq
  - just
  - lazygit
  - libasound2-dev
  - openssh-client
  - openssh-server
  - rustup
  - python3-venv
  - ripgrep
  - rsync
  - sqlite3
  - sudo
  - tmux
  - tree
  - unzip
  - starship
  - vim
  - zoxide
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting

apt_external_repos:
  - name: 1password
    url: https://downloads.1password.com/linux/debian/amd64
    suites: stable
    components: main
    key_url: https://downloads.1password.com/linux/keys/1password.asc
    key_path: /usr/share/keyrings/1password-archive-keyring.gpg
    packages:
      - 1password-cli

  - name: nodesource
    url: https://deb.nodesource.com/node_22.x
    suites: nodistro
    components: main
    key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    key_path: /usr/share/keyrings/nodesource.gpg
    packages:
      - nodejs

  - name: mise
    url: https://mise.jdx.dev/deb
    suites: stable
    components: main
    key_url: https://mise.jdx.dev/gpg-key.pub
    key_path: /etc/apt/keyrings/mise-archive-keyring.pub
    packages:
      - mise

npm_global_packages_extra:
  - mcporter
  - pdfjs-dist
  - "@steipete/summarize"
  - "@xdevplatform/xurl"
  - nostr-tools

bun_global_packages_extra: []
cargo_packages_extra:
  - bob-nvim
  - shpool
go_tools_extra:
  - github.com/steipete/gifgrep/cmd/gifgrep
  - github.com/steipete/gogcli/cmd/gog
  - github.com/steipete/sag/cmd/sag
uv_global_tools_extra: []
mise_global_tools_extra:
  - chezmoi@latest
  - zig@0.15.2
gem_packages_extra: []
agent_harness_target_agents_extra: []
#   TODO: we need to reconfigure where this gets installed first
#   - openclaw
