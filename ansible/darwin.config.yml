---
# macOS-specific configuration

# 1Password item for become password
onepassword_become_item: "Apple Macbook Login"

# Feature flags
configure_homebrew: true
configure_mas: true
configure_macos_defaults: true

# Homebrew configuration
# Match nix-darwin behavior: upgrade packages, don't auto-update
homebrew_upgrade_all_packages: true
homebrew_cask_accept_external_apps: true

# Explicitly uninstall these (record of tried-and-removed apps)
homebrew_uninstalled_packages: []
homebrew_cask_uninstalled_apps:
  - aerospace
  - choosy
  - google-drive
  - macwhisper
  - mqtt-explorer
  - reflect
  - tabtab

# Homebrew taps
homebrew_taps:
  - cirruslabs/cli
  - domt4/autoupdate
  - nikitabobko/tap
  - rfidresearchgroup/proxmark3
  - sst/tap
  - steipete/tap

# Homebrew packages (brews)
homebrew_installed_packages:
  - ansible
  - ansible-lint
  - pre-commit
  - cliproxyapi
  - gemini-cli
  - llm
  - ffmpeg
  - python
  - name: proxmark3
    install_options: with-generic,HEAD
  - rustup-init
  - softnet
  - tart

# Homebrew cask apps
homebrew_cask_apps:
  - 1password
  - 1password-cli
  - aqua-voice
  - bazecor
  - beeper
  - bloom
  - chatgpt
  - claude
  - clay
  - cloudflare-warp
