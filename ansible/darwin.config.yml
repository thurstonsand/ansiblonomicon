  - elgato-camera-hub
  - elgato-control-center
  - fantastical
  - ghostty
  - google-chrome
  - gcloud-cli
  - iina
  - legcord
  - localsend
  - mac-mouse-fix
  - mimestream
  - monodraw
  - moonlight
  - obsidian
  - orbstack
  - orion
  - prusaslicer
  - qlmarkdown
  - raycast
  - rectangle-pro
  - setapp
  - slack
  - steam
  - visual-studio-code
  - visual-studio-code@insiders
  - warp
  - wifiman
  - windsurf
  - zed
  - zoom

