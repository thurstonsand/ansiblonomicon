---
# macOS-specific configuration

# System settings
hostname: "Thurstons-MacBook-Pro"

# 1Password configuration
onepassword_vault: "Private"
onepassword_become_item: "Apple Macbook Login"

# Feature flags
configure_homebrew: true
configure_mas: true
configure_macos_defaults: true
configure_terminal_theme: true
terminal_theme_profile: detector
terminal_theme_mirrors:
  - pod042

# Additional npm packages for macOS (extends npm_global_packages_base)
npm_global_packages_extra:
  - openclaw
  - glimpseui

# glimpseui compiles a Swift helper in its postinstall
npm_allow_scripts_extra:
  - glimpseui

# Additional Ruby gems for macOS (extends gem_packages_base)
gem_packages_extra: []

# `pn` is a redundant pnpm alias we never use and conflicts with existing bin
mise_tool_config:
  tools.pnpm.version: latest
  tools.pnpm.postinstall: rm -f "$MISE_TOOL_INSTALL_PATH/pn"
