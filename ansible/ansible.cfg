[defaults]
# Inventory file location
inventory = inventory

# Custom callback plugins
callback_plugins = ./callback_plugins

# Roles search path
roles_path = ./roles

# Collections path (installed first, local dev overrides last)
collections_path = ~/.ansible/collections:/usr/share/ansible/collections:./collections

# Use YAML output format (easier to read)
callback_result_format = yaml

# Disable cowsay (if installed)
nocows = true
deprecation_warnings = false

# Performance profiling - shows time per task/role (disabled for cleaner output)
# callbacks_enabled = timer, profile_tasks, profile_roles

# Fact caching - avoid re-gathering on repeated runs
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/fact_cache
fact_caching_timeout = 86400

stdout_callback = changes_only
display_ok_hosts = false
display_skipped_hosts = false

[ssh_connection]
# Speeds up execution by reusing SSH connections
pipelining = true
