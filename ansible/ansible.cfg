[defaults]
# Inventory file location
inventory = inventory

# Get become password from 1Password via executable script
become_password_file = ./sudo-askpass.sh

# Roles search path
roles_path = ./roles

# Use YAML output format (easier to read)
callback_result_format = yaml

# Disable cowsay (if installed)
nocows = true

# Performance profiling - shows time per task/role
callbacks_enabled = timer, profile_tasks, profile_roles

# Fact caching - avoid re-gathering on repeated runs
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/fact_cache
fact_caching_timeout = 86400

[ssh_connection]
# Speeds up execution by reusing SSH connections
pipelining = true
