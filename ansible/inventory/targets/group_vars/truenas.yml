# TrueNAS app definitions. Manage durable app config only; Docker containers are rendered by TrueNAS.
truenas_apps:
  plex:
    name: plex
    catalog_app: plex
    train: stable
    version: latest
    values:
      TZ: America/New_York
      labels:
        - key: com.centurylinklabs.watchtower.enable
          value: "false"
          containers: [plex]
      network:
        dns_opts: []
        host_network: true
      plex:
        additional_envs: []
        allowed_networks: []
        claim_token: "{{ lookup('env', 'PLEX_CLAIM_TOKEN') }}"
        devices: []
        image_selector: plex_pass_image
      resources:
        gpus:
          nvidia_gpu_selection: {}
          use_all_gpus: true
        limits:
          cpus: 4
          memory: 4096
      run_as:
        group: 3001
        user: 3001
      storage:
        additional_storage: []
        config:
          type: host_path
          host_path_config:
            acl_enable: false
            path: /mnt/performance/apps/plex/config
        data:
          type: host_path
          host_path_config:
            acl_enable: false
            path: /mnt/capacity/watch/media
        logs:
          type: host_path
          host_path_config:
            acl_enable: false
            path: /mnt/performance/apps/plex/logs
        transcode:
          type: host_path
          host_path_config:
            acl_enable: false
            path: /mnt/capacity/watch/transcode

  storj_node:
    name: storj-node
    catalog_app: storj
    train: stable
    version: latest
    values:
      labels:
        - key: com.centurylinklabs.watchtower.enable
          value: "false"
          containers: [storj]
      network:
        dns_opts: []
        host_network: false
        p2p_port:
          bind_mode: published
          host_ips: []
          port_number: 28967
        web_port:
          bind_mode: published
          host_ips: []
          port_number: 20909
      resources:
        limits:
          cpus: 4
          memory: 8192
      run_as:
        group: 568
        user: 568
      storage:
        additional_storage: []
        data:
          type: host_path
          host_path_config:
            acl_enable: false
            path: /mnt/capacity/storj-node/config
        identity:
          type: host_path
          host_path_config:
            acl_enable: false
            path: /mnt/capacity/storj-node/identity
      storj:
        additional_envs: []
        domain_address: storj.thurstons.house:28967
        email: thurstonsand@hey.com
        stop_grace_period: 30
        storage_size_gb: 5120
        wallet_address: "{{ lookup('env', 'STORJ_WALLET_ADDRESS') }}"
        wallets:
          - zksync-era

# TrueNAS VM definitions. Opinionated: model stable core fields and selected devices only.
truenas_vms:
  pod042:
    name: pod042
    description: Debian 13 development VM
    autostart: true
    memory: 16384
    min_memory: 8192
    vcpus: 1
    cores: 4
    threads: 1
    cpu_mode: HOST-PASSTHROUGH
    cpuset: ""
    nodeset: ""
    bootloader: UEFI
    ensure_display_device: false
    time: UTC
    zvols:
      - name: performance/pod042-boot
        volsize: 85899345920
        volblocksize: 16K
        comments: pod042 VM boot disk
    devices:
      - dtype: DISK
        order: 1001
        attributes:
          path: /dev/zvol/performance/pod042-boot
          type: VIRTIO
          iotype: THREADS
      - dtype: NIC
        order: 1002
        attributes:
          type: VIRTIO
          mac: 02:d3:b5:97:4f:0f
          nic_attach: br0
          trust_guest_rx_filters: false

  openclaw:
    name: OpenClaw
    description: Fresh OpenClaw Debian VM
    autostart: false
    memory: 12288
    min_memory: 12288
    vcpus: 1
    cores: 2
    threads: 1
    cpu_mode: HOST-PASSTHROUGH
    cpuset: ""
    nodeset: ""
    bootloader: UEFI
    ensure_display_device: true
    zvols:
      - name: capacity/openclaw
        volsize: 107374182400
        volblocksize: 16K
        comments: OpenClaw VM boot disk
    devices:
      - dtype: DISK
        order: 1001
        attributes:
          path: /dev/zvol/capacity/openclaw
          type: VIRTIO
          iotype: THREADS
      - dtype: NIC
        order: 1002
        attributes:
          type: VIRTIO
          mac: 00:a0:98:26:3f:c2
          nic_attach: br0
          trust_guest_rx_filters: false
      - dtype: DISPLAY
        order: 1004
        attributes:
          type: SPICE
          port: 5906
          web_port: 5907
          bind: 0.0.0.0
          web: true
          resolution: 1024x768
          wait: false

  homeassistant:
    name: HAOS
    description: HomeAssistant OS
    autostart: true
    memory: 8192
    min_memory: 4096
    vcpus: 1
    cores: 4
    threads: 1
    cpu_mode: HOST-PASSTHROUGH
    cpuset: ""
    nodeset: ""
    bootloader: UEFI
    ensure_display_device: true
    devices:
      - dtype: DISK
        order: 1001
        attributes:
          path: /dev/zvol/performance/homeassistant
          type: VIRTIO
          iotype: THREADS
      - dtype: DISK
        identity: /dev/zvol/performance/haos-config
        order: 1001
        attributes:
          path: /dev/zvol/performance/haos-config
          type: VIRTIO
          iotype: THREADS
      - dtype: NIC
        order: 1002
        attributes:
          type: VIRTIO
          mac: 00:a0:98:70:3e:8b
          nic_attach: br0
          trust_guest_rx_filters: false
      - dtype: DISPLAY
        order: 1003
        attributes:
          type: SPICE
          port: 5900
          web_port: 5904
          bind: 0.0.0.0
          web: true
          resolution: 1024x768
          wait: false
