# Docker engine. The apt repo itself is declared in pod042.config.yml
# (apt_external_repos.docker); the daemon packages are host facts.
docker_engine_packages:
  - docker-ce
  - containerd.io

# Plex hands /dev/dri to the container for QuickSync. Real hardware has it and
# should fail loudly if it ever stops appearing; rigs without an iGPU turn it off.
plex_hw_transcode: true

# Pools, as renamed at import (ticket 10): capacity -> ark, performance -> black-box.
pod042_pools:
  - ark
  - black-box

# Move-day scaffold. The stack templates still name the TrueNAS-era pool
# mountpoints; these symlinks let them resolve unchanged until the templates are
# repathed post-move. Retire both with that repath.
pod042_legacy_pool_links:
  - src: /mnt/ark
    path: /mnt/capacity
  - src: /mnt/black-box
    path: /mnt/performance

# ZFS maintenance
zfs_maintenance_scrubs:
  - pool: ark
    calendar: "*-*-01 04:00:00"
    healthchecks_schedule: "0 4 1 * *"
    healthchecks_grace: 86400
  - pool: black-box
    calendar: "*-*-05 04:00:00"
    healthchecks_schedule: "0 4 5 * *"
    healthchecks_grace: 7200

# Only ark carries the hot spare, but autoreplace is right on both.
zfs_maintenance_pools_autoreplace:
  - ark

# black-box only: ark is deliberately snapshot-free (ticket 08).
zfs_maintenance_sanoid_datasets:
  - dataset: black-box
    template: production
    recursive: true

# Samba: one share (ticket 08); password from the SAMBA_MEDIA_PASSWORD
# SecretRef (op item "Samba media (pod042)").
samba_shares:
  - name: media
    path: /mnt/ark/media
    comment: Media library
samba_users:
  - name: thurston
    password_env: SAMBA_MEDIA_PASSWORD
