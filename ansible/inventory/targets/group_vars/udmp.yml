---
# Multicast querier configuration
# Bridges to enable multicast querier on (survives firmware updates via systemd + /data/)
multicast_querier_bridges:
  - br0
  - br2
  - br3
  - br4

# NextDNS configuration
# key-value pairs rendered to /data/nextdns.conf
nextdns_config:
  max-ttl: "5s"
  report-client-info: "true"
  detect-captive-portals: "false"
  hardened-privacy: "false"
  use-hosts: "true"
  timeout: "5s"
  setup-router: "true"
  log-queries: "false"
  cache-size: "10MB"
  bogus-priv: "true"
  listen: "localhost:53"
  profile: "e13115"
  cache-max-age: "0s"
  max-inflight-requests: "256"
  debug: "false"
  control: "/var/run/nextdns.sock"
  discovery-dns: ~
  mdns: "all"
  auto-activate: "true"
