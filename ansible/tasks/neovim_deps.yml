---
- name: Sync Lazy.nvim plugins
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - "+Lazy! sync"
      - +qa
  changed_when: true
  async: 600
  poll: 5

- name: Capture Lazy.nvim lockfile in chezmoi source
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - chezmoi
      - re-add
      - "{{ ansible_user_dir }}/.config/nvim/lazy-lock.json"
  changed_when: true

- name: Remove Mason packages with broken Python virtualenvs
  when: not ansible_check_mode
  ansible.builtin.shell: |
    set -euo pipefail
    mason_dir="{{ ansible_user_dir }}/.local/share/nvim/mason"
    packages_dir="${mason_dir}/packages"
    bin_dir="${mason_dir}/bin"
    [[ -d "${packages_dir}" ]] || exit 0

    find "${mason_dir}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true

    shopt -s nullglob
    for python in "${packages_dir}"/*/venv/bin/python; do
      [[ -e "${python}" && -x "${python}" ]] && continue
      package_dir="$(dirname "$(dirname "$(dirname "${python}")")")"
      package_name="$(basename "${package_dir}")"
      find "${mason_dir}" -type l -lname "*/packages/${package_name}/*" -delete 2>/dev/null || true
      rm -rf "${package_dir}"
      printf '%s\n' "${package_name}"
    done
  args:
    executable: /bin/bash
  register: mason_repaired_packages
  changed_when: mason_repaired_packages.stdout != ""

- name: Update declared Mason tools
  when:
    - not ansible_check_mode
    - ansible_facts['hostname'] != "ML-DFC6YK6VJQ"
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - "+MasonToolsUpdateSync"
      - +qa
  changed_when: true
  async: 600
  poll: 5

- name: Update Treesitter parsers
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - "+TSUpdateSync"
      - +qa
  changed_when: true
  async: 600
  poll: 5

- name: Report skipped Neovim dependency update in check mode
  when: ansible_check_mode
  ansible.builtin.debug:
    msg: "Skipped Neovim dependency updates in check mode"
