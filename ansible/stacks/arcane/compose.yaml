services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    networks:
      personal:
        ipv4_address: 192.168.6.236
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/performance/docker/arcane/data:/app/data
      - /mnt/performance/docker/stacks:/mnt/performance/docker/stacks
    environment:
      APP_URL: https://arcane.thurstons.house
      PUID: 950
      PGID: 544
      ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY}
      JWT_SECRET: ${ARCANE_JWT_SECRET}
    restart: unless-stopped

networks:
  personal:
    external: true
