[bootstrap.files."/etc/netdata/netdata.conf"]
source = "containers/config/netdata.conf"
owner = "root"
group = "netdata"
mode = "0640"
notify = ["netdata"]

[bootstrap.files."/etc/netdata/.opt-out-from-anonymous-statistics"]
content = ""
owner = "root"
group = "netdata"
mode = "0640"

[bootstrap.files."/etc/netdata/go.d/docker.conf"]
source = "containers/config/docker.conf"
owner = "root"
group = "netdata"
mode = "0640"
