[bootstrap.services.containerd]
enabled = true

[bootstrap.services.docker]
enabled = true
on_change = "restart"

[bootstrap.services.netdata]
enabled = true
on_change = "restart"

[bootstrap.compose.platform]
project_dir = "/etc/ansiblonomicon/containers/platform"
files = ["compose.yaml"]
env_files = [".env"]
project_name = "platform"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 120
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.ingress]
project_dir = "/etc/ansiblonomicon/containers/ingress"
files = ["compose.yaml"]
env_files = [".env"]
project_name = "ingress"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 180
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.anypod]
project_dir = "/etc/ansiblonomicon/containers/anypod"
files = ["compose.yaml"]
project_name = "anypod"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 180
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.cli-proxy-api]
project_dir = "/etc/ansiblonomicon/containers/cli-proxy-api"
files = ["compose.yaml"]
project_name = "cli-proxy-api"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 180
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.ghost]
project_dir = "/etc/ansiblonomicon/containers/ghost"
files = ["compose.yaml"]
env_files = [".env"]
project_name = "ghost"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 180
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.isponsorblocktv]
project_dir = "/etc/ansiblonomicon/containers/isponsorblocktv"
files = ["compose.yaml"]
project_name = "isponsorblocktv"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 180
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.plex]
project_dir = "/etc/ansiblonomicon/containers/plex"
files = ["compose.yaml"]
project_name = "plex"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 300
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.pon-monitor]
project_dir = "/etc/ansiblonomicon/containers/pon-monitor"
files = ["compose.yaml"]
env_files = [".env"]
project_name = "pon-monitor"
state = "running"
sudo = true
pull = "missing"
build = "always"
wait = true
wait_timeout = 180
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.scrypted]
project_dir = "/etc/ansiblonomicon/containers/scrypted"
files = ["compose.yaml"]
project_name = "scrypted"
state = "running"
sudo = true
pull = "always"
wait = true
wait_timeout = 300
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.torrent]
project_dir = "/etc/ansiblonomicon/containers/torrent"
files = ["compose.yaml"]
env_files = [".env"]
project_name = "torrent"
state = "running"
sudo = true
pull = "always"
build = "auto"
wait = true
wait_timeout = 300
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.compose.arr-apps]
project_dir = "/etc/ansiblonomicon/containers/arr-apps"
files = ["compose.yaml"]
env_files = [".env"]
