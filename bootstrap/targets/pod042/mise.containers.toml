HOMEPAGE_OVERSEERR_API_KEY="{{ secret(name="homepage_overseerr_api_key") }}"
HOMEPAGE_PLEX_API_KEY="{{ secret(name="homepage_plex_api_key") }}"
HOMEPAGE_UNIFI_PASSWORD="{{ secret(name="homepage_unifi_password") }}"
HOMEPAGE_UNIFI_USERNAME="{{ secret(name="homepage_unifi_username") }}"
NEXTDNS_API_KEY="{{ secret(name="nextdns_api_key") }}"
NEXTDNS_PROFILE_ID="{{ secret(name="nextdns_profile_id") }}"
PROWLARR_API_KEY="{{ secret(name="prowlarr_api_key") }}"
QBITTORRENT_PASSWORD="{{ secret(name="qbittorrent_password") }}"
QBITTORRENT_USERNAME="{{ secret(name="qbittorrent_username") }}"
RADARR_API_KEY="{{ secret(name="radarr_api_key") }}"
