[bootstrap.hooks.pre-packages]
run = [
  "env MISE_ENV=repositories mise bootstrap files apply --yes",
  "mise bootstrap packages apply --update --yes",
]

[bootstrap.packages]
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"
"apt:netdata" = "latest"
"apt:netdata-plugin-systemd-units" = "latest"
"apt:netdata-plugin-systemd-journal" = "latest"

[bootstrap.secrets]
hark_webhook_url = "HARK_WEBHOOK_URL_POD042"
cloudflare_api_token = "CLOUDFLARE_API_TOKEN"
cloudflare_tunnel_token = "CLOUDFLARE_TOKEN"
ddclient_github_pat = "DDCLIENT_GITHUB_PAT"
ghost_db_password = "GHOST_DB_PASSWORD"
ghost_mail_auth_pass = "GHOST_MAIL_AUTH_PASS"
ghost_mysql_root_password = "GHOST_MYSQL_ROOT_PASSWORD"
homepage_homeassistant_api_key = "HOMEPAGE_HOMEASSISTANT_API_KEY"
homepage_overseerr_api_key = "HOMEPAGE_OVERSEERR_API_KEY"
homepage_plex_api_key = "HOMEPAGE_PLEX_API_KEY"
homepage_unifi_password = "UNIFI_PASSWORD"
homepage_unifi_username = "UNIFI_USERNAME"
nextdns_api_key = "NEXTDNS_API_KEY"
nextdns_profile_id = "NEXTDNS_PROFILE_ID"
pon_monitor_ping_url = "POD042_PON_MONITOR_PING_URL"
prowlarr_api_key = "PROWLARR_API_KEY"
qbittorrent_password = "QBITTORRENT_PASSWORD"
qbittorrent_username = "QBITTORRENT_USERNAME"
radarr_api_key = "RADARR_API_KEY"
sonarr_api_key = "SONARR_API_KEY"
torrent_mam_ping_url = "POD042_MAM_UPDATE_PING_URL"
torrent_wireguard_address = "TORRENT_WIREGUARD_ADDRESS"
torrent_wireguard_private_key = "TORRENT_WIREGUARD_PRIVATE_KEY"
xgs_pon_password = "XGS_PON_PASSWORD"

[bootstrap.groups.docker]

[bootstrap.groups.netdata]

[bootstrap.directories."/etc/docker"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/etc/systemd/system/docker.service.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/etc/netdata"]
owner = "root"
group = "netdata"
mode = "0750"

[bootstrap.directories."/etc/netdata/go.d"]
owner = "root"
group = "netdata"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/platform"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/anypod"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/arr-apps"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/cli-proxy-api"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/ghost"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/homepage"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/homepage/config"]
owner = "thurstonsand"
group = "media"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/ingress"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/ingress/caddy"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/mnt/black-box/docker/ddclient/ddclient/config"]
owner = "thurstonsand"
group = "media"
mode = "0700"

[bootstrap.directories."/etc/ansiblonomicon/containers/isponsorblocktv"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/plex"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/pon-monitor"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/scrypted"]
owner = "root"
group = "docker"
mode = "0750"

[bootstrap.directories."/etc/ansiblonomicon/containers/torrent"]
owner = "root"
group = "docker"
