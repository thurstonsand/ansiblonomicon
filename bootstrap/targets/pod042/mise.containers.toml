owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/etc/ansiblonomicon/containers/ghost/.env"]
content = '''
GHOST_DB_PASSWORD="{{ secret(name="ghost_db_password") }}"
GHOST_MAIL_AUTH_PASS="{{ secret(name="ghost_mail_auth_pass") }}"
GHOST_MYSQL_ROOT_PASSWORD="{{ secret(name="ghost_mysql_root_password") }}"
'''
