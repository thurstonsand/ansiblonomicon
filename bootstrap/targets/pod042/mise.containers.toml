[bootstrap.files."/etc/docker/daemon.json"]
source = "containers/config/daemon.json"
owner = "root"
group = "root"
mode = "0644"
notify = ["docker"]

[bootstrap.files."/etc/systemd/system/docker.service.d/mounts.conf"]
