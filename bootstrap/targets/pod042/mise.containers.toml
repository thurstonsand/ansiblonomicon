owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/etc/ansiblonomicon/containers/ingress/caddy/Caddyfile"]
source = "containers/stacks/ingress/Caddyfile"
owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/etc/ansiblonomicon/containers/ingress/Caddyfile"]
state = "absent"

[bootstrap.files."/etc/ansiblonomicon/containers/ingress/ddclient.conf"]
state = "absent"

[bootstrap.files."/etc/ansiblonomicon/containers/ingress/trigger-tofu-apply.sh"]
source = "containers/stacks/ingress/trigger-tofu-apply.sh"
owner = "thurstonsand"
group = "media"
mode = "0750"

[bootstrap.files."/mnt/black-box/docker/ddclient/ddclient/config/trigger-tofu-apply.sh"]
state = "absent"

[bootstrap.files."/mnt/black-box/docker/ddclient/ddclient/config/ddclient.conf"]
content = '''
daemon=300
syslog=yes
pid=/var/run/ddclient.pid
ssl=yes
use=web
web='https://cloudflare.com/cdn-cgi/trace'
web-skip='ip='
postscript=/usr/local/bin/trigger-tofu-apply

protocol=cloudflare, \
zone=thurstons.house, \
login=token, \
password={{ secret(name="cloudflare_api_token") }} \
storj.thurstons.house
'''
template = true
owner = "thurstonsand"
group = "media"
mode = "0600"

[bootstrap.files."/etc/ansiblonomicon/containers/ingress/.env"]
content = '''
CLOUDFLARE_API_TOKEN="{{ secret(name="cloudflare_api_token") }}"
CLOUDFLARE_TOKEN="{{ secret(name="cloudflare_tunnel_token") }}"
DDCLIENT_GITHUB_PAT="{{ secret(name="ddclient_github_pat") }}"
'''
template = true
owner = "root"
group = "root"
mode = "0600"

