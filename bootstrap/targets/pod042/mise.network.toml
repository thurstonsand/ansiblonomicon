[bootstrap.hooks.pre-packages]
run = [
  "env MISE_ENV=repositories mise bootstrap files apply --yes",
  "mise bootstrap packages apply --update --yes",
]

[bootstrap.packages]
"apt:ethtool" = "latest"
"apt:ifupdown" = "latest"
"apt:iproute2" = "latest"
"apt:tailscale" = "latest"
# Diagnosis tools for the probe namespace. avahi-utils is deliberately absent: its
# browser needs a daemon and D-Bus that the namespace does not have.
"apt:arp-scan" = "latest"
"apt:nmap" = "latest"
"apt:tcpdump" = "latest"

[bootstrap.files."/etc/network/interfaces"]
content = '''
auto lo
iface lo inet loopback

# Docker needs DHCP before network-online.target is reached.
auto enp5s0
iface enp5s0 inet dhcp
    mtu 1500
    post-up /usr/sbin/ethtool -s enp5s0 wol g
    post-up /usr/sbin/ethtool -G enp5s0 rx 4096
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/sysctl.d/90-pod042-network.conf"]
content = '''
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 0
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/network/10-br0.netdev"]
state = "absent"

[bootstrap.files."/etc/systemd/network/10-br0.network"]
state = "absent"

[bootstrap.files."/etc/systemd/network/11-nic.network"]
state = "absent"

[bootstrap.files."/etc/systemd/network/21-br0.1.netdev"]
state = "absent"

[bootstrap.files."/etc/systemd/network/21-br0.1.network"]
state = "absent"

[bootstrap.files."/etc/systemd/network/22-br0.2.netdev"]
state = "absent"

[bootstrap.files."/etc/systemd/network/22-br0.2.network"]
state = "absent"

[bootstrap.files."/etc/systemd/network/23-br0.3.netdev"]
state = "absent"

[bootstrap.files."/etc/systemd/network/23-br0.3.network"]
state = "absent"

[bootstrap.files."/etc/systemd/network/24-br0.4.netdev"]
state = "absent"

[bootstrap.files."/etc/systemd/network/24-br0.4.network"]
state = "absent"

[bootstrap.directories."/etc/ansiblonomicon/network"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/ansiblonomicon/network/probe.py"]
source = "network/probe.py"
owner = "root"
group = "root"
mode = "0755"
notify = ["probe"]

[bootstrap.files."/etc/ansiblonomicon/network/resolver-online.py"]
source = "network/resolver-online.py"
owner = "root"
group = "root"
mode = "0755"
notify = ["resolver-online"]

[bootstrap.files."/etc/systemd/system/probe.service"]
source = "network/probe.service"
owner = "root"
group = "root"
mode = "0644"
notify = ["probe"]

[bootstrap.files."/etc/systemd/system/resolver-online.service"]
source = "network/resolver-online.service"
owner = "root"
group = "root"
mode = "0644"
notify = ["resolver-online"]

[bootstrap.files."/usr/local/bin/net-probe"]
source = "network/net-probe"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/system/forward-policy.service"]
source = "network/forward-policy.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services.forward-policy]
state = "running"
enabled = true

[bootstrap.services.probe]
state = "running"
enabled = true
on_change = "restart"

[bootstrap.services.resolver-online]
state = "running"
enabled = true
on_change = "restart"

[bootstrap.services.tailscaled]
state = "running"
enabled = true

[bootstrap.hooks.final]
run = [
  "sudo -n /usr/sbin/sysctl --system >/dev/null",
  '''
if [ "$(sudo -n /usr/bin/tailscale status --json | python3 -c 'import json, sys; print(json.load(sys.stdin)["BackendState"])')" = "Running" ]; then
  sudo -n /usr/bin/tailscale up --reset --hostname=pod042 --accept-dns=false --accept-routes=false --advertise-tags=tag:pod042 --advertise-routes= --advertise-exit-node=false --exit-node= --exit-node-allow-lan-access=false --report-posture=false --ssh=true
  sudo -n /usr/bin/tailscale wait --timeout=15s
fi
''',
  "sudo -n /usr/bin/python3 network/check.py",
]

[tasks."network:check"]
run = "sudo -n /usr/bin/python3 network/check.py"
