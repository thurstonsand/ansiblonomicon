[properties]
compression = "lz4"
checksum = "on"
sync = "standard"
dedup = "off"
recordsize = "128K"
acltype = "posix"
aclmode = "discard"
aclinherit = "discard"
xattr = "on"
atime = "off"
readonly = "off"
canmount = "on"
overlay = "off"

[creation]
casesensitivity = "sensitive"
normalization = "none"
encryption = "off"

[datasets."ark/media"]
mountpoint = "/mnt/ark/media"
shared = true

[datasets."black-box/docker"]
mountpoint = "/mnt/black-box/docker"
shared = false

[datasets."black-box/ghost-mysql"]
mountpoint = "/mnt/black-box/docker/ghost/ghost_mysql/var/lib/mysql"
shared = false

[datasets."black-box/ghost-mysql".creation]
casesensitivity = "insensitive"

[datasets."black-box/agents"]
mountpoint = "/mnt/black-box/agents"
shared = false
