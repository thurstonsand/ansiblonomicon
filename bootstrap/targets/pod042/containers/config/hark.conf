SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="hark"
custom_sender() {
    if /usr/local/bin/storage-alert \
        "Netdata $status: $alarm" \
        "$status_message
$info
host: $host
chart: $chart"; then
        sent=$((sent + 1))
    else
        echo "custom sender failed for alarm: $alarm" >&2
        return 1
    fi
}
