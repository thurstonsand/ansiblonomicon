services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    environment:
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ingress
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./caddy:/etc/caddy:ro
      - /mnt/black-box/docker/caddy/caddy/data:/data
      - /mnt/black-box/docker/caddy/caddy/config:/config
      - /mnt/black-box/docker/caddy/srv:/srv:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TOKEN:?required}"
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ingress

  ddclient:
    image: lscr.io/linuxserver/ddclient:latest
    environment:
      PUID: "1000"
      PGID: "3000"
      TZ: America/Los_Angeles
      DDCLIENT_GITHUB_PAT: "${DDCLIENT_GITHUB_PAT:?required}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[d]dclient' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - ingress
    volumes:
      - /mnt/black-box/docker/ddclient/ddclient/config:/config
      - ./trigger-tofu-apply.sh:/usr/local/bin/trigger-tofu-apply:ro
      - /etc/localtime:/etc/localtime:ro

networks:
  ingress:
    name: ingress
    external: true
