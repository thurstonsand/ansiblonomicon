services:
  ghost:
    image: ghost:6-alpine
    restart: unless-stopped
    depends_on:
      ghost-mysql:
        condition: service_healthy
    environment:
      url: "https://blog.thurstons.house"
      mail__transport: SMTP
      mail__options__host: smtp.mail.me.com
      mail__options__port: "587"
      mail__options__secureConnection: "false"
      mail__options__auth__user: "thurstonsand@icloud.com"
      mail__options__auth__pass: "${GHOST_MAIL_AUTH_PASS:?required}"
      mail__from: "notifications@thurstons.house"
      database__client: mysql
      database__connection__host: ghost-mysql
      database__connection__database: ghostdb
      database__connection__user: ghostuser
      database__connection__password: "${GHOST_DB_PASSWORD:?required}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:2368/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      default: {}
      ingress: {}
    volumes:
      - /mnt/black-box/docker/ghost/ghost/var/lib/ghost/content:/var/lib/ghost/content

  ghost-mysql:
    image: mysql:8
    command: ["--lower-case-table-names=2"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${GHOST_MYSQL_ROOT_PASSWORD:?required}"
      MYSQL_DATABASE: ghostdb
      MYSQL_USER: ghostuser
      MYSQL_PASSWORD: "${GHOST_DB_PASSWORD:?required}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - /mnt/black-box/docker/ghost/ghost_mysql/var/lib/mysql:/var/lib/mysql

networks:
  ingress:
    external: true
    name: ingress
