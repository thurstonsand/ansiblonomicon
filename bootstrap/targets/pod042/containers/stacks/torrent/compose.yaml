services:
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    environment:
      VPN_TYPE: wireguard
      VPN_SERVICE_PROVIDER: mullvad
      WIREGUARD_PRIVATE_KEY: "${TORRENT_WIREGUARD_PRIVATE_KEY:?required}"
      WIREGUARD_ADDRESSES: "${TORRENT_WIREGUARD_ADDRESS:?required}"
      SERVER_COUNTRIES: USA
      SERVER_CITIES: Atlanta GA
      # Work around gluetun's PMTUD minMTU/maxMTU panic. Retest after an update.
      WIREGUARD_MTU: "1320"
      FIREWALL_INPUT_PORTS: "80,8000"
      UPDATER_PERIOD: 24h
      PUID: "1000"
      PGID: "3000"
    volumes:
      - /mnt/black-box/docker/torrent/gluetun/gluetun:/gluetun
      - ./gluetun-auth.toml:/gluetun/auth/config.toml:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 https://am.i.mullvad.net/connected | grep -q 'You are connected'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      default: {}
      ingress:
        aliases:
          - qbittorrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    environment:
      WEBUI_PORT: "80"
      PUID: "1000"
      PGID: "3000"
    volumes:
      - /mnt/black-box/docker/torrent/qbittorrent/config:/config
      - /mnt/ark/media:/media
      - ./qbittorrent-healthcheck.py:/healthcheck.py:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python3", "/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  mam-updater:
    build:
      context: .
      dockerfile: Dockerfile.mam-updater
    pull_policy: build
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    user: "1000:3000"
    network_mode: service:gluetun
    environment:
      MAM_UPDATE_DIR: /data
      MAM_ID_FILE: /data/MAM.id
      HEALTHCHECK_PING_URL: "${TORRENT_MAM_PING_URL:?required}"
    volumes:
      - /mnt/black-box/docker/torrent/mam-updater/data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  netns-repair:
    image: docker:cli
    environment:
      COMPOSE_PROJECT_NAME: torrent
      DEPENDENTS: qbittorrent mam-updater
      GLUETUN_SERVICE: gluetun
      INTERVAL: "60"
      STACK_FILE: /etc/ansiblonomicon/containers/torrent/compose.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose sends bind paths to the host daemon, so preserve the host path here.
      - /etc/ansiblonomicon/containers/torrent:/etc/ansiblonomicon/containers/torrent:ro
    command: ["/bin/sh", "/etc/ansiblonomicon/containers/torrent/netns-repair.sh"]
    restart: unless-stopped

networks:
  ingress:
    external: true
    name: ingress
