source = "remote-development/desktop/extension-policy.json"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.directories."/etc/chromium/policies"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/etc/chromium/policies/managed"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/home/thurstonsand/.config/t3code"]
