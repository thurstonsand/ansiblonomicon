"/home/thurstonsand/.config/systemd/user/xdg-desktop-portal-gtk.service.d/runner-desktop.conf" = { source = "remote-development/xdg-desktop-portal-gtk-runner.conf", mode = "copy" }

[bootstrap.hooks.final]
run = '''
set -e
# Debian has no Ghostty package; Ghostty's docs send Debian to ghostty-ubuntu's release .debs.
release=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/mkasberg/ghostty-ubuntu/releases/latest)
tag=${release##*/}
if [ "$(dpkg-query -W -f '${Version}' ghostty 2>/dev/null || true)" != "${tag%-*}~${tag##*-}" ]; then
  deb=/tmp/ghostty_${tag%-*}.${tag##*-}_amd64_trixie.deb
  curl -fsSL -o "$deb" "https://github.com/mkasberg/ghostty-ubuntu/releases/download/$tag/${deb##*/}"
  chmod 0644 "$deb"
  sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes "$deb"
  rm "$deb"
fi
# 1Password's package installs and then owns its own apt repository, so only the first install comes from here.
if ! dpkg-query -W -f '${Status}' 1password 2>/dev/null | grep -q 'ok installed'; then
  curl -fsSL -o /tmp/1password-latest.deb https://downloads.1password.com/linux/debian/amd64/stable/1password-latest.deb
  chmod 0644 /tmp/1password-latest.deb
  sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes /tmp/1password-latest.deb
  rm /tmp/1password-latest.deb
fi
python3 remote-development/services.py apply
python3 ../../capabilities/software/berkeley_mono.py --service-account "op://agent/Berkeley Mono Font/nerd-font" /home/thurstonsand/.config/op-service-account/token
'''

[tasks."remote-development:reconcile"]
run = "python3 remote-development/services.py apply"

[tasks."remote-development:status"]
run = "python3 remote-development/services.py status"

[tasks."remote-development:plan"]
run = "python3 remote-development/services.py plan"
