"/home/thurstonsand/.config/chromium-desktop/NativeMessagingHosts/com.1password.1password.json" = { source = "remote-development/desktop/1password-native-messaging.json", mode = "symlink" }
"/home/thurstonsand/.local/bin/1password-window" = { source = "remote-development/desktop/1password-window", mode = "symlink" }
