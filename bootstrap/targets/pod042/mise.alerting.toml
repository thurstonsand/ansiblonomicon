[bootstrap.packages]
"apt:python3" = "latest"

[bootstrap.secrets]
hark_webhook_url = "HARK_WEBHOOK_URL_POD042"

[bootstrap.groups.alerting]

[bootstrap.directories."/etc/alerting"]
owner = "root"
group = "alerting"
mode = "0750"

[bootstrap.files."/etc/alerting/hark-webhook-url"]
content = '{{ secret(name="hark_webhook_url") }}'
template = true
owner = "root"
group = "alerting"
mode = "0640"

[bootstrap.directories."/usr/local/bin"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/usr/local/bin/storage-alert"]
source = "alerting/storage-alert.py"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/etc/systemd/system/apt-daily-upgrade.service.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/system/apt-daily-upgrade.service.d/alerting.conf"]
source = "alerting/apt-daily-upgrade-alerting.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/pod042-apt-upgrade-failure@.service"]
source = "alerting/pod042-apt-upgrade-failure@.service"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/local/bin/pod042-apt-alert"]
source = "alerting/apt-alert.py"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.hooks.final]
run = "sudo -n systemctl daemon-reload"
