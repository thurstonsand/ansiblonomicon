[bootstrap.hooks.pre-packages]
run = [
  "env MISE_ENV=repositories mise bootstrap files apply --yes",
  "mise bootstrap packages apply --update --yes",
  "mise bootstrap packages upgrade apt:smartmontools --yes",
]

[bootstrap.packages]
"apt:smartmontools" = "latest"
"apt:linux-headers-amd64" = "latest"
"apt:zfs-dkms" = "latest"
"apt:zfsutils-linux" = "latest"

[bootstrap.services.zfs-import-cache]
enabled = true

[bootstrap.services.zfs-mount]
enabled = true

[bootstrap.services."zfs-import.target"]
enabled = true

[bootstrap.services."zfs.target"]
enabled = true
