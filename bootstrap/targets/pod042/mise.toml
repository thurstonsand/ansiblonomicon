min_version = "2026.8.12"

[settings]
jobs = 1
system_packages.managers = ["apt"]

[bootstrap]
config_roots = ["base", "storage"]

[bootstrap.hooks.pre-packages]
run = "storage/scripts/ensure-contrib"

[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:linux-headers-amd64" = "latest"
"apt:openssh-server" = "latest"
"apt:sudo" = "latest"
"apt:zfs-dkms" = "latest"
"apt:zfsutils-linux" = "latest"

[bootstrap.groups.thurstonsand]

[bootstrap.users.thurstonsand]
group = "thurstonsand"
groups = ["sudo"]
home = "/home/thurstonsand"
shell = "/bin/bash"
create_home = true

[bootstrap.directories."/home/thurstonsand/code"]
owner = "thurstonsand"
group = "thurstonsand"
mode = "0755"

[bootstrap.repos]
"/home/thurstonsand/code/ansiblonomicon" = { url = "https://github.com/thurstonsand/ansiblonomicon.git" }

[tasks.bootstrap]
run = "scripts/install-system-mise"
