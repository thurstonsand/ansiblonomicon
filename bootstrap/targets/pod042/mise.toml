min_version = "2026.9.11"

[settings]
jobs = 1
system_packages.managers = ["apt"]

[vars]
host_profile = "personal"
host_os = "linux"
terminal_theme_home = "/home/thurstonsand"
terminal_theme_profile = "mirror"
terminal_theme_mirrors = ""
git_client_home = "/home/thurstonsand"
git_personal_signing_key = "/home/thurstonsand/.ssh/id_ed25519_git"
git_signing_program = ""
jj_signing_program = ""
terminal_tools_home = "/home/thurstonsand"
terminal_tools_develop_dir = "code"
lazygit_services = ""
rustup_default_toolchain = "stable-x86_64-unknown-linux-gnu"

[tasks."mise:maintain"]
description = "Update the system mise binary when its daily maintenance is due"
run = "../../capabilities/mise/mise-maintain --sudo /usr/local/bin/mise /var/cache/ansiblonomicon/mise-upgrade.stamp"
