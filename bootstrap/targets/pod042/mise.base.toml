[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:openssh-server" = "latest"
"apt:sudo" = "latest"

[bootstrap.groups.thurstonsand]

[bootstrap.users.thurstonsand]
group = "thurstonsand"
groups = ["sudo"]
home = "/home/thurstonsand"
shell = "/bin/bash"
create_home = true

[bootstrap.directories."/home/thurstonsand/code"]
owner = "thurstonsand"
group = "thurstonsand"
mode = "0755"

[bootstrap.directories."/home/thurstonsand/.ssh"]
owner = "thurstonsand"
group = "thurstonsand"
mode = "0700"

[bootstrap.files."/home/thurstonsand/.ssh/authorized_keys"]
source = "base/files/operator.pub"
owner = "thurstonsand"
group = "thurstonsand"
mode = "0600"

[bootstrap.files."/etc/sudoers.d/thurstonsand"]
content = "thurstonsand ALL=(ALL:ALL) NOPASSWD: ALL\n"
owner = "root"
group = "root"
mode = "0440"

[bootstrap.files."/etc/ssh/sshd_config.d/00-ansiblonomicon.conf"]
content = '''
PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
'''
owner = "root"
group = "root"
mode = "0644"
notify = ["ssh"]

[bootstrap.directories."/etc/mise"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/mise/host-tools.toml"]
content = '''
[tools]
fnox = "latest"
op = "latest"
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services.ssh]
state = "running"
enabled = true
on_change = "reload_or_restart"

[bootstrap.repos]
"/home/thurstonsand/code/ansiblonomicon" = { url = "https://github.com/thurstonsand/ansiblonomicon.git" }

[tasks.bootstrap]
run = [
  "base/scripts/install-system-mise",
  "sudo -H env MISE_DATA_DIR=/opt/mise MISE_GLOBAL_CONFIG_FILE=/etc/mise/host-tools.toml /usr/local/bin/mise -C / install --yes --jobs 1",
  "sudo -H env MISE_DATA_DIR=/opt/mise MISE_GLOBAL_CONFIG_FILE=/etc/mise/host-tools.toml /usr/local/bin/mise -C / upgrade --yes --jobs 1",
  '''
set -eu
for tool in fnox op; do
  source="/opt/mise/installs/$tool/latest/$tool"
  target="/usr/local/bin/$tool"
  sudo test -x "$source"
  if [ "$(readlink "$target")" != "$source" ]; then
    sudo ln -sfnT "$source" "$target"
  fi
done
''',
]
