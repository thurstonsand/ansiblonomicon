[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:intel-microcode" = "latest"
"apt:locales" = "latest"
"apt:openssh-server" = "latest"
"apt:sudo" = "latest"
"apt:systemd-timesyncd" = "latest"
"apt:unattended-upgrades" = "latest"
"apt:zsh" = "latest"

[bootstrap.groups.thurstonsand]

[bootstrap.users.thurstonsand]
group = "thurstonsand"
groups = ["sudo"]
home = "/home/thurstonsand"
shell = "/usr/bin/zsh"
create_home = true

[bootstrap.directories."/home/thurstonsand/code"]
owner = "thurstonsand"
group = "thurstonsand"
mode = "0755"

[bootstrap.directories."/home/thurstonsand/.ssh"]
owner = "thurstonsand"
group = "thurstonsand"
mode = "0700"

[bootstrap.files."/home/thurstonsand/.ssh/authorized_keys"]
source = "base/files/operator.pub"
owner = "thurstonsand"
group = "thurstonsand"
mode = "0600"

[bootstrap.files."/etc/sudoers.d/thurstonsand"]
content = "thurstonsand ALL=(ALL:ALL) NOPASSWD: ALL\n"
owner = "root"
group = "root"
mode = "0440"

[bootstrap.files."/etc/ssh/sshd_config.d/00-ansiblonomicon.conf"]
content = '''
ClientAliveCountMax 3
ClientAliveInterval 30
PasswordAuthentication no
PermitRootLogin no
PrintLastLog yes
PubkeyAuthentication yes
'''
owner = "root"
group = "root"
mode = "0644"
notify = ["ssh"]

[bootstrap.directories."/etc/systemd/journald.conf.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/journald.conf.d/00-ansiblonomicon.conf"]
source = "base/journald.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["systemd-journald"]

[bootstrap.files."/etc/locale.conf"]
content = '''
LANG="en_US.UTF-8"
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/locale.gen"]
content = '''
en_US.UTF-8 UTF-8
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/apt/apt.conf.d/20auto-upgrades"]
source = "base/20auto-upgrades"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/apt/apt.conf.d/50unattended-upgrades"]
source = "base/50unattended-upgrades"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/local/bin/pod042-base-check"]
source = "base/check.py"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/etc/mise"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/mise/host-tools.toml"]
content = '''
[tools]
fnox = "latest"
op = "latest"
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services.ssh]
state = "running"
enabled = true
on_change = "reload_or_restart"

[bootstrap.services.systemd-timesyncd]
state = "running"
enabled = true

[bootstrap.services.systemd-journald]
state = "running"
enabled = false
on_change = "restart"

[bootstrap.services."apt-daily-upgrade.timer"]
state = "running"
enabled = true

[bootstrap.repos]
"/home/thurstonsand/code/ansiblonomicon" = { url = "https://github.com/thurstonsand/ansiblonomicon.git" }

[tasks.bootstrap]
run = [
  "base/scripts/install-system-mise",
  '''
if [ "$(timedatectl show --property=Timezone --value)" != "America/New_York" ]; then
  sudo -n timedatectl set-timezone America/New_York
fi
''',
  "sudo -H env MISE_DATA_DIR=/opt/mise MISE_GLOBAL_CONFIG_FILE=/etc/mise/host-tools.toml /usr/local/bin/mise -C / install --yes --jobs 1",
  "sudo -H env MISE_DATA_DIR=/opt/mise MISE_GLOBAL_CONFIG_FILE=/etc/mise/host-tools.toml /usr/local/bin/mise -C / upgrade --yes --jobs 1",
  '''
set -eu
for tool in fnox op; do
  source="/opt/mise/installs/$tool/latest/$tool"
  target="/usr/local/bin/$tool"
  sudo test -x "$source"
  if [ "$(readlink "$target")" != "$source" ]; then
    sudo ln -sfnT "$source" "$target"
  fi
done
''',
]

# APT has no native absent-package resource. A rare package retirement belongs here
# as an explicit idempotent task, and is removed after it has run on the live host.

[bootstrap.hooks.final]
run = [
  '''
if [ "$(locale -a | grep -Ev '^(C|C.utf8|POSIX)$')" != "en_US.utf8" ]; then
  sudo -n /usr/sbin/locale-gen >/dev/null
fi
''',
  "sudo -n /usr/local/bin/pod042-base-check",
]

[tasks."base:check"]
run = "sudo -n /usr/local/bin/pod042-base-check"
