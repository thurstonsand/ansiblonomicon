auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # Filesystem mode overrides the querier's lookback; -1 nanosecond is Loki's unlimited sentinel.
  query_store_max_look_back_period: -1ns
  wal:
    enabled: true
    dir: /loki/wal

querier:
  # Initial file ingestion includes old timestamps in chunks not yet flushed to storage.
  query_ingesters_within: 0s

compactor:
  working_directory: /loki/compactor
  # No automatic deletion in the initial collection phase.
  retention_enabled: false

limits_config:
  allow_structured_metadata: true
  reject_old_samples: false
  max_query_series: 10000

analytics:
  reporting_enabled: false
