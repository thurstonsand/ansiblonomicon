<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache usage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #eef0ec; --sheet: #fbfbf9; --ink: #1f2a2e; --ink-2: #56636a; --ink-3: #8a959b; --rule: #d5dad4;
  --read: #e9a23b; --write: #2f62c9; --uncached: #8b4fbf; --output: #3f8a5f; --unknown: #8b949a; --focus: #2f62c9;
  font-family: "Schibsted Grotesk", system-ui, sans-serif; color: var(--ink); background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.45; }
h2, p { margin: 0; }
h2 { font-size: 19px; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: inherit; }
.id { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: -0.01em; }
.tiny { font-size: 12.5px; color: var(--ink-2); }
.page { max-width: 1440px; margin: 0 auto; padding: 28px 48px 56px; }
.sheet, .panel { background: var(--sheet); border-radius: 16px; }
.nav { padding: 16px 28px 10px; }
.navbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.wins, .seg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.win { border: 0; background: none; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.win.a { background: var(--ink); color: #fff; font-weight: 600; }
.win.b { outline: 1.5px dashed var(--ink-2); color: var(--ink-2); }
.win.b[aria-pressed="true"] { outline-color: var(--focus); color: var(--focus); }
.vs { color: var(--ink-3); font-size: 13px; }
.hero { display: inline-flex; align-items: baseline; gap: 6px; margin-right: 12px; }
.hero b { font-size: 30px; line-height: 1; font-weight: 650; letter-spacing: -0.02em; }
.hero .lbl { font-size: 14px; color: var(--ink-2); }
.hero .unk { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-size: 13px; color: var(--ink-2); }
.hero .unk svg { width: 10px; height: 10px; }
.win.b .of { margin-left: 6px; }
.navbar > .seg { margin-left: auto; }
.seg button, .presets button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.presets { display: flex; gap: 4px; margin-left: 8px; }
.presets button { border-color: transparent; color: var(--ink-2); }
.seg .note { border-style: dashed; color: var(--ink-2); background: none; }
form.note[hidden] { display: none; }
form.note { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 13px; }
form.note input { border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; background: #fff; }
form.note input[name="text"] { flex: 1; min-width: 240px; }
form.note button { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
form.note button[type="button"] { background: none; color: var(--ink); }
#status:empty { display: none; }
#status { margin-top: 8px; }
#nav { cursor: crosshair; touch-action: none; user-select: none; }
.field { margin-top: 16px; padding: 14px 0 8px; }
.legend { display: flex; gap: 22px; padding: 4px 28px 10px; font-size: 13px; color: var(--ink-2); align-items: center; flex-wrap: wrap; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.row { display: grid; gap: 24px; margin-top: 24px; }
.row.two { grid-template-columns: 1fr 1fr; }
.row.drill { grid-template-columns: minmax(0, 1fr) 470px; }
.panel { padding: 22px 26px; border-radius: 14px; }
.panel > svg { margin-top: 12px; }
.ckey { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; align-items: center; }
.legend > span, .ckey > span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg, .ckey svg { width: 10px; height: 10px; flex: none; overflow: visible; }
.ckey .break { flex-basis: 100%; height: 0; }
.ckey .lead { color: var(--ink-3); }
#field circle[data-id], #requests, #nav .release { cursor: pointer; }
.detail { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--ink-2); margin-top: 12px; padding: 10px 12px; background: #f1f3ef; border-radius: 8px; }
.detail b { color: var(--ink); font-weight: 600; }
.detail:empty { display: none; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th { text-align: right; font-weight: 500; font-size: 12px; color: var(--ink-3); padding: 6px; }
td { padding: 8px 6px; border-top: 1px solid var(--rule); font-size: 13.5px; vertical-align: middle; text-align: right; font-variant-numeric: tabular-nums; }
td:first-child, td:nth-child(2) { text-align: left; }
td svg { display: inline-block; width: 150px; height: 10px; }
td.name { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: #f3f4f1; }
tr.sel td { background: #f3eef2; }
.nav, .field { overflow-x: auto; }
#nav, #field { min-width: 1100px; }
@media (max-width: 1100px) {
  .page { padding: 16px; }
  .row.two, .row.drill { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="5" height="5" fill="#eef0ec"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8b949a" stroke-width="2"/>
  </pattern>
</defs></svg>
<main class="page">
  <section class="sheet nav" aria-label="Time window">
    <div class="navbar">
      <div class="wins">
        <span class="hero" id="hero"></span>
        <button class="win a" id="winA" title="Drag across the timeline to choose"></button>
        <span class="vs">against</span>
        <button class="win b" id="winB" aria-pressed="false" title="Click, then drag across the timeline to choose the comparison"></button>
        <span class="presets" id="presets"><button data-days="1">1 day</button><button data-days="3">3 days</button><button data-days="7">7 days</button><button data-days="30">30 days</button></span>
      </div>
      <div class="seg"><span class="seg" id="models"></span><button class="note" id="addNote">Add note</button></div>
    </div>
    <form class="note" id="noteForm" hidden>
      <input name="text" maxlength="200" required placeholder="What happened" aria-label="Note">
      <input name="start" type="datetime-local" required aria-label="From">
      <input name="end" type="datetime-local" required aria-label="To">
      <button>Save note</button><button type="button" id="cancelNote">Cancel</button>
    </form>
    <p class="tiny" id="status" role="status"></p>
    <svg id="nav" viewBox="0 0 1288 142" role="img" aria-label="Input tokens per period, coloured by cache reuse"></svg>
  </section>

  <section class="sheet field" aria-label="Conversations in the selected window">
    <div class="legend" id="legend"></div>
    <svg id="field" viewBox="0 0 1344 600" role="img" aria-label="Conversations by size and rewritten share"></svg>
  </section>

  <div class="row two">
    <section class="panel"><h2 id="whyTitle">Why, every day</h2><svg id="why" viewBox="0 0 590 240" role="img" aria-label="Rewritten tokens by cause"></svg></section>
    <section class="panel"><h2>How long before it came back</h2><svg id="gaps" viewBox="0 0 590 240" role="img" aria-label="Idle time before each cold reopening"></svg><div class="ckey" id="gapKey"></div></section>
  </div>

  <div class="row drill">
    <section class="panel" id="inspect"></section>
    <section class="panel" id="writers"></section>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const T = { n: 0, unknown: 1, errors: 2, input: 3, read: 4, write: 5, output: 6, rw: 7, cold: 8 };
const REWRITE = ["new_context", "config", "history_diverged", "previous_request_failed"];
const CAUSE = {
  new_context: ["Runtime reopened", "#b4235a"],
  config: ["Configuration changed", "#5b4bc4"],
  history_diverged: ["History diverged", "#1b8a7a"],
  previous_request_failed: ["Retry after failure", "#c79a3a"],
  first_request: ["First request", "#d6dbe0"],
  compatible: ["New turns", "#d6dbe0"],
  unrecorded: ["Cause not recorded", "url(#hatch)"],
};
const CAUSE_ORDER = [...REWRITE, "first_request", "compatible", "unrecorded"];
const LANES = [["amp", "Amp threads"], ["opencode", "OpenCode sessions"], ["derived", "Derived conversations"], ["anonymous", "Anonymous requests"], ["inbox_zero", "Inbox Zero"], ["cpa_shared", "CLIProxyAPI, unattributed"]];
const BIG = new Set(["amp", "opencode", "derived"]);
const PROXY = new Set(["inbox_zero", "cpa_shared"]);
const BANDS = [[0.5, "#2f62c9"], [0.9, "#8fa9de"], [0.95, "#f3d29a"], [0.98, "#eeb455"], [1.01, "#c97d12"]];
const reuseColor = (hit) => BANDS.find(([limit]) => hit < limit)[1];

const state = { a: null, b: null, models: null, focus: null, picking: "a" };
let V = null, C = null, selectedRow = null;

const fmt = (n) => {
  if (n == null) return "unknown";
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 1 : 2) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "k";
  return String(Math.round(n));
};
const pct = (x, d = 1) => (x == null ? "unknown" : (x * 100).toFixed(d) + "%");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const duration = (s) => s == null ? "first request" : s < 60 ? Math.round(s) + " s" : s < 3600 ? Math.round(s / 60) + " min" : s < 86400 ? (s / 3600).toFixed(1) + " h" : (s / 86400).toFixed(1) + " days";
const inputOf = (t) => t[T.input] + t[T.read] + t[T.write];
const shareOf = (t) => { const d = inputOf(t); return d ? t[T.rw] / d : null; };
const modelName = (m) => m === "unknown" ? "Not reported" : !m.startsWith("claude-") ? m : m.replace(/^claude-/, "").replace(/^(\w)/, (x) => x.toUpperCase()).replace(/-(\d+)-(\d+)$/, " $1.$2");
const AXIS = ["1", "10", "100", "1k", "10k", "100k", "1M", "10M", "100M", "1B", "10B"];
const addDays = (day, n) => new Date(Date.parse(day + "T00:00Z") + n * 864e5).toISOString().slice(0, 10);
const dayLabel = (day, opts) => new Date(day + "T12:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", ...opts });
const fmtDay = (day) => dayLabel(day, { day: "numeric", month: "short" });
const fmtWin = ([a, b]) => a === b ? fmtDay(a) : `${fmtDay(a)} – ${fmtDay(b)}`;
const winLabel = (w) => w.version ? "v" + w.version : fmtWin(w.days);
const nameHtml = (id, title) => title ? esc(title) : `<span class="id">${esc(id)}</span>`;
const fmtTime = (t) => new Date(t * 1000).toLocaleString("en-GB", { timeZone: V.tz, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const svgPoint = (svg, event) => { const p = svg.createSVGPoint(); p.x = event.clientX; p.y = event.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };

const lastDay = () => V.calendar[V.calendar.length - 2][0];
const days = () => V.calendar.slice(0, -1).map(([day]) => day);

// ---- state and loading
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.a = p.get("a"); state.b = p.get("b"); state.models = p.get("models"); state.focus = p.get("c");
}
function writeHash() {
  const p = new URLSearchParams();
  p.set("a", state.a); p.set("b", state.b);
  if (state.models) p.set("models", state.models);
  if (state.focus) p.set("c", state.focus);
  history.replaceState(null, "", "#" + p.toString());
}
function status(text) { $("status").textContent = text; }

async function load() {
  const q = new URLSearchParams();
  for (const key of ["a", "b", "models"]) if (state[key]) q.set(key, state[key]);
  const response = await fetch("/api/view?" + q);
  if (!response.ok) { status(`The view could not load: ${await response.text()}`); return; }
  V = await response.json();
  if (V.empty) { status("No usage is indexed yet. The indexer is still reading Loki; reload in a minute."); return; }
  status(state.picking === "b" ? "Drag across the timeline to choose the comparison." : "");
  state.a = V.a.id; state.b = V.b.id;
  renderControls(); renderNav(); renderField(); renderWhy(); renderGaps(); renderWriters();
  if (!state.focus) state.focus = leaders()[0]?.[0] ?? null;
  writeHash();
  await loadConversation();
}

async function loadConversation() {
  if (!state.focus) { $("inspect").innerHTML = ""; return; }
  const q = new URLSearchParams({ id: state.focus, through: V.a.days[1] });
  if (state.models) q.set("models", state.models);
  const response = await fetch("/api/conversation?" + q);
  if (!response.ok) { status(`The conversation could not load: ${await response.text()}`); return; }
  C = await response.json();
  selectedRow = null;
  renderDrill(); renderWriters();
}

function focusOn(id) { state.focus = id; writeHash(); loadConversation(); }

// ---- controls
const reuseOf = (w) => {
  let read = 0, input = 0;
  for (const lane of Object.values(V.lanes)) if (lane[w]) { read += lane[w][T.read]; input += inputOf(lane[w]); }
  return input ? read / input : null;
};
function renderControls() {
  const unknown = Object.entries(V.lanes).reduce((n, [k, lane]) => n + (k === "unlabelled" ? 0 : lane.a?.[T.unknown] ?? 0), 0);
  const unlabelled = V.lanes.unlabelled?.a?.[T.n] ?? 0;
  const gaps = [unknown && `${unknown} not reported`, unlabelled && `${unlabelled} failed unlabelled`].filter(Boolean).join(" · ");
  $("hero").innerHTML = `<b>${pct(reuseOf("a"))}</b><span class="lbl">reuse</span>${gaps ? `<span class="unk" title="Requests whose token usage is unknown, so the reuse figure leaves them out">${keyIcon('<rect width="10" height="10" fill="url(#hatch)" stroke="#8b949a"/>')}${gaps}</span>` : ""}`;
  $("winA").textContent = winLabel(V.a);
  $("winB").innerHTML = `${esc(winLabel(V.b))}<span class="of">${pct(reuseOf("b"))}</span>`;
  $("winB").setAttribute("aria-pressed", String(state.picking === "b"));
  const chosen = state.models ? new Set(state.models.split(",")) : null;
  $("models").innerHTML = V.models.map(([m]) => `<button data-model="${esc(m)}" aria-pressed="${!chosen || chosen.has(m)}">${esc(modelName(m))}</button>`).join("");
}
$("winB").addEventListener("click", () => {
  state.picking = state.picking === "b" ? "a" : "b";
  $("winB").setAttribute("aria-pressed", String(state.picking === "b"));
  status(state.picking === "b" ? "Drag across the timeline to choose the comparison." : "");
});
$("presets").addEventListener("click", (event) => {
  const n = Number(event.target.dataset?.days);
  if (!n || !V) return;
  state.a = `${addDays(lastDay(), 1 - n)}..${lastDay()}`; state.b = null; state.picking = "a";
  load();
});
$("models").addEventListener("click", (event) => {
  const model = event.target.closest("button")?.dataset.model;
  if (!model) return;
  const all = V.models.map(([m]) => m);
  const chosen = new Set(state.models ? state.models.split(",") : all);
  chosen.has(model) ? chosen.delete(model) : chosen.add(model);
  if (!chosen.size) return;
  state.models = chosen.size === all.length ? null : all.filter((m) => chosen.has(m)).join(",");
  load();
});

// ---- notes
const localInput = (t) => { const d = new Date(t * 1000); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
$("addNote").addEventListener("click", () => {
  const form = $("noteForm"), [from, to] = V.a.span;
  form.start.value = localInput(from); form.end.value = localInput(to);
  form.hidden = false; form.text.focus();
});
$("cancelNote").addEventListener("click", () => { $("noteForm").hidden = true; });
$("noteForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  const response = await fetch("/api/notes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: form.text.value, start: Date.parse(form.start.value) / 1000, end: Date.parse(form.end.value) / 1000 }) });
  if (!response.ok) { status(`The note was not saved: ${await response.text()}`); return; }
  form.reset(); form.hidden = true; load();
});
async function deleteNote(id, text) {
  if (!confirm(`Delete the note "${text}"?`)) return;
  await fetch(`/api/notes/${id}`, { method: "DELETE" });
  load();
}

// ---- timeline navigator: whole history, chooses the windows
function renderNav() {
  const svg = $("nav"), W = 1288, L = 4, top = 30, base = 100;
  const t0 = V.calendar[0][1], t1 = V.calendar[V.calendar.length - 1][1];
  const x = (t) => L + ((Math.min(Math.max(t, t0), t1) - t0) / (t1 - t0)) * (W - 2 * L);
  const rows = V.timeline.rows, unit = V.timeline.unit;
  const maxIn = Math.max(1, ...rows.map((r) => r[3]));
  let s = "", labels = "";
  const [a0, a1] = V.a.span, [b0, b1] = V.b.span;
  s += `<rect x="${x(a0)}" y="${top - 10}" width="${Math.max(3, x(a1) - x(a0))}" height="${base - top + 10}" fill="#e3e7e1" rx="4"/>`;
  if (b1 > t0) s += `<rect x="${x(b0)}" y="${top - 10}" width="${Math.max(3, x(b1) - x(b0))}" height="${base - top + 10}" fill="none" stroke="#56636a" stroke-dasharray="4 3" rx="4"/>`;
  for (const [id, start, end, text] of V.notes) {
    if (end < t0 || start > t1) continue;
    const nx = x(start), nw = Math.max(3, x(end) - nx);
    s += `<g class="note" data-note="${id}" style="cursor:pointer"><title>${esc(text)}</title><rect x="${nx}" y="${top - 10}" width="${nw}" height="${base - top + 10}" fill="#f3ecc9" opacity="0.92"/></g>`;
    if (nw > 70) labels += `<text pointer-events="none" x="${nx + nw / 2}" y="${top + 8}" font-size="12" text-anchor="middle" fill="#6a5a1d" font-style="italic" stroke="#f3ecc9" stroke-width="5" paint-order="stroke">${esc(text.length > nw / 6.5 ? text.slice(0, Math.floor(nw / 6.5) - 1) + "…" : text)}</text>`;
  }
  rows.forEach(([t, n, unknown, input, read], i) => {
    const w = Math.max(1, x((rows[i + 1]?.[0] ?? t + (unit === "hour" ? 3600 : 86400))) - x(t) - 0.6);
    const width = unit === "hour" ? Math.max(1, x(t + 3600) - x(t) - 0.6) : w;
    if (!input) { if (n) s += `<rect x="${x(t)}" y="${top - 10}" width="${Math.max(2, width)}" height="${base - top + 10}" fill="url(#hatch)" opacity="0.55"><title>${fmtTime(t)}: ${n} requests, usage not reported</title></rect>`; return; }
    const h = Math.max(2, Math.sqrt(input / maxIn) * (base - top));
    s += `<rect x="${x(t)}" y="${base - h}" width="${width}" height="${h}" fill="${reuseColor(read / input)}"><title>${fmtTime(t)}: reuse ${pct(read / input)}${unknown ? `, ${unknown} without usage` : ""}</title></rect>`;
  });
  s += labels;
  let labelEnd = -Infinity;
  for (const [version, first] of V.releases) {
    if (first < t0 || first > t1) continue;
    const rx = x(first), label = rx > labelEnd;
    s += `<g class="release" data-version="${esc(version)}"><title>v${esc(version)}: compare with the release before it</title><line x1="${rx}" x2="${rx}" y1="${top - 26}" y2="${base}" stroke="#1f2a2e" stroke-dasharray="2 2"/><rect x="${rx - 4}" y="${top - 30}" width="${label ? 60 : 8}" height="${base - top + 30}" fill="transparent"/>`;
    if (label) { s += `<text x="${rx + 4}" y="${top - 17}" font-size="11.5" font-weight="600" fill="#1f2a2e">v${esc(version)}</text>`; labelEnd = rx + 64; }
    s += `</g>`;
  }
  for (const [t, kind] of V.coverage) s += `<g><title>${fmtTime(t)}: CLIProxyAPI collector reported a ${kind === "gap" ? "gap" : "possible gap"}</title><rect x="${x(t) - 1}" y="${top - 10}" width="2" height="${base - top + 10}" fill="#b58a1b"/><path d="M${x(t)} ${base + 2} l-4 7 h8 z" fill="#b58a1b"/></g>`;
  const all = days(), monthly = all.length > 31;
  for (const [day, t] of V.calendar.slice(0, -1)) {
    if (monthly && !day.endsWith("-01") && day !== all[0]) continue;
    s += `<line x1="${x(t)}" x2="${x(t)}" y1="${base}" y2="${base + 5}" stroke="#8a959b"/><text x="${x(t) + 4}" y="${base + 20}" font-size="12" fill="#56636a">${monthly ? dayLabel(day, { month: "short", year: "numeric" }) : dayLabel(day, { weekday: "short", day: "numeric" })}</text>`;
  }
  s += `<line x1="${L}" x2="${W - L}" y1="${base}" y2="${base}" stroke="#1f2a2e"/>`;
  s += `<g transform="translate(${W - 150},${base + 38})"><text font-size="12" fill="#8a959b">reuse</text>${BANDS.map(([, c], i) => `<rect x="${38 + i * 20}" y="-9" width="18" height="9" fill="${c}"/>`).join("")}</g>`;
  s += `<rect id="dragRect" y="${top - 10}" height="${base - top + 10}" fill="rgba(47,98,201,0.12)" stroke="#2f62c9" width="0" visibility="hidden"/>`;
  svg.innerHTML = s;
  svg.onpointerdown = (event) => {
    if (event.target.closest(".note, .release")) return;

// ---- conversation field for window A, lanes compared with window B

// ---- why, every day: rewritten tokens by cause across all history
function renderWhy() {
  const W = 590, L = 44, base = 196, top = 14;
  let all = days();
  const weekly = all.length > 62;
  const bucketOf = (day) => weekly ? addDays(day, -((new Date(day + "T12:00Z").getUTCDay() + 6) % 7)) : day;
  const buckets = [...new Set(all.map(bucketOf))];
  const sums = new Map(buckets.map((b) => [b, { causes: {}, n: 0, unknown: 0 }]));
  for (const [day, cause, write] of V.daily_causes) { const b = sums.get(bucketOf(day)); b.causes[cause] = (b.causes[cause] || 0) + write; }
  for (const [day, source, , , n, unknown] of V.daily) if (!PROXY.has(source)) { const b = sums.get(bucketOf(day)); b.n += n; b.unknown += unknown; }
  const total = (b) => REWRITE.reduce((a, k) => a + (b.causes[k] || 0), 0);
  const max = Math.max(1, ...[...sums.values()].map(total));

  const band = ([from, to], dashed) => {

    return `<rect x="${L + idx[0] * cw}" y="${top - 6}" width="${(idx[idx.length - 1] - idx[0] + 1) * cw}" height="${base - top + 6}" ${dashed ? 'fill="none" stroke="#8a959b" stroke-dasharray="3 3"' : 'fill="#e8ebe6"'}/>`;

  });
  s += `<line x1="${L}" x2="${W}" y1="${base}" y2="${base}" stroke="#1f2a2e"/>`;

// ---- how long before it came back: idle time before each cold reopening

  const bx = (i) => L + ((i + 0.5) / bins) * (W - L), xm = (min) => L + ((Math.log10(min) - lo) / (hi - lo)) * (W - L);
  const stack = (rows) => { const m = new Map(); for (const [g] of rows) { const i = bin(g); if (i < bins) m.set(i, (m.get(i) || 0) + 1); } return m; };
  const sa = stack(V.gaps.a), sb = stack(V.gaps.b);
  const tallest = Math.max(1, ...sa.values(), ...sb.values());
  const step = Math.min(7, room / tallest), r = Math.max(0.8, Math.min(2.9, step * 0.42));
  let s = `<rect x="${xm(60)}" y="4" width="${W - xm(60)}" height="228" fill="#f6eef1"/><line x1="${xm(60)}" x2="${xm(60)}" y1="4" y2="232" stroke="#b4235a" stroke-width="1.5"/><text x="${xm(60) + 6}" y="18" font-size="12" fill="#b4235a" font-weight="600">runtime and cache expire</text>`;
  for (const [i, n] of sa) for (let k = 0; k < n; k++) s += `<circle cx="${bx(i)}" cy="${mid - 7 - k * step}" r="${r}" fill="#1f2a2e"/>`;
  for (const [i, n] of sb) for (let k = 0; k < n; k++) s += `<circle cx="${bx(i)}" cy="${mid + 30 + k * step}" r="${r * 0.93}" fill="none" stroke="#56636a" stroke-width="1.1"/>`;
  const edge = (i) => Math.round(10 ** (lo + (i / bins) * (hi - lo)));
  const peak = (m) => [...m].filter(([i]) => bx(i) > xm(70)).sort((p, q) => q[1] - p[1])[0];

  if (pb) s += `<text x="${bx(pb[0])}" y="${mid + 48 + (pb[1] - 1) * step}" font-size="12" text-anchor="middle" fill="#56636a">${edge(pb[0])}–${edge(pb[0] + 1)} min</text>`;
  for (const [m, l] of [[1, "1 min"], [5, "5"], [15, "15"], [60, "1 h"], [240, "4 h"], [1440, "1 day"], [10080, "7 days"]]) s += `<line x1="${xm(m)}" x2="${xm(m)}" y1="${mid}" y2="${mid + 5}" stroke="#8a959b"/><text x="${xm(m)}" y="${mid + 17}" font-size="12" text-anchor="${m === 10080 ? "end" : "middle"}" fill="#56636a">${l}</text>`;
  s += `<line x1="${L}" x2="${W}" y1="${mid}" y2="${mid}" stroke="#1f2a2e"/>`;
  $("gaps").innerHTML = s;

}

// ---- one conversation's requests, in order, with window A shaded

const keyIcon = (shape) => `<svg viewBox="0 0 10 10" aria-hidden="true">${shape}</svg>`;

  if (gapSeconds != null) facts.push(["idle", duration(gapSeconds)]);
  if (closed) facts.push(["closed by", closed.replace(/^HTTP /, "")]);
  for (const [key, label] of [["sync", "sync"], ["lane", "lane"], ["context", "rebuilt from"], ["forced", "forced by"], ["messages", "messages"], ["latency_ms", "latency ms"], ["status", "HTTP"], ["error", "error"], ["accounting", "accounting"]]) if (extra[key] != null) facts.push([label, String(extra[key]).replace(/^HTTP /, "")]);
  if (extra.changed) facts.push(["changed", extra.changed.join(", ")]);
  if (extra.duration_ms != null) facts.push(["took", (extra.duration_ms / 1000).toFixed(1) + " s"]);
  if (outcome !== "success") facts.push(["outcome", outcome]);
  return facts.map(([k, v]) => `<span>${k ? k + " " : ""}<b>${esc(v)}</b></span>`).join("");
}

// ---- biggest rewriters in window A
const leaders = () => V.consumers.filter((c) => !PROXY.has(c[1]) && c[2 + T.rw] > 0).sort((p, q) => q[2 + T.rw] - p[2 + T.rw]).slice(0, 9);
function causeBar(causes) {
  const total = Object.values(causes).reduce((a, v) => a + v, 0);
  let x = 0;
  return `<svg viewBox="0 0 150 10" preserveAspectRatio="none">${CAUSE_ORDER.filter((c) => causes[c]).map((c) => { const w = (causes[c] / total) * 150; const r = `<rect x="${x}" width="${w}" height="10" fill="${CAUSE[c][1]}" stroke="#fbfbf9" stroke-width="0.6"><title>${CAUSE[c][0]}, ${fmt(causes[c])}</title></rect>`; x += w; return r; }).join("")}</svg>`;
}
function renderWriters() {
  if (!V) return;
  const top = leaders();
  const unrecorded = top.some((c) => c[11].unrecorded);
  $("writers").innerHTML = `<h2>Biggest rewriters, ${winLabel(V.a)}</h2>
    <table><thead><tr><th></th><th></th><th>Rewritten</th><th>Reuse</th></tr></thead><tbody>
    ${top.map((c) => `<tr data-id="${esc(c[0])}" tabindex="0" class="${c[0] === state.focus ? "sel" : ""}"><td class="name" title="${esc(c[0])}">${nameHtml(c[0], V.titles[c[0]])}</td><td>${causeBar(c[11])}</td><td><b>${fmt(c[2 + T.rw])}</b></td><td>${pct(c[2 + T.read] / inputOf(c.slice(2)))}</td></tr>`).join("")}
    </tbody></table>
    ${unrecorded ? `<div class="ckey"><span><i class="swatch" style="background:${CAUSE.unrecorded[1]};outline:1px solid #8b949a"></i>${CAUSE.unrecorded[0]}</span></div>` : ""}`;
  const pick = (event) => { const id = event.target.closest("tr[data-id]")?.dataset.id; if (id) focusOn(id); };
  $("writers").onclick = pick;
  $("writers").onkeydown = (event) => { if (event.key === "Enter") pick(event); };
}

readHash();
load();
</script>
</body>
</html>
