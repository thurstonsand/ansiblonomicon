# A Windows time zone ID, as listed by `tzutil /l`.
timezone = "Eastern Standard Time"

[theme]
name = "city-ruins.theme"
source = "../../capabilities/terminal-theme/city-ruins/windows.theme"
wallpaper = "../no9-type-s/omarchy/themes/city-ruins/backgrounds/wallhaven-y83x8g.jpg"

# Integers are REG_DWORD values; strings are REG_SZ.

# Dual boot with Omarchy: Linux keeps the hardware clock in UTC, and Linux
# cannot safely mount a disk that Windows hibernated instead of shutting down.
[registry.'HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation']
RealTimeIsUniversal = 1

[registry.'HKLM\SYSTEM\CurrentControlSet\Control\Power']
HibernateEnabled = 0

[registry.'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power']
HiberbootEnabled = 0

# Smart App Control blocks mise.exe, which carries only a self-signed certificate.
[registry.'HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy']
VerifiedAndReputablePolicyState = 0

# Developer Mode lets git and mise create symlinks without elevation.
[registry.'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock']
AllowDevelopmentWithoutDevLicense = 1

# Windows leaves HOME unset, and mise templates and the repo's scripts read it.
[registry.'HKCU\Environment']
HOME = 'C:\Users\thurs'

# Restricted, the default, refuses every script, including a PowerShell profile.
[registry.'HKCU\Software\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell']
ExecutionPolicy = "RemoteSigned"

# Shortest repeat delay (~250 ms), fastest standard repeat rate (~30/second).
[registry.'HKCU\Control Panel\Keyboard']
KeyboardDelay = "0"
KeyboardSpeed = "31"

# RepeatKeys overrides the standard rate. Enable it without sounds or the hotkey;
# accept presses immediately and do not filter closely spaced presses.
[registry.'HKCU\Control Panel\Accessibility\Keyboard Response']
Flags = "3"
AutoRepeatDelay = "250"
AutoRepeatRate = "15"
DelayBeforeAcceptance = "0"
BounceTime = "0"

# One-finger dragging and the driver's Light haptic feedback preset.
[registry.'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\AmtPtpDeviceUsbUm\Parameters']
IgnoreButtonFinger = 0
FeedbackClick = 0x040415
FeedbackRelease = 0x000010

[registry.'HKLM\SYSTEM\CurrentControlSet\Services\AmtPtpHidFilter\Parameters']
IgnoreButtonFinger = 0
FeedbackClick = 0x040415
FeedbackRelease = 0x000010
