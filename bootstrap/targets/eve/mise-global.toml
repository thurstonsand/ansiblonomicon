# Windows has no system python3 for hooks outside a project, as Unix hosts do.
[tools]
python = "3.15"
node = "lts"
# Official Anomaly package, published with npm provenance; younger than the package-age gate.
"npm:@opencode/browse" = { version = "latest", allow_low_downloads = true }

[env]
# mise owns upgrades; Browse's npm updater would install outside its tool directory.
OPENCODE_BROWSER_AUTO_UPDATE = "off"

[settings]
# Tasks are POSIX shell. The bare name `bash` makes mise find Git Bash and skip
# the WSL launcher; mise ignores this setting outside the global config.
windows_default_inline_shell_args = "bash -o errexit -c"
dotfiles.windows_symlinks = true
