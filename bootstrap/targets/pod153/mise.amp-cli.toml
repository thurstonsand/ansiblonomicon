# The Amp app runs the runner itself, through the CLI on the login shell's PATH.
[bootstrap.macos.defaults."com.ampcode.amp.macos"]
runnerEnabled = true
runnerID = "pod153"
runnerDiscoverFolders = ["/Users/thurstonsand/Develop/"]
runnerRemoteTerminalEnabled = true
runnerRemoteDesktopEnabled = true
runnerPortalsEnabled = true
runnerShareNetworkEnabled = true
runnerShareBrowserEnabled = true
"keepAwake.whileRunnerOn" = true

# Quitting Amp stops its runner, so the app updates itself from launchd, outside that runner's threads.
[bootstrap.macos.launchd.agents."house.thurstons.amp-app-update"]
program = "~/Develop/ansiblonomicon/bootstrap/targets/pod153/amp-cli/app_update.py"
start_interval = 60
process_type = "Background"
environment = { PATH = "/Library/Frameworks/Python.framework/Versions/Current/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/amp-app-update.log"
stderr_path = "~/Library/Logs/amp-app-update.log"

[tasks.amp-cli]
usage = 'flag "-c --check" help="Show Amp CLI, app update, and app runner setting drift"'
shell = "bash -c"
run = '''
set -euo pipefail
amp="$HOME/.amp/bin/amp"
installer="$MISE_PROJECT_ROOT/../../capabilities/software/install-official"
login="$HOME/.local/share/amp/secrets.json"

if [ -n "${usage_check:-}" ]; then
  [ -f "$login" ] || echo "BLOCKED: Amp persisted login is absent: $login"
  "$installer" "Amp CLI" "$amp" https://ampcode.com/install.sh --check
  python3 amp-cli/app_update.py --audit || :
  mise bootstrap --only macos-launchd-agents --dry-run
  exec mise bootstrap macos defaults apply --dry-run
fi

[ -f "$login" ] || { echo "Amp persisted login is absent: $login" >&2; exit 1; }

"$installer" "Amp CLI" "$amp" https://ampcode.com/install.sh
mise bootstrap --only macos-launchd-agents --yes
mise bootstrap macos defaults apply --yes
python3 amp-cli/app_update.py --audit
'''
