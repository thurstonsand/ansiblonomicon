[bootstrap.macos.launchd.agents."house.thurstons.cua-driver"]
program = "/Applications/CuaDriver.app/Contents/MacOS/cua-driver"
args = ["serve"]
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/cua-driver.log"
stderr_path = "~/Library/Logs/cua-driver.log"

[bootstrap.macos.launchd.agents."house.thurstons.claude-remote-control"]
program = "~/.local/bin/claude"
args = ["remote-control", "--name", "pod153: ~/Develop", "--spawn", "same-dir"]
run_at_load = true
keep_alive = true
working_directory = "~/Develop"
environment = { PATH = "/Users/thurstonsand/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
# Its status screen redraws to stdout forever; only stderr is worth keeping.
stdout_path = "/dev/null"
stderr_path = "~/Library/Logs/claude-remote-control.log"

# ChatGPT hosts Codex remote connections and computer use only while it is open.
[bootstrap.macos.launchd.agents."house.thurstons.chatgpt"]
program = "/usr/bin/open"
args = ["-g", "-a", "ChatGPT"]
run_at_load = true

[bootstrap.macos.launchd.agents."house.thurstons.reconcile"]
program = "~/Develop/ansiblonomicon/scripts/reconcile-or-fix"
working_directory = "~/Develop/ansiblonomicon"
start_calendar_interval = { hour = 4, minute = 30 }
process_type = "Background"
environment = { PATH = "/Users/thurstonsand/.local/bin:/Users/thurstonsand/.amp/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/ansiblonomicon-reconcile.log"
stderr_path = "~/Library/Logs/ansiblonomicon-reconcile.log"

[bootstrap.files."/Users/thurstonsand/.ssh/authorized_keys"]
source = "ssh-client/authorized_keys"
mode = "0600"

# Pre-boot SSH reads nothing from the locked data volume, so FileVault unlock keeps its password login.
[bootstrap.files."/etc/ssh/sshd_config.d/00-ansiblonomicon.conf"]
content = """
PasswordAuthentication no
KbdInteractiveAuthentication no
"""
owner = "root"
group = "wheel"
mode = "0644"

# Points at Homebrew's opt path, unlike `tailscaled install-system-daemon`, whose copy brew upgrades never reach.
[bootstrap.files."/Library/LaunchDaemons/com.tailscale.tailscaled.plist"]
content = """
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key>
  <string>com.tailscale.tailscaled</string>
  <key>ProgramArguments</key>
  <array>
    <string>/opt/homebrew/opt/tailscale/bin/tailscaled</string>
  </array>
  <key>RunAtLoad</key>
  <true/>
  <key>KeepAlive</key>
  <true/>
  <key>StandardOutPath</key>
  <string>/var/log/tailscaled.log</string>
  <key>StandardErrorPath</key>
  <string>/var/log/tailscaled.log</string>
</dict>
</plist>
"""
owner = "root"
group = "wheel"
mode = "0644"

[tasks.server]
usage = 'flag "-c --check"'
run = '''
set -eu
mode=--yes
[ -z "${usage_check:-}" ] || mode=--dry-run
mise bootstrap --only files,macos-launchd-agents "$mode"
python3 server/reconcile.py ${usage_check:+--check}
[ -z "${usage_check:-}" ] || exit 0
state=$(/opt/homebrew/bin/tailscale status --json | python3 -c 'import json, sys; print(json.load(sys.stdin)["BackendState"])')
if [ "$state" != Running ]; then
  echo "server: Tailscale is $state; enroll once with: sudo tailscale up --hostname=pod153 --advertise-tags=tag:pod153 --ssh" >&2
  exit 1
fi
sudo -n /opt/homebrew/bin/tailscale up --reset --hostname=pod153 --accept-dns=false --accept-routes=false --advertise-tags=tag:pod153 --advertise-routes= --advertise-exit-node=false --exit-node= --exit-node-allow-lan-access=false --report-posture=false --ssh=true
sudo -n /opt/homebrew/bin/tailscale wait --timeout=15s
'''

# Retiring the desktop apps' background jobs; delete these once pod153 converges.
[bootstrap.files."/Users/thurstonsand/Library/LaunchAgents/com.github.domt4.homebrew-autoupdate.plist"]
state = "absent"

