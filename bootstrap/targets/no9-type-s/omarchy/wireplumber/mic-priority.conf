# The default mic is the best one plugged in: Shure, then the laptop's own (2009), then the Arctis headset.
# ALSA ranks every USB mic at 2100, above the laptop's, so the two USB mics are placed explicitly.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Shure_Inc_Shure_MV7.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-SteelSeries_Arctis.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]

wireplumber.components = [
  {
    name = rank-sources-by-priority.lua, type = script/lua
    provides = custom.default-nodes.rank-sources-by-priority
  }
]

wireplumber.profiles = {
  main = {
    custom.default-nodes.rank-sources-by-priority = required
  }
}
