# A locked-up CPU panics and reboots instead of freezing silently, keeping its last kernel messages in EFI variables for the
# next boot, with room for a boot's whole log when a driver floods it.
KERNEL_CMDLINE[default]+=" softlockup_panic=1 nmi_watchdog=panic panic=15 efi_pstore.pstore_disable=0 log_buf_len=16M"
