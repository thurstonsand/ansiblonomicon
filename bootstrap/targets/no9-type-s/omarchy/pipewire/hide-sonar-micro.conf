# Arctis Sound Manager always runs its Sonar Micro EQ and regenerates the chain if it is removed, but nothing here feeds it, so it
# would only ever offer a silent mic. A media class outside Audio/* keeps WirePlumber from making it a session item and
# pipewire-pulse from listing it; Audio/Source/Internal would still be a WirePlumber link target.
# Retire once ASM can turn the micro chain off.
stream.rules = [
  {
    matches = [
      { node.name = "effect_output.sonar-micro-eq" }
    ]
    actions = {
      update-props = {
        media.class = "Unlisted/Audio/Source"
      }
    }
  }
]
