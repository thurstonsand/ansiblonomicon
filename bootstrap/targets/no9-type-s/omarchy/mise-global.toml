[tools]
bun = "latest"
fnox = "latest"
go = "latest"
gofumpt = "latest"
golangci-lint = "latest"
"github:Dygmalab/Bazecor" = { version = "latest", asset_pattern = "Bazecor-*-x64.AppImage", bin = "bazecor" }
"github:steipete/CodexBar" = { version = "latest", asset_pattern = "CodexBarCLI-*-linux-x86_64.tar.gz" }
# First-party release: skip mise's default 24h supply-chain cooling.
"github:thurstonsand/agent-switchboard" = { version = "latest", minimum_release_age = "0s" }
# The .deb's binary runs on the system WebKitGTK as a native Wayland client, so it scales per monitor; the AppImage forces
# XWayland and ships a libwayland-client that breaks Mesa's EGL. Dodosend's in-app updater cannot replace it, so mise upgrades it.
"github:trafargarlaw/dodosend-releases" = { version = "latest", asset_pattern = "Dodosend_*_amd64.deb", bin = "dodosend", postinstall = 'cd "$MISE_TOOL_INSTALL_PATH" && mv dodosend dodosend.deb && bsdtar -xOf dodosend.deb "data.tar.*" | bsdtar -xf - --strip-components 2 usr/bin/dodosend && rm dodosend.deb' }
"github:wimpysworld/sidra" = { version = "latest", asset_pattern = "Sidra-linux-x86_64.AppImage", bin = "sidra" }
node = "lts"
# Official Anomaly package, published with npm provenance; younger than the package-age gate.
# Prune only unused agent-browser versions: another agent may still be running one.
"npm:@opencode/browse" = { version = "latest", allow_low_downloads = true, postinstall = "mise prune --tools npm:agent-browser --yes" }
# Reviewed 2026-10-05: @pierre/theme lost npm provenance when a co-maintainer took
# over publishing at 1.1.0; 2.0.0 is script-free, dependency-free theme JSON.
# Drop the exclusion once @pierre/theme publishes with provenance again; a newer
# unprovenanced release fails the install and needs its own review.
"npm:sideshow" = { version = "latest", allow_low_downloads = true, trust_policy_excludes = ["@pierre/theme@2.0.0"] }
"npm:tuistory" = "latest"
pnpm = { version = "latest", postinstall = 'rm -f "$MISE_TOOL_INSTALL_PATH/pn"' }
uv = "latest"

[env]
# mise owns upgrades; Browse's npm updater would install outside its tool directory.
OPENCODE_BROWSER_AUTO_UPDATE = "off"
