[packages]
1password = "present"
1password-cli = "present"
chromium = "absent"
cliamp = "absent"
cloudflared = "present"
direnv = "present"
flea = "present"
ghostty = "present"
git-delta = "present"
illuminanced = "present"
jujutsu = "present"
kdenlive = "absent"
lilv-tools = "present"
lsp-plugins-lv2 = "present"
minisign = "present"
nautilus = "absent"
nautilus-python = "absent"
obs-studio = "absent"
obsidian = "absent"
omarchy-zsh = "absent"
omazed = "present"
openbsd-netcat = "present"
openai-codex-desktop = "present"
papers = "absent"
pinta = "absent"
rust = "present"
superwhisper-bin = "present"
sushi = "absent"
tigervnc = "present"
"webkitgtk-6.0" = "absent"
wev = "present"
xournalpp = "absent"
zed = "present"
zsh-autosuggestions = "absent"

# Kdenlive used to retain these optional libraries; pinentry-qt and qv4l2 link them directly.
kguiaddons = "present"
kwindowsystem = "present"
qt6-5compat = "present"

# wl-paste uses this for MIME type inference; it is optional to pacman.
mailcap = "present"

# What omarchy-setup-security-fingerprint installed for the Goodix reader.
fprintd = "present"
libfprint-git = "present"
usbutils = "present"

# Omarchy install/hardware/nvidia.sh: Turing eGPU with GSP firmware.
lib32-nvidia-utils = "present"
libva-nvidia-driver = "present"
nvidia-open-dkms = "present"
nvidia-utils = "present"

# Arctis Sound Manager, from its own repository in mise.omarchy-loadout.toml, and its ClearCast mic noise suppression.
arctis-sound-manager = "present"
# Optional to pacman, required by Arctis clip capture's Opus encoder.
gst-plugins-base = "present"
noise-suppression-for-voice = "present"

[aur]
amp-desktop-bin = "present"
beeper-bin = "present"
google-chrome = "present"

[themes]
fire-and-shadow = { source = "https://github.com/mattbbia/fire-and-shadow.git" }
ghost-pastel = { source = "https://github.com/row-huh/omarchy-ghost-pastel-theme.git" }
sakura-mochi = { source = "https://github.com/OldJobobo/omarchy-sakura-mochi-theme.git" }

[plugins]
"io.github.sohanemon.auto-suspend" = { source = "https://github.com/sohanemon/omarchy-auto-suspend.git" }
"io.github.wouldja.mouse" = { source = "https://github.com/wouldja/omarchy-mouse.git" }
