# What omarchy-setup-security-fingerprint installed for the Goodix reader.
[packages]
fprintd = "present"
libfprint-git = "present"
usbutils = "present"

# Omarchy install/hardware/nvidia.sh: Turing eGPU with GSP firmware.
lib32-nvidia-utils = "present"
libva-nvidia-driver = "present"
nvidia-open-dkms = "present"
nvidia-utils = "present"

# Arctis Sound Manager's ClearCast mic noise suppression.
noise-suppression-for-voice = "present"

# The signed pacman repo would not survive `omarchy refresh pacman`, which rewrites /etc/pacman.conf.
[aur]
arctis-sound-manager = "present"
