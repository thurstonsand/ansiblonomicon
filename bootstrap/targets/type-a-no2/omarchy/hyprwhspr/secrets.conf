# The cleanup hook inherits the daemon environment and needs the provider keys.
[Service]
# systemd otherwise names the journal lines after the ExecStart binary, fnox-host.
SyslogIdentifier=hyprwhspr
# An empty ExecStart= clears the packaged command; systemd rejects a second one otherwise.
ExecStart=
ExecStart=%h/.local/bin/fnox-host exec --secret CEREBRAS_API_KEY --secret CLI_PROXY_API_KEY -- /usr/lib/hyprwhspr/bin/hyprwhspr
