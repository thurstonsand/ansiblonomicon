# The erijl.lock plugin's security-key lock service, matching what its own `setup` writes. Its `setup` can't
# run as the loadout hook: the doctor it ends with fails while the freshly cloned plugin is still disabled.
[bootstrap.files."/etc/pam.d/omarchy-lock-fido2"]
source = "omarchy/pam.d/omarchy-lock-fido2"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/sudoers.d/ansiblonomicon"]
source = "omarchy/sudoers.d/ansiblonomicon"
owner = "root"
group = "root"
mode = "0440"

[bootstrap.files."/etc/pam.d/sudo-unattended"]
source = "omarchy/pam.d/sudo-unattended"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/local/libexec/sudo-unattended-notify"]
source = "omarchy/libexec/sudo-unattended-notify"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.repos]
"~/.local/share/omarchy-icloud-photos" = { url = "https://github.com/jankeesvw/omarchy-icloud-photos.git", ref = "main" }

# install.sh is idempotent and upstream asks for a rerun after every pull; icloudpd comes from the loadout's AUR package.
[bootstrap.hooks.post-repos]
run = "~/.local/share/omarchy-icloud-photos/install.sh"

[dotfiles]
"~/.config/hypr/monitors.lua" = { source = "omarchy/hypr/monitors.lua", mode = "symlink" }
"~/.config/hypr/input.lua" = { source = "omarchy/hypr/input.lua", mode = "symlink" }
"~/.config/hypr/hyprland.lua" = { source = "omarchy/hypr/hyprland.lua", mode = "symlink" }
"~/.config/hypr/bindings.lua" = { source = "omarchy/hypr/bindings.lua", mode = "symlink" }
"~/.config/hypr/looknfeel.lua" = { source = "omarchy/hypr/looknfeel.lua", mode = "symlink" }
"~/.config/hypr/autostart.lua" = { source = "omarchy/hypr/autostart.lua", mode = "symlink" }
"~/.config/hypr/hyprsunset.conf" = { source = "omarchy/hypr/hyprsunset.conf", mode = "symlink" }
"~/.config/hypr/xdph.conf" = { source = "omarchy/hypr/xdph.conf", mode = "symlink" }
"~/.config/hypr/.luarc.json" = { source = "omarchy/hypr/.luarc.json", mode = "symlink" }
"~/.config/omarchy/shell.json" = { source = "omarchy/shell.json", mode = "symlink" }
"~/.config/omarchy/sandman.json" = { source = "omarchy/sandman.json", mode = "symlink" }
"~/.config/omarchy/extensions/omarchy-menu.jsonc" = { source = "omarchy/extensions/omarchy-menu.jsonc", mode = "symlink" }
"~/.config/omarchy/branding/about.txt" = { source = "omarchy/branding/about.txt", mode = "symlink" }
"~/.config/omarchy/branding/screensaver.txt" = { source = "omarchy/branding/screensaver.txt", mode = "symlink" }
# omarchy-theme-bg-next compares unresolved paths against bg-set's realpath, so a symlink stalls cycling.
"~/.config/omarchy/backgrounds/solitude/wallhaven-odq5ml.jpg" = { source = "omarchy/backgrounds/solitude/wallhaven-odq5ml.jpg", mode = "copy" }
"~/.config/omarchy/backgrounds/solitude/wallhaven-y83x8g.jpg" = { source = "omarchy/backgrounds/solitude/wallhaven-y83x8g.jpg", mode = "copy" }
"~/.config/omarchy/defaults/agent" = { source = "omarchy/default-agent", mode = "symlink" }
# Omarchy 4.0.4 registers its bundled extensions' native hosts for Brave-Browser but not Brave-Origin.
# Retire once a release ships basecamp/omarchy#10292, which registers them itself.
"~/.config/BraveSoftware/Brave-Origin/NativeMessagingHosts/com.omarchy.copy_url.json" = { source = "~/.config/BraveSoftware/Brave-Browser/NativeMessagingHosts/com.omarchy.copy_url.json", mode = "symlink" }
"~/.config/BraveSoftware/Brave-Origin/NativeMessagingHosts/com.omarchy.ytdlp.json" = { source = "~/.config/BraveSoftware/Brave-Browser/NativeMessagingHosts/com.omarchy.ytdlp.json", mode = "symlink" }
# CodexBar replaces this file on save, which would break a symlink.
"~/.config/codexbar/config.json" = { source = "omarchy/codexbar/config.json", mode = "copy" }
"~/.local/share/applications/Amp.desktop" = { source = "omarchy/applications/Amp.desktop", mode = "symlink" }
"~/.local/share/icons/hicolor/256x256/apps/amp.png" = { source = "omarchy/icons/amp.png", mode = "symlink" }
