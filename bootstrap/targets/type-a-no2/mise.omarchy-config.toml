[bootstrap.repos]
"~/.local/share/omarchy-icloud-photos" = { url = "https://github.com/jankeesvw/omarchy-icloud-photos.git", ref = "main" }

# install.sh is idempotent and upstream asks for a rerun after every pull; icloudpd comes from the loadout's AUR package.
[bootstrap.hooks.post-repos]
run = "~/.local/share/omarchy-icloud-photos/install.sh"

[dotfiles]
"~/.config/hypr/monitors.lua" = { source = "omarchy/hypr/monitors.lua", mode = "symlink" }
