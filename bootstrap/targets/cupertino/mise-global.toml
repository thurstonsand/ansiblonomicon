[tools]
# First-party release: skip mise's default 24h supply-chain cooling.
"github:thurstonsand/imsgbus" = { version = "0.2.12", minimum_release_age = "0s" }
# imsgbus speaks imsg's 0.x RPC, so imsg upgrades deliberately, together with imsgbus.
# Fork release of 0.21.0 with openclaw/imsg#391, which delivers tracked sends to SMS and RCS chats; back to
# openclaw/imsg once a release carries it.
"github:thurstonsand/imsg" = { version = "0.21.0-guid.1", minimum_release_age = "0s" }
"github:grafana/alloy" = { version = "1.21.3", rename_exe = "alloy" }

[settings]
# The LaunchAgents run tools through shims. A shim that installs a newly pinned version itself, before the
# bootstrap's tools step does, reshims from inside the shim and leaves every shim a link to itself.
auto_install = false
not_found_auto_install = false
