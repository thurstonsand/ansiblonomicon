min_version = "2026.8.12"

[bootstrap.remote]
exclude = [".env", "*.local.*"]

[bootstrap.remote.hosts.cupertino]
host = "cupertino"
user = "admin"
source = "targets/cupertino"
mise_env = ["system", "imsgbus", "log-shipping"]
ssh_options = ["SendEnv=IMSGBUS_*"]
remote_mise = "/Users/admin/.local/bin/mise"

[bootstrap.remote.hosts.udmp]
host = "10.10.20.1"
user = "root"
source = "targets/udmp"
tags = ["network"]
ssh_options = ["SendEnv=NEXTDNS_PROFILE_ID"]
remote_mise = "/usr/local/bin/mise"
