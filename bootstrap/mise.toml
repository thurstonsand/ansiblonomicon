min_version = "2026.8.12"

[bootstrap.remote]
exclude = [".env", "*.local.*"]

[bootstrap.remote.hosts.pod042]
host = "pod042"
user = "thurstonsand"
source = "targets/pod042"
mise_env = ["base", "repositories", "storage", "alerting", "maintenance", "monitoring"]
tags = ["storage"]
remote_mise = "/usr/local/bin/mise"

[bootstrap.remote.hosts.udmp]
host = "10.10.20.1"
user = "root"
source = "targets/udmp"
tags = ["network"]
ssh_options = ["SendEnv=NEXTDNS_PROFILE_ID"]
remote_mise = "/usr/local/bin/mise"
