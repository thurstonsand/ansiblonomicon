<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Lucky</title>
    <style>
      :root {
        --bg: #09090b;
        --ink: #f5f5f2;
        --dim: #6c6c70;
        --faint: #1c1c20;
        --grid: #ffffff08;
        --green: #2ee27a;
        --red: #ff4d5e;
        --gold: #ffcb3d;
        --faded: 0.5;
        --spectrum: linear-gradient(90deg, #ff4d5e, #ff9f43, #ffe66d, #2ee27a, #3ec5ff, #8b6cff, #ff5fd2);
        --sans: "Inter", "Helvetica Neue", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f3f2ee;
          --ink: #0b0b0c;
          --dim: #5c5b57;
          --faint: #e2e1dc;
          --grid: #0000000a;
          --green: #0b9a4c;
          --red: #e0283a;
          --gold: #c08a00;
          --faded: 0.72;
          --spectrum: linear-gradient(90deg, #e0283a, #e8730c, #d9a400, #0b9a4c, #0a8fd1, #6a4cf0, #d42fae);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 22px 56px 0;
        overflow: hidden;
        font: 15px/1.35 var(--sans);
        color: var(--ink);
        background: var(--bg)
          repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px calc((100vw - 112px) / 12))
          56px 0 / calc(100vw - 111px) 100% no-repeat;
      }
      .ahead {
        color: var(--green);
      }
      .behind {
        color: var(--red);
      }
      .gold {
        color: var(--gold);
      }

      #top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font: 12px var(--mono);
        color: var(--dim);
      }
      #esc {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #esc img {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }
      #esc b,
      #top b {
        color: var(--ink);
        font-weight: 600;
      }
      kbd {
        font: 11px var(--mono);
        color: var(--ink);
        border: 1px solid var(--dim);
        border-radius: 4px;
        padding: 1px 6px;
      }

      #field {
        position: relative;
        display: flex;
        align-items: center;
        gap: 22px;
        height: 124px;
        margin-top: 22px;
      }
      #field svg {
        flex: none;
        width: 58px;
        height: 58px;
        margin-top: 6px;
        color: var(--dim);
      }
      #query {
        margin: 0;
        overflow: hidden;
        font: 800 104px/1.1 var(--sans);
        letter-spacing: -0.05em;
        white-space: nowrap;
        animation: rise 160ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      #query::after {
        content: "";
        display: inline-block;
        width: 0.06em;
        height: 0.85em;
        margin-left: 0.04em;
        vertical-align: -0.1em;
        border-radius: 1px;
        background: var(--ink);
        animation: blink 1s steps(1) infinite;
      }
      #field::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 3px;
        border-radius: 2px;
        background: var(--spectrum);
      }

      .rb {
        border: 1.5px solid transparent;
        background:
          linear-gradient(var(--bg), var(--bg)) padding-box,
          var(--spectrum) border-box;
      }
      #note {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 21px;
        margin: 18px 0 0;
        font: italic 500 21px/1 var(--sans);
      }
      #note:empty {
        visibility: hidden;
      }
      #note .chip {
        padding: 6px 10px 5px;
        font: 700 11px/1 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transform: skewX(-12deg);
      }
      #note:not(:empty) {
        animation: slide 200ms cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }

      #race {
        position: relative;
        height: 70px;
        margin-top: 33px;
      }
      #race .track,
      #race .seg {
        position: absolute;
        top: 24px;
        height: 8px;
      }
      #race .track {
        inset-inline: 0;
        border-radius: 4px;
        background: var(--faint);
      }
      #race .seg {
        width: 0;
      }
      #race .a {
        left: 0;
        border-radius: 4px 0 0 4px;
        background: linear-gradient(90deg, var(--green) 55%, var(--gold));
      }
      #race .b {
        border-radius: 0 4px 4px 0;
        background: repeating-linear-gradient(
            -45deg,
            var(--red) 0 6px,
            color-mix(in srgb, var(--red) 55%, var(--bg)) 6px 12px
          )
          0 0 / 17px 17px;
        animation: hazard 500ms linear infinite;
      }
      .behind-pace #race .a {
        opacity: 0.35;
        background: var(--green);
      }
      #race .head {
        position: absolute;
        top: 18px;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border-radius: 50%;
        background: var(--ink);
        --c: var(--green);
        box-shadow:
          0 0 0 4px var(--bg),
          0 0 0 6px var(--c),
          0 0 26px 6px color-mix(in srgb, var(--c) 55%, transparent);
      }
      .behind-pace #race .head {
        --c: var(--red);
      }
      #race .above,
      #race .below {
        position: absolute;
        translate: -50% 0;
        white-space: nowrap;
      }
      #race .above {
        top: 0;
        font: 11px var(--mono);
        color: var(--dim);
      }
      #race .above:empty,
      #race .below:empty {
        display: none;
      }
      #race .above::after {
        content: "";
        display: block;
        width: 2px;
        height: 16px;
        margin: 3px auto 0;
        background: var(--dim);
      }
      #race .last::after {
        width: 14px;
        height: 14px;
        margin-top: 4px;
        border: 2px dashed var(--dim);
        border-radius: 50%;
        background: var(--bg);
      }
      #race .below {
        top: 48px;
        font: 12px var(--mono);
        animation: pop 260ms cubic-bezier(0.2, 1.8, 0.4, 1) both;
      }
      #race .kagi::before {
        content: "";
        display: block;
        width: 2px;
        height: 22px;
        margin: -26px auto 4px;
        background: currentColor;
      }
      #race .delta {
        font-weight: 700;
      }
      #race .end {
        position: absolute;
        top: 48px;
        font: 10px var(--mono);
        color: var(--dim);
        opacity: 0.7;
      }

      #results {
        width: min(900px, calc(100vw - 400px));
        margin: 24px 0 0;
        padding: 0;
        list-style: none;
      }
      #results li {
        position: relative;
        display: grid;
        grid-template-columns: 44px 38px minmax(0, 1fr);
        align-items: center;
        height: 36px;
        border-top: 1px solid var(--faint);
        white-space: nowrap;
      }
      #results .n {
        font: 13px var(--mono);
        color: var(--dim);
      }
      #results img {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }
      #results .line {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      #results a {
        overflow: hidden;
        text-overflow: ellipsis;
        font: 500 22px/1.2 var(--sans);
        letter-spacing: -0.015em;
        color: inherit;
        text-decoration: none;
      }
      #results .host {
        flex: none;
        font: 14px var(--mono);
        color: var(--dim);
      }
      #results .tag {
        flex: none;
        padding: 6px 12px 7px;
        border-radius: 999px;
        font: italic 600 14px/1 var(--sans);
        animation: pop 300ms cubic-bezier(0.2, 1.8, 0.4, 1) both;
      }
      #results li.filled {
        opacity: var(--faded);
        animation: arrive 140ms ease-out both;
      }
      #results li.tagged,
      .lingering #results li.filled {
        opacity: 1;
      }
      .lingering #results a:hover {
        text-decoration: underline;
      }
      #results li.pending::after {
        content: "";
        position: absolute;
        left: 82px;
        top: 11px;
        width: var(--w);
        height: 14px;
        border-radius: 4px;
        background: linear-gradient(
            90deg,
            var(--faint) 30%,
            color-mix(in srgb, var(--ink) 14%, var(--faint)) 50%,
            var(--faint) 70%
          )
          0 0 / 300% 100%;
        animation: shimmer 1.1s linear infinite;
      }
      #results li.pending .n::after {
        content: "";
        position: absolute;
        left: 44px;
        top: 7px;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--faint);
      }

      #status {
        margin: 1rem 0 0;
        white-space: pre-wrap;
        color: var(--red);
      }
      #clock {
        position: fixed;
        right: 56px;
        bottom: 30px;
        margin: 0;
        font: 700 200px/0.8 var(--sans);
        letter-spacing: -0.06em;
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: var(--green);
      }
      .behind-pace #clock {
        color: var(--red);
      }
      #clock small {
        font-size: 96px;
        letter-spacing: -0.04em;
      }
      #clock i {
        margin: 0 0.02em 0 0.06em;
        font-style: normal;
        letter-spacing: 0;
      }

      @keyframes rise {
        from {
          opacity: 0;
          translate: 0 10px;
        }
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @keyframes slide {
        from {
          opacity: 0;
          translate: -24px 0;
        }
      }
      @keyframes hazard {
        to {
          background-position: 17px 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          scale: 0.5;
        }
      }
      @keyframes arrive {
        from {
          opacity: 0;
          translate: 0 4px;
        }
      }
      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0 0;
        }
      }
    </style>
    <script type="module" src="go.js"></script>
  </head>
  <body>
    <header id="top">
      <span id="esc"><kbd>esc</kbd>→<img alt="" src="kagi.png" /><b>kagi</b></span>
      <span><b>lucky%</b> · any% glitchless</span>
    </header>
    <div id="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="M15.5 15.5 21 21" />
      </svg>
      <h1 id="query"></h1>
    </div>
    <p id="note"></p>
    <div id="race">
      <div class="track"></div>
      <div class="seg a"></div>
      <div class="seg b"></div>
      <span class="above avg"></span>
      <span class="above last"></span>
      <span class="below kagi"></span>
      <div class="head"></div>
      <span class="below delta behind"></span>
      <span class="end" style="left: 0">0</span>
      <span class="end scale" style="right: 0"></span>
    </div>
    <ol id="results"></ol>
    <p id="status"></p>
    <p id="clock"></p>
  </body>
</html>
