    gpt_sol:
      version: "gpt-6.1-sol"
      display_name: "GPT 6.1 Sol"
      # Check current subscription-backed limits with:
      # codex debug models | jq -r '.models[] | select(.slug=="gpt-6.1-sol") | {slug, context_window, max_context_window, effective_context_window_percent}'
      max_input: 272000
      max_output: 128000
      vision: true
      agent_harness:
        aliases:
          pi: "openai/gpt-6.1-sol"
      vscode:
        include: true
        thinking: true
      zed: true
      variants:
        medium:
          id: "gpt-6.1-sol(medium)"
          display_name: "GPT 6.1 Sol Medium"
          vscode: true
        high:
          id: "gpt-6.1-sol(high)"
          display_name: "GPT 6.1 Sol High"
          vscode: true
          zed: true
        xhigh:
          id: "gpt-6.1-sol(xhigh)"
          display_name: "GPT 6.1 Sol XHigh"
          vscode: true

    gpt_luna:
