# Centralized Model Configuration
# ================================
# Single source of truth for all model definitions across:
# - Native agent-harness and editor-config renderers
#
# Update model versions here; all consumers reference this file.
---
models:
  # ===========================================================================
  # ANTHROPIC
  # ===========================================================================
  anthropic:
    fable:
      version: "claude-fable-5-1[1m]"
      display_name: "Claude Fable 5.1"
      max_input: 1000000
      max_output: 64000
      vision: true
      agent_harness:
        aliases:
          claude: "claude-fable-5-1[1m]"
          pi: "doppelclaude/claude-fable-5-1"
      vscode:
        include: true
        thinking: true
      zed: true

    opus:
      version: "claude-opus-5-5"
      display_name: "Claude Opus 5.5"
      max_input: 1000000
      max_output: 128000
      vision: true
      supports_temperature: false
      agent_harness:
        aliases:
          claude: "opus[1m]"
          pi: "doppelclaude/claude-opus-5-5"
      vscode:
        include: true
        thinking: true
      zed: true

    sonnet:
