# The mirror carries only part of the shared public package lists, so work
# replaces them rather than extending them.
[inventory]
replace_shared = true

[tools.node]
version = "lts"

[tools.golangci-lint]
version = "latest"

[tools.pnpm]
version = "latest"
postinstall = 'rm -f "$MISE_TOOL_INSTALL_PATH/pn"'

# First-party release: skip mise's default 24h supply-chain cooling.
[tools."github:thurstonsand/agent-switchboard"]
version = "latest"
minimum_release_age = "0s"

[npm]
packages = []
allow_scripts = []

[go]
packages = []

[uv]
packages = ["basedpyright"]
retired = []

# The registry lacks glimpseui, so the interview tool resolves Pi's git clone
# through the global npm root. Relinked after each Node change.
[npm.links]
glimpseui = ".pi/agent/git/github.com/hazat/glimpse"
