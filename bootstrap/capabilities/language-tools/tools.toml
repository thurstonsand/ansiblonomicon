# Shared Mac language-tool inventory. Tool names are keys so reconciliation can
# install/upgrade only this declared set rather than every global mise tool.
# The Omarchy laptops declare the same set in their global mise config
# (bootstrap/capabilities/omarchy/files/mise-global.toml), the Omarchy-native path.
[tools.node]
version = "lts"

[tools.npm]
version = "latest"

[tools.golangci-lint]
version = "latest"

[tools.fnox]
version = "latest"

# First-party release: skip mise's default 24h supply-chain cooling.
[tools."github:thurstonsand/agent-switchboard"]
version = "latest"
minimum_release_age = "0s"

[npm]
packages = [
  "@earendil-works/pi-coding-agent",
  "agent-browser",
  "hunkdiff",
  "sideshow",
  "tuistory",
]
allow_scripts = ["agent-browser"]

[go]
packages = [
  "mvdan.cc/gofumpt@latest",
]

[uv]
packages = []
