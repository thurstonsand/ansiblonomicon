[Unit]
StartLimitIntervalSec=0

# Process and resource settings from the unit `t3 service install` rendered (renderBootServiceUnit in
# apps/server/src/cloud/bootService.ts): the server outranks its own agents and helpers under pressure.
[Service]
Environment=PATH=%h/.local/bin:%h/.amp/bin:%h/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin
Environment=NPM_CONFIG_USERCONFIG=%h/.config/t3code/npmrc
Restart=always
RestartSec=30
KillMode=mixed
OOMPolicy=continue
CPUWeight=1000
IOWeight=1000
MemoryLow=1536M
OOMScoreAdjust=100
ManagedOOMPreference=avoid
