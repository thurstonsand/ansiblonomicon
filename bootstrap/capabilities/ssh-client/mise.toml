[bootstrap.directories."~/.ssh"]
mode = "0700"

[bootstrap.directories."~/.local/libexec"]
mode = "0755"

[bootstrap.files."~/.ssh/config"]
source = "ssh-client/config.tera"
template = true
mode = "0644"

[dotfiles]
"~/.ssh/pod153.known_hosts" = { source = "ssh-client/pod153.known_hosts", mode = "symlink" }
"~/.local/libexec/ssh-smart-proxy" = { source = "ssh-client/ssh-smart-proxy.tera", mode = "template" }
