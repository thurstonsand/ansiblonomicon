# Starship prompt configuration
# https://starship.rs/config/

[hostname]
disabled = false
ssh_only = true
ssh_symbol = "󰣀 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold purple"

[username]
disabled = true

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold yellow"                                                                                 # Style for non-repo path
repo_root_style = "bold yellow"                                                                       # Style for repo path
before_repo_root_style = "dimmed cyan"                                                                # Style for path before repo
format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) "

[nix_shell]
format = "env [$symbol$state]($style) "
symbol = "❄️ "
pure_msg = "pure"
impure_msg = "dev"
style = "bold blue"

[gcloud]
disabled = true

[git_branch]
format = "[$branch]($style) "

[git_status]
format     = '[$all_status]($style)'
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
