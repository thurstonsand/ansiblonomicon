# Solitude Light (Generated by bootstrap/capabilities/terminal-theme/solitude/render.py)
set -g window-style "bg=#ecf1f4"
set -g window-active-style "bg=#ecf1f4"
set -g pane-border-style "fg=#8c9092"
set -g pane-active-border-style "fg=#646c70"
set -g status-style "bg=#e0e5e8,fg=#646c70,nobold,noitalics,nounderscore"
set -g status-left-length 80
set -g status-right-length 80
set -g status-left '#[bg=#646c70,fg=#ecf1f4,bold,noitalics,nounderscore] #{session_name} #[bg=#d4d9db,fg=#646c70,nobold,noitalics,nounderscore] '
set -g window-status-separator '#[bg=#d4d9db,fg=#d4d9db]  '
set -g window-status-format '#[bg=#d4d9db,fg=#696c6d,nobold,noitalics,nounderscore]#W#[bg=#d4d9db]#{?window_end_flag, ,}#[bg=#e0e5e8,fg=#d4d9db,nobold,noitalics,nounderscore]#{?window_end_flag,,}'
set -g window-status-current-format '#[bg=#d4d9db,fg=#a52b0c,nobold,noitalics,nounderscore]#W#[bg=#d4d9db]#{?window_end_flag, ,}#[bg=#e0e5e8,fg=#d4d9db,nobold,noitalics,nounderscore]#{?window_end_flag,,}'
set -g status-right '#[bg=#e0e5e8,fg=#646c70,nobold,noitalics,nounderscore]#[bg=#646c70,fg=#ecf1f4,bold,noitalics,nounderscore] #h '
