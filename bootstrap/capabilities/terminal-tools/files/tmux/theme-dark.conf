# City Ruins (Generated by bootstrap/capabilities/terminal-theme/city-ruins/render.py)
set -g window-style "bg=#101315"
set -g window-active-style "bg=#101315"
set -g pane-border-style "fg=#696c6d"
set -g pane-active-border-style "fg=#9cc4dd"
set -g status-style "bg=#1b1e20,fg=#9cc4dd,nobold,noitalics,nounderscore"
set -g status-left-length 80
set -g status-right-length 80
set -g status-left '#[bg=#9cc4dd,fg=#101315,bold,noitalics,nounderscore] #{session_name} #[bg=#26292b,fg=#9cc4dd,nobold,noitalics,nounderscore] '
set -g window-status-separator '#[bg=#26292b,fg=#26292b]  '
set -g window-status-format '#[bg=#26292b,fg=#8b8d8e,nobold,noitalics,nounderscore]#W#[bg=#26292b]#{?window_end_flag, ,}#[bg=#1b1e20,fg=#26292b,nobold,noitalics,nounderscore]#{?window_end_flag,,}'
set -g window-status-current-format '#[bg=#26292b,fg=#de6145,nobold,noitalics,nounderscore]#W#[bg=#26292b]#{?window_end_flag, ,}#[bg=#1b1e20,fg=#26292b,nobold,noitalics,nounderscore]#{?window_end_flag,,}'
set -g status-right '#[bg=#1b1e20,fg=#9cc4dd,nobold,noitalics,nounderscore]#[bg=#9cc4dd,fg=#101315,bold,noitalics,nounderscore] #h '
