[settings.task]
source_freshness_hash_contents = true

[tasks.claude-code]
run = 'software/install-official claude-code "$HOME/.local/bin/claude" https://claude.ai/install.sh ${SOFTWARE_CHECK:+--check}'

[tasks.cua-driver]
run = '''
set -eu
cua="$HOME/.local/bin/cua-driver"
software/install-official cua-driver "$cua" https://cua.ai/driver/install.sh ${SOFTWARE_CHECK:+--check} --no-modify-path
[ -x "$cua" ] || exit 0
if [ -n "${SOFTWARE_CHECK:-}" ]; then
  "$cua" update
  exit 0
fi
"$cua" update --apply
# The pack feeds the agent-harness catalogue; its own agent links would bypass profile scoping.
"$cua" skills update
"$cua" skills uninstall
'''

[tasks.t3]
run = '''
set -eu
release=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/pingdotgg/t3code/releases/latest)
version=${release##*/v}
if [ "$(readlink "$HOME/.local/bin/t3" || true)" = "$HOME/.t3/runtime/versions/$version/t3" ]; then
  exit 0
fi
if [ -n "${SOFTWARE_CHECK:-}" ]; then
  echo "t3 would be installed: $version" >&2
  exit 0
fi
curl -fsSL https://t3.codes/install.sh | T3CODE_VERSION="$version" sh
'''

[tasks.berkeley-mono]
run = 'python3 software/berkeley_mono.py ${SOFTWARE_CHECK:+--check}'

[tasks.docker-context]
run = 'python3 software/docker_context.py ${SOFTWARE_CHECK:+--check}'

[tasks."shp:deps"]
run = 'python3 software/deps-maintenance.py "{{config_root}}/../../capabilities/software/sources/shp" "$HOME/.cache/ansiblonomicon/shp/upgrade.stamp" ${SOFTWARE_CHECK:+--check}'

[tasks."uvc-util:repo"]
run = 'python3 software/uvc-repo.py "$HOME/.local/opt/uvc-util" --origin "$UVC_UTIL_ORIGIN" ${SOFTWARE_CHECK:+--check}'

[tasks."uvc-util:files"]
run = '''
set -eu
if [ -n "${SOFTWARE_CHECK:-}" ]; then
  mise bootstrap --only dotfiles --force-dotfiles --dry-run
  if [ -f "$HOME/.local/opt/uvc-util/configure_camera.py" ]; then
    :
  else
    echo "configure_camera.py link would be reconciled after file deployment" >&2
  fi
  exit 0
fi
mise bootstrap --only dotfiles --force-dotfiles --yes
'''

[tasks."uvc-util"]
sources = ["{{env.HOME}}/.local/opt/uvc-util/src/*.m", "{{env.HOME}}/.local/opt/uvc-util/src/*.h"]
outputs = ["{{env.HOME}}/.local/opt/uvc-util/src/uvc-util"]
run = 'set -eu; cd "$HOME/.local/opt/uvc-util/src"; gcc -o uvc-util -framework IOKit -framework Foundation uvc-util.m UVCController.m UVCType.m UVCValue.m'
