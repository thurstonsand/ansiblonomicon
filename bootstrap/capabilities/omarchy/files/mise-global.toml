[tools]
"aqua:modem-dev/hunk" = "latest"
bun = "latest"
claude = "latest"
codex = "latest"
fnox = "latest"
gh = "latest"
go = "latest"
gofumpt = "latest"
golangci-lint = "latest"
"github:Dygmalab/Bazecor" = { version = "latest", asset_pattern = "Bazecor-*-x64.AppImage", bin = "bazecor" }
"github:steipete/CodexBar" = { version = "latest", asset_pattern = "CodexBarCLI-*-linux-x86_64.tar.gz" }
# First-party release: skip mise's default 24h supply-chain cooling.
"github:thurstonsand/agent-switchboard" = { version = "latest", minimum_release_age = "0s" }
"github:wimpysworld/sidra" = { version = "latest", asset_pattern = "Sidra-linux-x86_64.AppImage", bin = "sidra" }
node = "lts"
"npm:agent-browser" = "latest"
# Reviewed 2026-10-05: @pierre/theme lost npm provenance when a co-maintainer took
# over publishing at 1.1.0; 2.0.0 is script-free, dependency-free theme JSON.
# Drop the exclusion once @pierre/theme publishes with provenance again; a newer
# unprovenanced release fails the install and needs its own review.
"npm:sideshow" = { version = "latest", allow_low_downloads = true, trust_policy_excludes = ["@pierre/theme@2.0.0"] }
"npm:tuistory" = "latest"
pi = "latest"
"pipx:nurb" = "latest"
pnpm = { version = "latest", postinstall = 'rm -f "$MISE_TOOL_INSTALL_PATH/pn"' }
uv = "latest"

[settings.upgrade]
auto_prune = false
