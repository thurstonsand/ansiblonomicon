# AI Gateway Proxy Worker - routes through Cloudflare AI Gateway
#
# aig.thurstons.house → Worker → AI Gateway → custom-cli-proxy-api → cli-proxy-api tunnel
#
# AI Gateway provides: analytics, logging, caching, rate limiting
# This is an experiment before potentially promoting to llms.thurstons.house

name = "aig"
main = "worker.js"
compatibility_date = "2025-12-30"
account_id = "f052696250a2530e9afce0df33177b65"

# Custom Domain
routes = [
  { pattern = "aig.thurstons.house", custom_domain = true }
]

# Plain text bindings
[vars]
ACCOUNT_ID = "f052696250a2530e9afce0df33177b65"
GATEWAY_ID = "llms"
# Auth index for Codex OAuth credentials in cli-proxy-api (see /management.html)
# First credential is "codex-0", second is "codex-1", etc.
CODEX_AUTH_INDEX = "codex-0"

# Secrets (set via wrangler secret put):
# - API_KEY: Your LLM API key for client auth
# - AIG_TOKEN: AI Gateway authentication token
# - CF_ACCESS_CLIENT_ID: Service token for Access bypass
# - CF_ACCESS_CLIENT_SECRET: Service token secret
# - CLI_PROXY_API_ADMIN_KEY: Management API key for cli-proxy-api (for /v1/responses/compact proxy)

# Observability settings
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
