# AI Gateway Proxy Worker - routes through Cloudflare AI Gateway
#
# aig.thurstons.house → Worker → AI Gateway → custom-cli-proxy-api → cli-proxy-api tunnel
#
# AI Gateway provides: analytics, logging, caching, rate limiting
# This is an experiment before potentially promoting to llms.thurstons.house

name = "aig"
main = "worker.ts"
compatibility_date = "2025-12-30"
account_id = "f052696250a2530e9afce0df33177b65"

# Custom Domain
routes = [{ pattern = "aig.thurstons.house", custom_domain = true }]

# Plain text bindings
[vars]
ACCOUNT_ID = "f052696250a2530e9afce0df33177b65"
GATEWAY_ID = "llms"

# Analytics Engine binding for custom metrics
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "aig_events"

# Observability settings
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
