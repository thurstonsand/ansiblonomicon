# Static data available in all templates as .variableName
#
# Code editor configuration - change codeEditor to switch editors
# This controls both ~/.local/bin/code symlink and duti file associations
#
# | Editor       | Command        |
# |--------------|----------------|
# | VS Code      | code           |
# | VS Code Ins. | code-insiders  |
# | Cursor       | cursor         |
# | Windsurf     | windsurf       |
# | Zed          | zed            |
#
codeEditor = "code"

# Font configuration - centralized for all apps
# Store full variant names so templates don't need to append suffixes
[fonts]
mono = "BerkeleyMono Nerd Font Mono"   # Terminal / monospace contexts (nerd font patched)
propo = "BerkeleyMono Nerd Font Mono"  # Editor / UI contexts
size = 13
