# Font configuration - centralized for all apps
# Store full variant names so templates don't need to append suffixes
[fonts]
mono = "BerkeleyMono Nerd Font Mono"  # Terminal / monospace contexts (nerd font patched)
propo = "BerkeleyMono Nerd Font Mono" # Editor / UI contexts
size = 13
