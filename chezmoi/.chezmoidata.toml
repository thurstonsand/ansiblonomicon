# Static data available in all templates as .variableName

# Defaults for machine-local overrides (see .chezmoidata/local.toml)
goLocalImports = ""
goplsBuildFlags = ""
scm = []
pypiIndex = []
mcp_servers = []
pi_mcp_json = []
uvIndexStrategy = ""
anthropicAuthToken = ""
anthropicBaseUrl = ""
inferenceBudgetUrl = ""
costsDashboardUrl = ""
jiraBrowseUrl = ""
