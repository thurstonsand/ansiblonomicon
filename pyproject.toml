[project]
name = "ansiblonomicon"
version = "0.1.0"
description = "Ansible configuration for macOS systems"
requires-python = ">=3.14"
# requests is community.docker's HTTP client: pod042 runs its playbook against
# this venv, so the docker modules import it from here.
dependencies = [
    "ansible>=12.3.0",
    "httpx>=0.28.1",
    "requests>=2.32.3",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
  "ansible-lint>=25.12.1",
  "ruff>=0.11.7",
  "basedpyright>=1.31.7",
  "mypy>=1.19.1",
  "json-with-comments>=1.2.10",
  "pytest>=9.0.2",
  "tomlkit>=0.13.2",
]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv", ".git", "build", "stubs"]

[tool.ruff.per-file-target-version]
"bootstrap/targets/pod042/**/*.py" = "py313"
"scripts/fnox_host.py" = "py313"
"scripts/pod042_reconcile.py" = "py313"
"scripts/pod042_service_token.py" = "py313"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line too long (handled by line-length)
]

[tool.ruff.lint.per-file-ignores]
# Ansible modules have DOCUMENTATION before imports (required structure)
"ansible/collections/**/modules/*.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Basedpyright configuration
[tool.basedpyright]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  ".venv",
  "build",
  "dist",
  "stubs",
  # Research prototypes import tools this repo deliberately does not depend on, so
  # every import is unresolvable here by design. Judging them is the trial's job.
  "docs/wayfinding/**/prototypes",
]
# Ansible filter plugins aren't proper Python packages; this lets tests import them
extraPaths = ["ansible/roles/agent_harness/filter_plugins"]
stubPath = "stubs"
typeCheckingMode = "strict"
pythonVersion = "3.14"
pythonPlatform = "Linux"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[[tool.basedpyright.executionEnvironments]]
root = "bootstrap/targets/pod042"
pythonVersion = "3.13"
extraPaths = ["bootstrap/targets/pod042/maintenance"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["ansible/roles/agent_harness/tests", "tests"]
addopts = "-ra -q --tb=short --strict-markers"
filterwarnings = ["error"]
markers = ["unit: marks tests as unit tests (fast, no external dependencies)"]
