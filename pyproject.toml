[project]
name = "ansiblonomicon"
version = "0.1.0"
description = "Ansible configuration for macOS systems"
requires-python = ">=3.14"
dependencies = ["ansible>=12.3.0"]

[tool.poe.tasks.lint]
help = "Lint all code (ansible + python)"
sequence = ["lint:ansible", "lint:python"]

[tool.poe.tasks."lint:ansible"]
cmd = "ansible-lint"
cwd = "ansible"

[tool.poe.tasks."lint:python"]
sequence = ["lint:ruff", "lint:types"]

[tool.poe.tasks."lint:ruff"]
cmd = "ruff check ansible/collections/"

[tool.poe.tasks."lint:types"]
cmd = "basedpyright"

[tool.poe.tasks.local]
help = "Run the local ansible playbook (pass --check for dry-run, --tags for specific tags)"
cmd = "op run --env-file=.env.op -- ansible-playbook -i inventory playbooks/local.yml ${check:+--check} ${tags:+--tags ${tags}}"
cwd = "ansible"

[[tool.poe.tasks.local.args]]
name = "check"
type = "boolean"
options = ["--check", "-c"]
help = "Dry-run mode (no changes made)"

[[tool.poe.tasks.local.args]]
name = "tags"
options = ["--tags", "-t"]
help = "Only run tasks with these tags (comma-separated)"

[tool.poe.tasks.truenas]
help = "Run the TrueNAS ansible playbook (pass --check for dry-run, --tags for specific tags)"
cmd = "op run --env-file=.env.op -- ansible-playbook -i inventory playbooks/truenas.yml ${check:+--check} ${tags:+--tags ${tags}}"
cwd = "ansible"

[[tool.poe.tasks.truenas.args]]
name = "check"
type = "boolean"
options = ["--check", "-c"]
help = "Dry-run mode (no changes made)"

[[tool.poe.tasks.truenas.args]]
name = "tags"
options = ["--tags", "-t"]
help = "Only run tasks with these tags (comma-separated)"

# Chezmoi tasks
[tool.poe.tasks.cz-diff]
help = "Show what chezmoi would change (source → home)"
cmd = "chezmoi diff"

[tool.poe.tasks.cz-status]
help = "Show files that differ between source and home"
cmd = "chezmoi status"

[tool.poe.tasks.cz-re-add]
help = "Update source from local changes (dry-run unless --apply)"
shell = "if [ \"$apply\" = \"true\" ]; then chezmoi re-add; else chezmoi re-add --dry-run; fi"

[[tool.poe.tasks.cz-re-add.args]]
name = "apply"
type = "boolean"
options = ["--apply", "-a"]
help = "Actually apply changes (default: dry-run)"

[tool.poe.tasks.cz-managed]
help = "List all files managed by chezmoi"
cmd = "chezmoi managed"

[tool.poe.tasks.cz-edit]
help = "Edit a managed file in source dir"
cmd = "chezmoi edit"
args = [{ name = "file", positional = true, required = true }]

# Terraform tasks
[tool.poe.tasks.tfi]
help = "Terraform init"
cmd = "op run --env-file=.env.op -- tofu init"
cwd = "terraform/cloudflare"

[tool.poe.tasks.tfp]
help = "Terraform plan"
cmd = "op run --env-file=.env.op -- tofu plan"
cwd = "terraform/cloudflare"

[tool.poe.tasks.tfa]
help = "Terraform apply"
cmd = "op run --env-file=.env.op -- tofu apply"
cwd = "terraform/cloudflare"

# Cloudflare Pages deployment
[tool.poe.tasks.pages-deploy]
help = "Deploy Cloudflare Pages (tesla)"
cmd = "op run --env-file=../../terraform/cloudflare/.env.op -- npx -y wrangler pages deploy"
cwd = "cloudflare-pages/tesla"

# Cloudflare Workers
[tool.poe.tasks.worker-secret]
help = "Set the API_KEY secret for cli-proxy-api Worker (run after tfa)"
shell = "op run --env-file=../.env.op -- sh -c 'echo $LLM_API_KEY | npx -y wrangler secret put API_KEY'"
cwd = "terraform/cloudflare/workers/llms"

[dependency-groups]
dev = [
  "ansible-lint>=25.12.1",
  "poethepoet>=0.38.0",
  "pre-commit>=4.5.1",
  "ruff>=0.11.7",
  "basedpyright>=1.31.7",
  "mypy>=1.19.1",
]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", ".git", "build", "stubs"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line too long (handled by line-length)
]

[tool.ruff.lint.per-file-ignores]
# Ansible modules have DOCUMENTATION before imports (required structure)
"ansible/collections/**/modules/*.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Basedpyright configuration
[tool.basedpyright]
include = ["ansible/collections/ansible_collections/local"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "build", "dist"]
stubPath = "stubs"
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Linux"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
