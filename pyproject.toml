[project]
name = "ansiblonomicon"
version = "0.1.0"
description = "Ansible configuration for macOS systems"
requires-python = ">=3.14"
# requests is community.docker's HTTP client: pod042 runs its playbook against
# this venv, so the docker modules import it from here.
dependencies = ["ansible>=12.3.0", "httpx>=0.28.1", "requests>=2.32.3"]

[tool.poe]
verbosity = -1

[tool.poe.tasks.init-secrets]
help = "Resolve 1Password secrets to .env and worker .dev.vars files (force regenerate)"
shell = "rm -f .env && uv run scripts/init-secrets.py"

[tool.poe.tasks.lint]
help = "Lint all code (ansible + python + workers + pi + amp)"
sequence = ["lint:ansible", "lint:python", "lint:nvim", "lint:workers", "lint:pi", "lint:session-recovery", "lint:amp", "lint:cli-tools"]

[tool.poe.tasks."lint:ansible"]
cmd = "ansible-lint"
cwd = "ansible"

[tool.poe.tasks."lint:python"]
sequence = ["lint:format", "lint:ruff", "lint:types"]

[tool.poe.tasks."lint:format"]
cmd = "ruff format --check ."

[tool.poe.tasks."lint:ruff"]
cmd = "ruff check --fix --unsafe-fixes ."

[tool.poe.tasks."lint:types"]
cmd = "basedpyright"

[tool.poe.tasks."lint:nvim"]
help = "Check Neovim Lua formatting with StyLua"
cmd = "stylua --check ."
cwd = "chezmoi/dot_config/nvim"

[tool.poe.tasks."lint:workers"]
help = "Type-check Cloudflare Workers via wrangler"
sequence = ["lint:workers:aig", "lint:workers:hooks"]

[tool.poe.tasks."lint:workers:aig"]
cmd = "wrangler deploy --dry-run"
cwd = "wrangler/aig"

[tool.poe.tasks."lint:workers:hooks"]
cmd = "wrangler deploy --dry-run"
cwd = "wrangler/hooks"

[tool.poe.tasks."lint:pi"]
help = "Lint and type-check pi extensions (pass --format to apply formatting)"
cmd = "./scripts/pi-lint.sh ${format:+--format}"

[tool.poe.tasks."lint:amp"]
help = "Format, lint, type-check, and test Amp plugins"
cmd = "./scripts/amp-lint.sh ${format:+--format}"

[tool.poe.tasks."lint:session-recovery"]
help = "Lint and type-check the shared session-recovery library + Pi entry"
cmd = "./scripts/session-recovery-lint.sh ${format:+--format}"

[tool.poe.tasks."lint:cli-tools"]
help = "Format, lint, test, and build in-repo CLI tools"
sequence = ["lint:shp", "lint:sessions"]

[tool.poe.tasks."lint:shp"]
cmd = "just check"
cwd = "ansible/roles/shp/files/shp"

[tool.poe.tasks."lint:sessions"]
help = "Format, lint, test, and build the sessions recovery CLI"
cmd = "just check"
cwd = "ansible/roles/sessions/files/sessions"

[[tool.poe.tasks."lint:pi".args]]
name = "format"
type = "boolean"
options = ["--format", "-f"]
help = "Apply Biome formatting/fixes before type-checking"

[[tool.poe.tasks."lint:amp".args]]
name = "format"
type = "boolean"
options = ["--format", "-f"]
help = "Apply Biome formatting/fixes before type-checking"

[[tool.poe.tasks."lint:session-recovery".args]]
name = "format"
type = "boolean"
options = ["--format", "-f"]
help = "Apply Biome formatting/fixes before type-checking"

[tool.poe.tasks.update-deps]
help = "Update every tracked lockfile (python + typescript)"
sequence = ["update-deps:uv", "update-deps:ts"]

[tool.poe.tasks."update-deps:ts"]
help = "Update dependencies for tracked TypeScript agent packages"
cmd = "./scripts/ts-package-deps.sh"

[tool.poe.tasks."update-deps:uv"]
help = "Upgrade the Python lockfile to the newest allowed releases"
shell = """
if [ "$(hostname -s)" = "ML-DFC6YK6VJQ" ]; then
  echo "The work lock is re-resolved against the mirror by 'poe pull'; it already tracks the newest wheel Artifactory serves." >&2
  exit 1
fi
uv lock --upgrade
uv sync --dev
"""
interpreter = "bash"

[tool.poe.tasks.laptop]
help = "Run the correct macOS playbook for this machine (auto-detects work vs personal)"
shell = """
if [[ "$(hostname)" == ML-* ]]; then
  PLAYBOOK=work.yml
else
  PLAYBOOK=macos.yml
fi
ansible-playbook -i inventory/control/macos.ini "playbooks/$PLAYBOOK" --diff ${check:+--check} ${tags:+--tags ${tags}}
"""
cwd = "ansible"

[[tool.poe.tasks.laptop.args]]
name = "check"
type = "boolean"
options = ["--check", "-c"]
help = "Dry-run mode (no changes made)"

[[tool.poe.tasks.laptop.args]]
name = "tags"
options = ["--tags", "-t"]
help = "Only run tasks with these tags (comma-separated)"

[tool.poe.tasks.truenas]
help = "Run the TrueNAS ansible playbook (pass --check for dry-run, --tags for specific tags)"
shell = """
if [[ "$(uname)" == "Darwin" ]]; then
  CTRL=inventory/control/macos.ini
else
  CTRL=inventory/control/linux.ini
fi
ansible-playbook -i inventory/targets -i "$CTRL" playbooks/truenas.yml --diff ${check:+--check} ${tags:+--tags ${tags}}
"""
cwd = "ansible"
interpreter = "bash"

[[tool.poe.tasks.truenas.args]]
name = "check"
type = "boolean"
options = ["--check", "-c"]
help = "Dry-run mode (no changes made)"

[[tool.poe.tasks.truenas.args]]
name = "tags"
options = ["--tags", "-t"]
help = "Only run tasks with these tags (comma-separated)"

[tool.poe.tasks.udmp]
help = "Run the UDMP ansible playbook (pass --check for dry-run, --tags for specific tags)"
shell = """
if [[ "$(uname)" == "Darwin" ]]; then
  CTRL=inventory/control/macos.ini
else
  CTRL=inventory/control/linux.ini
fi
ansible-playbook -i inventory/targets -i "$CTRL" playbooks/udmp.yml --diff ${check:+--check} ${tags:+--tags ${tags}}
"""
cwd = "ansible"
interpreter = "bash"

[[tool.poe.tasks.udmp.args]]
name = "check"
type = "boolean"
options = ["--check", "-c"]
help = "Dry-run mode (no changes made)"

[[tool.poe.tasks.udmp.args]]
name = "tags"
options = ["--tags", "-t"]
help = "Only run tasks with these tags (comma-separated)"

[tool.poe.tasks.openclaw]
help = "Run the OpenClaw ansible playbook"
shell = """
ansible-playbook -i inventory/targets/openclaw.yml playbooks/openclaw.yml --diff ${check:+--check} ${tags:+--tags ${tags}} ${target:+-e openclaw_target=${target}}
"""
cwd = "ansible"
interpreter = "bash"

[[tool.poe.tasks.openclaw.args]]
name = "check"
type = "boolean"
options = ["--check", "-c"]
help = "Dry-run mode (no changes made)"

[[tool.poe.tasks.openclaw.args]]
name = "tags"
options = ["--tags", "-t"]
help = "Only run tasks with these tags (comma-separated)"

[[tool.poe.tasks.openclaw.args]]
name = "target"
options = ["--target"]
help = "Override play target, e.g. openclaw_local or openclaw_remote"

[tool.poe.tasks.pod042]
help = "Converge pod042, the Bunker (storage, stacks, and its own dev environment)"
shell = """
if [[ "$(hostname -s)" != "pod042" ]]; then
  printf 'pod042 must run on pod042; SSH there first.\n' >&2
  exit 1
fi
ansible-playbook -i inventory/targets/pod042.yml playbooks/pod042.yml --diff ${check:+--check} ${tags:+--tags ${tags}}
"""
cwd = "ansible"
interpreter = "bash"

[[tool.poe.tasks.pod042.args]]
name = "check"
type = "boolean"
options = ["--check", "-c"]
help = "Dry-run mode (no changes made)"

[[tool.poe.tasks.pod042.args]]
name = "tags"
options = ["--tags", "-t"]
help = "Only run tasks with these tags (comma-separated)"

[tool.poe.tasks.list-tags]
help = "List the --tags a playbook offers (defaults to this machine's own)"
cmd = "./scripts/list-tags.sh ${playbook}"

[[tool.poe.tasks.list-tags.args]]
name = "playbook"
positional = true
help = "Playbook to inspect: macos, work, truenas, udmp, pod042"

# Chezmoi tasks
[tool.poe.tasks.cz-diff]
help = "Show what chezmoi would change (source → home), excluding lockfiles"
cmd = "./scripts/chezmoi-diff.sh"

[tool.poe.tasks.cz-status]
help = "Show files that differ between source and home"
cmd = "chezmoi status"

[tool.poe.tasks.cz-re-add]
help = "Update source from local changes (dry-run unless --apply)"
shell = "if [ \"$apply\" = \"true\" ]; then chezmoi re-add; else chezmoi re-add --dry-run; fi"

[[tool.poe.tasks.cz-re-add.args]]
name = "apply"
type = "boolean"
options = ["--apply", "-a"]
help = "Actually apply changes (default: dry-run)"

[tool.poe.tasks.cz-managed]
help = "List all files managed by chezmoi"
cmd = "chezmoi managed"

[tool.poe.tasks.cz-edit]
help = "Edit a managed file in source dir"
cmd = "chezmoi edit"
args = [{ name = "file", positional = true, required = true }]

# Git tasks
[tool.poe.tasks.pull]
help = "Git pull --rebase (handles lockfile local-only conflicts on work machine)"
shell = """
if [ "$(hostname -s)" = "ML-DFC6YK6VJQ" ]; then
  set -e
  locks="uv.lock chezmoi/private_dot_pi/agent/extensions/package-lock.json chezmoi/private_dot_pi/agent/permissions/package-lock.json"
  pyproject_bak=$(mktemp)
  cp pyproject.toml "$pyproject_bak"
  trap 'cp -f "$pyproject_bak" pyproject.toml; rm -f "$pyproject_bak"; git update-index --skip-worktree $locks' EXIT
  git update-index --no-skip-worktree $locks
  git checkout -- $locks
  git pull --rebase
  # Re-resolve the masked lock against Artifactory wheel-only, backing off any
  # release the mirror lacks a macOS-arm64 wheel for. See README.work.md.
  uv run --no-project --with tomlkit python scripts/work_lock_environment.py pyproject.toml
  uv lock --no-build
  cp -f "$pyproject_bak" pyproject.toml
  uv sync --dev
else
  git pull --rebase
fi
"""
interpreter = "bash"

# Terraform tasks
[tool.poe.tasks.tfi]
help = "Terraform init"
cmd = "tofu init"
cwd = "terraform/cloudflare"

[tool.poe.tasks.tfp]
help = "Terraform plan"
cmd = "tofu plan"
cwd = "terraform/cloudflare"

[tool.poe.tasks.tfa]
help = "Terraform apply (pass --yes to auto-approve)"
cmd = "tofu apply ${yes:+-auto-approve}"
cwd = "terraform/cloudflare"

[[tool.poe.tasks.tfa.args]]
name = "yes"
type = "boolean"
options = ["--yes", "-y"]
help = "Auto-approve the apply (no confirmation prompt)"

# Cloudflare Pages deployment
[tool.poe.tasks.pages-deploy]
help = "Deploy Cloudflare Pages (tesla)"
cmd = "wrangler pages deploy"
cwd = "cloudflare-pages/tesla"

# Cloudflare Workers
[tool.poe.tasks.wrangler]
help = "Deploy all Workers (aig + hooks)"
sequence = ["wrangler:aig", "wrangler:hooks"]

[tool.poe.tasks."wrangler:aig"]
help = "Deploy aig Worker via Wrangler (includes secret management)"
script = "scripts.aig_deploy:main(force_secret)"

[[tool.poe.tasks."wrangler:aig".args]]
name = "force_secret"
type = "boolean"
options = ["--force-secret", "-f"]
help = "Update secrets even if they exist"

[tool.poe.tasks."wrangler:hooks"]
help = "Deploy hooks Worker via Wrangler (includes secret management)"
script = "scripts.hooks_deploy:main(force_secret)"

[[tool.poe.tasks."wrangler:hooks".args]]
name = "force_secret"
type = "boolean"
options = ["--force-secret", "-f"]
help = "Update secrets even if they exist"

[dependency-groups]
dev = [
  "ansible-lint>=25.12.1",
  "poethepoet>=0.34.0",
  "pre-commit>=4.5.1",
  "ruff>=0.11.7",
  "basedpyright>=1.31.7",
  "mypy>=1.19.1",
  "json-with-comments>=1.2.10",
  "pytest>=9.0.2",
  "python-dotenv>=1.2.1",
  "tomlkit>=0.13.2",
]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv", ".git", "build", "stubs"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line too long (handled by line-length)
]

[tool.ruff.lint.per-file-ignores]
# Ansible modules have DOCUMENTATION before imports (required structure)
"ansible/collections/**/modules/*.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Basedpyright configuration
[tool.basedpyright]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  ".venv",
  "build",
  "dist",
  "stubs",
  # Research prototypes import tools this repo deliberately does not depend on, so
  # every import is unresolvable here by design. Judging them is the trial's job.
  "docs/wayfinding/**/prototypes",
]
# Ansible filter plugins aren't proper Python packages; this lets tests import them
extraPaths = ["ansible/roles/agent_harness/filter_plugins"]
stubPath = "stubs"
typeCheckingMode = "strict"
pythonVersion = "3.14"
pythonPlatform = "Linux"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["ansible/roles/agent_harness/tests", "tests"]
addopts = "-ra -q --tb=short --strict-markers"
filterwarnings = ["error"]
markers = ["unit: marks tests as unit tests (fast, no external dependencies)"]
