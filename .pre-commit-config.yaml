repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.2
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: bash -c 'cd ansible && uv run ansible-lint'
        language: system
        types: [yaml]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^ansible/collections/

      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^ansible/collections/

      - id: basedpyright
        name: basedpyright type checking
        entry: uv run basedpyright
        language: system
        types: [python]
        files: ^ansible/collections/
        pass_filenames: false
