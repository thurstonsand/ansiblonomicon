name: DDNS IP Change - Tofu Apply

on:
  repository_dispatch:
    types: [ddns-ip-changed]
  workflow_dispatch:
  schedule:
    # Daily safety net at 6 AM UTC
    - cron: "0 6 * * *"

permissions:
  contents: read

# An apply runs to completion; the next one waits for it rather than racing it on the state.
concurrency:
  group: ddns-tofu-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform/cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: v1.13.1

      - name: Tofu Init
        run: tofu init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Tofu Apply (targeted)
        run: |
          tofu apply -auto-approve \
            -target=cloudflare_dns_record.home_ip \
            -target=cloudflare_zero_trust_access_policy.home_network_bypass \
            -target=cloudflare_dns_record.tunnel_ssh_app
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_parent_home_ip: ${{ secrets.PARENT_HOME_IP }}
