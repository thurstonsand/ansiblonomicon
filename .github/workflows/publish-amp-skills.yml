name: Publish Amp Skills and Plugins

on:
  push:
    branches: [main]
    paths:
      - agents/homelab/.claude-plugin/plugin.json
      - agents/homelab/skills/**
      - agents/project-management/.claude-plugin/plugin.json
      - agents/project-management/agents/code-review.md
      - agents/project-management/skills/**
      - '!agents/project-management/skills/notify/**'
      - bootstrap/capabilities/agent-harness/amp-plugins/**
      - bootstrap/capabilities/agent-harness/agent_harness_deploy.py
      - bootstrap/capabilities/agent-harness/catalogue.py
      - bootstrap/capabilities/agent-harness/catalogue.toml
      - bootstrap/capabilities/agent-harness/harness_filters.py
      - bootstrap/capabilities/agent-harness/harnesses/amp/mise.toml
      - bootstrap/capabilities/agent-harness/models.yml
      - bootstrap/capabilities/agent-harness/profiles.toml
      - bootstrap/capabilities/agent-harness/publish_amp_skills.py
      - bootstrap/capabilities/agent-harness/render_amp_plugins.py
      - scripts/publish-amp-plugins.sh
      - scripts/publish-amp-skills.sh
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A publish runs to completion; the next one waits for it rather than racing it on the hosted state.
concurrency:
  group: publish-amp-skills

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.15"

      - name: Install Amp
        shell: bash
        run: |
          curl -fsSL https://ampcode.com/install.sh | bash
          echo "$HOME/.amp/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Test Amp plugins and publishing
        run: |
          node --test bootstrap/capabilities/agent-harness/configuration/tests/amp-hooks.test.mjs
          uv run --no-sync python -m unittest discover -s bootstrap/capabilities/agent-harness/configuration/tests -v

      - name: Publish Amp plugins
        run: scripts/publish-amp-plugins.sh

      - name: Publish Amp skills
        run: scripts/publish-amp-skills.sh
