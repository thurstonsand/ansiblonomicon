name: Publish Amp Skills

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-amp-skills.yml
      - agents/**
      - bootstrap/capabilities/agent-harness/**
      - pyproject.toml
      - scripts/publish-amp-skills.sh
      - uv.lock
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"

      - name: Install Amp
        run: |
          curl -fsSL https://ampcode.com/install.sh | bash
          echo "$HOME/.amp/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Publish Amp skills
        run: scripts/publish-amp-skills.sh

      - name: Check Amp mode pins
        run: uv run --no-sync python bootstrap/capabilities/agent-harness/amp_modes.py check
