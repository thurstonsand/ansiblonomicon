name: Publish Amp Skills and Plugins

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-amp-skills.yml
      - agents/**
      - bootstrap/capabilities/agent-harness/**
      - pyproject.toml
      - scripts/publish-amp-plugins.sh
      - scripts/publish-amp-skills.sh
      - uv.lock
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.15"

      - name: Install Amp
        run: |
          curl -fsSL https://ampcode.com/install.sh | bash
          echo "$HOME/.amp/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Test Amp plugins and publishing
        run: |
          node --test bootstrap/capabilities/agent-harness/configuration/tests/amp-hooks.test.mjs
          uv run --no-sync python -m unittest discover -s bootstrap/capabilities/agent-harness/configuration/tests -v

      - name: Publish Amp plugins
        run: scripts/publish-amp-plugins.sh

      - name: Publish Amp skills
        run: scripts/publish-amp-skills.sh

      - name: Check Amp mode pins
        run: uv run --no-sync python bootstrap/capabilities/agent-harness/amp_modes.py check
